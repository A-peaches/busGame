<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>멍냥이의 버스여행</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6dd92">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>
<div id="app">

  <!-- ================= 메인 화면 ================= -->
  <section class="screen" id="menu">
    <!-- 계절 풍경 (자바스크립트가 그려요) -->
    <svg class="scene" id="skyLayer" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <img class="scene" id="land" alt="" draggable="false">
    <svg class="scene" id="busLive" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="pointer-events:none"></svg>
    <div class="sky" id="sky"></div>
    <div class="tint" id="tint"></div>
    <div id="mapScroll"><div id="mapInner"><img id="mapRoad" alt="" draggable="false"></div></div>
    <div class="fx" id="fx"></div>

    <div class="hello" id="hello"></div>
    <div class="weather" id="weather"></div>
    <div class="hearts" id="hearts"></div>
    <button class="round settingsBtn" id="settingsBtn" title="설정"></button>
    <button class="round" id="helpBtn" title="설명서"></button>
    <button class="round" id="friendsBtn" title="친구"></button>
    <button class="round" id="mailBtn" title="우편함"></button>
  </section>

  <!-- ================= 게임 화면 ================= -->
  <section class="screen hidden" id="game">
    <header>
      <button class="round" id="homeBtn" title="지도로">⌂</button>
      <div id="title">
        <div id="levelLabel">1단계</div>
        <div id="leftLabel">남은 승객 0명</div>
      </div>
      <div class="hbtns">
        <button class="round settingsBtn" id="settingsBtn2" title="설정"></button>
      </div>
    </header>
    <div id="stage"><canvas id="cv"></canvas></div>
    <footer>
      <button class="booster" id="slotBtn">+ 자리 추가<span class="cnt" id="slotCnt">1</span></button>
      <button class="booster" id="liftBtn">크레인<span class="cnt" id="liftCnt">1</span></button>
    </footer>
  </section>

  <div id="toast"></div>
  <div id="overlay"><div class="card" id="card"></div></div>
  <canvas id="confetti" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7"></canvas>
</div>

<script src="js/config.js?v=14"></script>
<script src="js/level.js?v=14"></script>
<script src="js/game.js?v=14"></script>
<script src="js/draw.js?v=14"></script>
<script src="js/ui.js?v=14"></script>
<script src="js/scene.js?v=14"></script>
<script src="js/world.js?v=14"></script>
<script src="js/net.js?v=14"></script>
<script src="js/audio.js?v=14"></script>
<script src="js/main.js?v=14"></script>
</body>
</html>
