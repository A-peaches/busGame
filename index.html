  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
// 화면의 모든 버튼에 "톡" 피아노 소리
document.addEventListener('click', e => { if (e.target.closest('button')) sfx('click'); }, true);
// 브라우저는 사용자가 한 번 터치해야 소리를 낼 수 있어서, 첫 터치 때 배경음악을 시작해요
document.addEventListener('pointerdown', () => startBgm(), { once: true });
window.addEventListener('resize', () => { if (S) layout(); else renderMap(); });

// =====================================================================
//  매 프레임 업데이트
// =====================================================================
function update(dt) {
  if (!S) return;
  S.time += dt;

  for (const v of S.vehicles) {
    if (v.pop < 1) v.pop = Math.min(1, v.pop + dt * 4);
    if (v.shake > 0) v.shake -= dt;

    if (v.state === 'parked' && v.bump) {
      const b = v.bump;
      b.t += dt;
      if (b.t >= b.T) { v.bump = null; v.off = 0; }
      else {
        const u = b.t / b.T, peak = b.d + 0.15;
        v.off = u < 0.45 ? peak * easeOut(u / 0.45) : peak * (1 - easeIn((u - 0.45) / 0.55));
      }
    } else if (v.state === 'exiting') {
      v.off += dt * 22;
      if (v.off >= v.exitDist) {
        const a = axes(v.ang);
        v.from = {
          x: L.bx + (v.cx + a.ux * v.off) * L.cs, y: L.by + (v.cy + a.uy * v.off) * L.cs,
          a: v.ang, w: v.w * L.cs, l: v.l * L.cs,
        };
        v.state = 'toSlot';
        v.t = 0;
      }
    } else if (v.state === 'toSlot') {
      v.t += dt / (v.lifted ? 0.55 : 0.32);
      if (v.t >= 1) { v.t = 1; v.state = 'slot'; }
    } else if (v.state === 'slot') {
      if (v.filled >= v.cap && v.incoming === 0) {
        v.state = 'departing'; v.t = 0; v.left = false;
        const p = slotPos(v.slot); v.depX = p.x; v.depY = p.y;
        sfx('depart');
      }
    } else if (v.state === 'departing') {
      // 칸에서 아래 찻길로 빠져나와 오른쪽으로 신나게 떠나요
      v.t += dt / 1.9;
      if (!v.left && v.t >= 0.22) { v.left = true; S.slots[v.slot] = null; }   // 칸은 먼저 비워 줘요
      if (v.t >= 1) { v.state = 'gone'; checkWin(); }
    }
  }

  // 원이 빙글빙글 돌고, 빈자리가 입구를 지나가면 기다리던 승객이 들어갑니다
  // 가운데 나무를 누르면 잠깐 빨리감기 (줄이 빠르게 하트 길로 들어와요)
  if (S.rush > 0) S.rush -= dt;
  if (S.treeShake > 0) S.treeShake -= dt;
  const fast = S.rush > 0 ? 3.5 : 1;
  S.ringOff = (S.ringOff + dt * L.pr * 3.2 * fast) % L.ring.total;
  for (let k = 0; k < S.ring.length; k++) {
    if (!S.ring[k] && S.waiting.length && ringS(k) < L.ringSp * 0.7) S.ring[k] = S.waiting.shift();
  }

  // 승객 태우기: 원 위에 있는 승객은 누구든 같은 색 버스에 탈 수 있어요
  S.boardTimer -= dt;
  if (S.boardTimer <= 0) {
    let pick = null, best = Infinity;
    S.ring.forEach((p, k) => {
      if (!p || p.x === undefined) return;
      const v = bestVehicleFor(p.color);
      const d = (p.x - L.exitX) ** 2 + (p.y - L.exitY) ** 2;   // 출구에 가까운 친구부터
      if (v && d < best) { best = d; pick = { k, p, v }; }
    });
    if (pick) {
      const { k, p, v } = pick;
      S.ring[k] = null;
      v.incoming++;
      // 버스까지 걸어가는 친구 (눈이 반짝반짝!)
      S.flying.push({ color: p.color, kind: p.kind, bag: p.bag, ribbon: p.ribbon, id: p.id, path: walkRoute(p, v, ringS(k)), s: 0, v });
      S.boardTimer = S.rush > 0 ? 0.02 : 0.06;   // 나무를 누른 동안엔 더 빨리 차례차례 출발
      sfx('board', v.filled + v.incoming);
      updateUI();
    }
  }

  let landed = false;
  for (const f of S.flying) {
    f.s += dt * L.pr * 14 * (S.rush > 0 ? 2.5 : 1);   // 나무를 누른 동안엔 버스까지 더 빨리 걸어가요
    if (f.s >= f.path.total) { f.v.filled++; f.v.incoming--; landed = true; f.done = true; }
  }
  S.flying = S.flying.filter(f => !f.done);
  if (landed) updateUI();

  // 승객들이 자기 자리로 걸어가기
  const k = Math.min(1, dt * 10 * (S.rush > 0 ? 3 : 1));
  const walkTo = (p, t) => {
    if (p.x === undefined) { p.x = t.x; p.y = t.y; }
    const dx = t.x - p.x, dy = t.y - p.y;
    p.x += dx * k; p.y += dy * k;
    p.walking = Math.abs(dx) + Math.abs(dy) > 1.5;
  };
  S.ring.forEach((p, i) => { if (p) walkTo(p, pathPoint(L.ring, ringS(i))); });
  S.waiting.forEach((p, i) => {
    if (i < L.waitMax) walkTo(p, pathPoint(L.wait, (i + 1) * L.sp));
    else p.x = undefined;
  });

  checkLose();
}

function checkWin() {
  if (S.over) return;
  if (remainingCount() === 0 && S.vehicles.every(v => v.state === 'gone')) {
    S.over = true;
    if (S.level + 1 > unlocked) { unlocked = S.level + 1; store.set('busGame.unlocked', unlocked); }
    sfx('win');
    setTimeout(() => showOverlay('win'), 350);
  }
}

function checkLose() {
  if (S.over || S.flying.length || !remainingCount()) return;
  if (S.vehicles.some(v => ['exiting', 'toSlot', 'departing'].includes(v.state))) return;
  if (S.vehicles.some(v => v.state === 'slot' && v.filled >= v.cap)) return;
  for (let i = 0; i < S.slotCount; i++) if (!S.slots[i]) return;
  // 원에 빈자리가 있고 기다리는 승객이 있으면 아직 채워지는 중
  if (S.waiting.length && S.ring.some(p => !p)) return;
  // 원 위의 누군가가 탈 수 있으면 아직 진행 중
  if (S.ring.some(p => p && bestVehicleFor(p.color))) return;
  S.over = true;
  sfx('lose');
  setTimeout(() => showOverlay('lose'), 400);
}

// =====================================================================
//  그리기
// =====================================================================
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
// 아스팔트의 자잘한 알갱이 (항상 같은 자리에 찍히도록 고정 난수)
function drawSpeckles(x, y, w, h, n) {
  const R = mulberry32(Math.round(w * 7 + h));
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = R() < 0.5 ? 'rgba(255,255,255,.1)' : 'rgba(40,35,30,.08)';
    ctx.fillRect(x + 6 + R() * (w - 12), y + 6 + R() * (h - 12), 1.6, 1.6);
  }
}

function drawVehicle(x, y, a, w, l, colorIdx, hidden, o = {}) {
  const C = hidden ? HIDDEN_COLOR : COLORS[colorIdx];
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  if (o.scale) ctx.scale(o.scale, o.scale);
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;

  const lw = 1, R = w * 0.3;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  // 땅에 드리운 옅은 그림자
  ctx.fillStyle = 'rgba(70,50,30,.16)';
  rr(-w / 2 + 1.5, -l / 2 + 2.5, w, l, R); ctx.fill();

  // 차체: 무광, 양옆이 살짝 어두워 둥근 부피감 + 얇은 갈색 테두리
  const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  g.addColorStop(0, C.d); g.addColorStop(0.24, C.c); g.addColorStop(0.76, C.c); g.addColorStop(1, C.d);
  ctx.fillStyle = g;
  rr(-w / 2, -l / 2, w, l, R); ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = lw; ctx.stroke();

  // 옛날 시골버스 같은 투톤 지붕
  ctx.fillStyle = 'rgba(250,240,222,.3)';
  rr(-w * 0.31, -l / 2 + w * 0.46, w * 0.62, l - w * 0.9, w * 0.14); ctx.fill();
  ctx.strokeStyle = 'rgba(112,104,96,.4)'; ctx.lineWidth = lw * 0.7; ctx.stroke();

  // 옆 창문 (위에서 보면 가장자리에 줄지어 보여요)
  const span = l - w * 0.95, n = Math.max(1, Math.floor(span / (w * 0.34))), step = span / n;
  ctx.fillStyle = 'rgba(120,140,146,.85)';
  for (let i = 0; i < n; i++) {
    const yy = -l / 2 + w * 0.5 + step * (i + 0.15);
    for (const s of [-1, 1]) { rr(s * w * 0.43 - w * 0.04, yy, w * 0.08, step * 0.7, 1); ctx.fill(); }
  }
  // 앞유리 / 뒷유리
  ctx.fillStyle = '#7f9195';
  rr(-w * 0.36, -l / 2 + w * 0.1, w * 0.72, w * 0.24, w * 0.07); ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = lw * 0.75; ctx.stroke();
  ctx.fillStyle = '#8d9ea1';
  rr(-w * 0.3, l / 2 - w * 0.27, w * 0.6, w * 0.13, w * 0.05); ctx.fill(); ctx.stroke();

  if (hidden) {
    ctx.rotate(-a);
    ctx.font = `700 ${w * 0.62}px MaruBuri, serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = LINE; ctx.lineWidth = lw * 1.4; ctx.strokeText('?', 0, 1);
    ctx.fillStyle = '#f6ecd8'; ctx.fillText('?', 0, 1);
  } else if (o.arrow) {
    // 크림색 화살표 + 얇은 테두리
    const s = Math.min(l * 0.22, w * 0.7), hw = w * 0.25, sw = w * 0.075, hb = -s + w * 0.2;
    ctx.beginPath();
    ctx.moveTo(0, -s - w * 0.12); ctx.lineTo(hw, hb); ctx.lineTo(sw, hb); ctx.lineTo(sw, s);
    ctx.lineTo(-sw, s); ctx.lineTo(-sw, hb); ctx.lineTo(-hw, hb); ctx.closePath();
    ctx.fillStyle = '#fbf3e2'; ctx.fill();
    ctx.strokeStyle = LINE; ctx.lineWidth = lw * 0.8; ctx.stroke();
  } else if (o.seats !== undefined && o.seats !== null) {
    // 남은 좌석 수를 지붕에 크게
    ctx.rotate(-a);
    const tw = w * 0.82, th = w * 0.62;
    rr(-tw / 2, -th / 2, tw, th, th * 0.35);
    ctx.fillStyle = 'rgba(251,246,234,.95)'; ctx.fill();
    ctx.strokeStyle = LINE; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#5a4a3a';
    ctx.font = `700 ${w * (o.seats >= 10 ? 0.4 : 0.48)}px MaruBuri, serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(o.seats), 0, 1);
  }
  if (o.capLabel && !hidden) {
    // 주차된 버스: 꼬리 쪽에 작은 숫자로 정원 표시
    ctx.save();
    ctx.translate(0, l / 2 - w * 0.48);
    ctx.rotate(-a);
    ctx.font = `700 ${w * 0.3}px MaruBuri, serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(90,80,70,.7)'; ctx.lineWidth = 2; ctx.strokeText(String(o.capLabel), 0, 0.5);
    ctx.fillStyle = '#fbf3e2'; ctx.fillText(String(o.capLabel), 0, 0.5);
    ctx.restore();
  }
  ctx.restore();
}

function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }

// 색 섞기 (밝은 털색 / 그늘진 털색 만들기)
function mixHex(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const lightOf = C => C.l || (C.l = mixHex(C.c, '#fff8ec', 0.4));
const shadeOf = C => C.s || (C.s = mixHex(C.c, C.d, 0.55));

// 고양이 / 강아지 승객 (발 위치 기준)
// 생각 말풍선: 고양이는 생선, 강아지는 뼈다귀
function drawThought(x, headTop, r, kind) {
  const bx = x + r * 1.05, by = headTop - r * 1.5;
  const puffs = [[0, 0, 1], [-0.85, 0.15, 0.7], [0.85, 0.15, 0.7], [-0.4, -0.45, 0.72], [0.4, -0.45, 0.72], [0, 0.45, 0.7]];
  const drawPuffs = () => puffs.forEach(([dx, dy, k]) => { ctx.beginPath(); ctx.arc(bx + dx * r, by + dy * r, r * 0.62 * k, 0, Math.PI * 2); ctx[mode](); });
  let mode = 'stroke';
  ctx.strokeStyle = LINE; ctx.lineWidth = 2;
  drawPuffs();
  for (const [dx, dy, k] of [[0.3, 1.25, 0.16], [0.6, 0.95, 0.24]]) { ctx.beginPath(); ctx.arc(x + dx * r, headTop + (dy - 1.5) * r + r * 0.05, r * k, 0, Math.PI * 2); ctx.lineWidth = 1; ctx.stroke(); ctx.fillStyle = '#fffdf8'; ctx.fill(); }
  ctx.lineWidth = 2;
  mode = 'fill'; ctx.fillStyle = '#fffdf8';
  drawPuffs();
  ctx.lineWidth = 0.9;
  if (kind === 'cat') {
    // 생선
    ctx.beginPath(); ctx.ellipse(bx - r * 0.12, by, r * 0.62, r * 0.3, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#9dbbd3'; ctx.fill(); ctx.strokeStyle = LINE; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx + r * 0.42, by); ctx.lineTo(bx + r * 0.82, by - r * 0.28); ctx.lineTo(bx + r * 0.82, by + r * 0.28); ctx.closePath();
    ctx.fillStyle = '#9dbbd3'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2e231a'; circle(bx - r * 0.5, by - r * 0.06, r * 0.07);
  } else {
    // 뼈다귀
    ctx.fillStyle = '#f6eedc'; ctx.strokeStyle = LINE;
    ctx.beginPath();
    for (const s of [-1, 1]) for (const t of [-1, 1]) { ctx.moveTo(bx + s * r * 0.55 + r * 0.17, by + t * r * 0.15); ctx.arc(bx + s * r * 0.55, by + t * r * 0.15, r * 0.17, 0, Math.PI * 2); }
    ctx.rect(bx - r * 0.55, by - r * 0.12, r * 1.1, r * 0.24);
    ctx.stroke(); ctx.fill();
  }
}

// 줄이 시작되는 작은 집: 네모 지붕을 얹은 하얀 도자기 집 (불 켜진 아치형 창문 + 하트 무늬)
//   지붕은 벽보다 살짝 넓은 납작한 판으로, 벽 위에 그대로 얹혀 자연스럽게 이어져요
function drawHouse(x, y, s) {
  const w = s * 0.8, wallH = s * 0.6, dx = s * 0.26, dy = s * 0.15;
  const rt = s * 0.1, o = s * 0.06;                       // 지붕 두께, 처마가 벽 밖으로 나온 길이
  const L = x - w / 2, Rr = x + w / 2, top = y - wallH;
  const glow = (fn) => { ctx.save(); ctx.shadowColor = 'rgba(255,196,110,.95)'; ctx.shadowBlur = s * 0.2; fn(); ctx.restore(); };
  const poly = (pts, fill) => { ctx.beginPath(); pts.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); };
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = LINE; ctx.lineWidth = 1;

  // 바닥 그림자 + 바닥에 번지는 불빛
  ctx.fillStyle = 'rgba(70,55,40,.18)'; ell(x + dx * 0.4, y + s * 0.02, w * 0.72, s * 0.07);
  ctx.fillStyle = 'rgba(255,205,120,.18)'; ell(x, y + s * 0.03, w * 0.5, s * 0.05);

  // 옆벽 (그늘) → 앞벽
  poly([[Rr, y], [Rr + dx, y - dy], [Rr + dx, top - dy], [Rr, top]], '#ddd7cc');
  const g = ctx.createLinearGradient(L, top, Rr, y);
  g.addColorStop(0, '#fbf9f4'); g.addColorStop(1, '#ebe6dc');
  poly([[L, y], [L, top], [Rr, top], [Rr, y]], g);

  // 네모 지붕: 윗면 → 옆면 → 앞면 (앞면이 벽 꼭대기를 덮어 이음새가 자연스러워요)
  const rl = L - o, rr2 = Rr + o, rb = top + rt * 0.25, rtp = rb - rt;
  poly([[rl, rtp], [rr2, rtp], [rr2 + dx, rtp - dy], [rl + dx, rtp - dy]], '#f3dccb');
  poly([[rr2, rtp], [rr2 + dx, rtp - dy], [rr2 + dx, rb - dy], [rr2, rb]], '#d8b9a2');
  poly([[rl, rtp], [rr2, rtp], [rr2, rb], [rl, rb]], '#e8c9b3');
  const R = mulberry32(31);                                // 유약이 반짝이는 작은 점
  for (let i = 0; i < 10; i++) {
    const t = R(), u = R();
    ctx.fillStyle = `rgba(255,255,255,${f1(0.5 + R() * 0.5)})`;
    circle(lerp(rl, rr2, t) + dx * u, rtp - dy * u, s * 0.01 + R() * s * 0.01);
  }

  // 불 켜진 아치형 창문 두 개 (십자 창살)
  for (const cx of [x - w * 0.23, x + w * 0.23]) {
    const ww = w * 0.22, wh = wallH * 0.42, wy = y - wallH * 0.14 - wh;
    glow(() => {
      ctx.beginPath(); ctx.moveTo(cx - ww / 2, wy + wh); ctx.lineTo(cx - ww / 2, wy + ww / 2);
      ctx.arc(cx, wy + ww / 2, ww / 2, Math.PI, 0); ctx.lineTo(cx + ww / 2, wy + wh); ctx.closePath();
      ctx.fillStyle = '#ffd98c'; ctx.fill();
    });
    ctx.strokeStyle = '#f3efe7'; ctx.lineWidth = Math.max(1, ww * 0.14);
    ctx.beginPath(); ctx.moveTo(cx, wy); ctx.lineTo(cx, wy + wh); ctx.moveTo(cx - ww / 2, wy + wh * 0.5); ctx.lineTo(cx + ww / 2, wy + wh * 0.5); ctx.stroke();
    ctx.strokeStyle = LINE; ctx.lineWidth = 1;
  }

  // 벽 위쪽 가운데의 빛나는 하트 + 둘레의 작은 점들
  const hx = x, hy = top + wallH * 0.24, hs = s * 0.065;
  glow(() => {
    ctx.beginPath();
    ctx.moveTo(hx, hy + hs * 0.9);
    ctx.bezierCurveTo(hx - hs * 1.3, hy + hs * 0.1, hx - hs * 0.9, hy - hs * 1.0, hx, hy - hs * 0.35);
    ctx.bezierCurveTo(hx + hs * 0.9, hy - hs * 1.0, hx + hs * 1.3, hy + hs * 0.1, hx, hy + hs * 0.9);
    ctx.fillStyle = '#ffd98c'; ctx.fill();
    ctx.fillStyle = '#ffe3a6';
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i / 10) * Math.PI * 2;
      circle(hx + Math.cos(a) * hs * 1.9, hy + Math.sin(a) * hs * 1.8, s * 0.012);
    }
  });
}

// 고양이 / 강아지 승객 (발 위치 기준)
//   opts: bag(분홍 보따리) ribbon(리본 색) sleep(쿨쿨) excited(버스 타러 가는 중: 눈이 초롱초롱)
function drawAnimal(x, y, r, colorIdx, kind, bob = 0, phase = 0, opts = {}) {
  const C = COLORS[colorIdx], LT = lightOf(C), SH = shadeOf(C);
  const lw = 0.9 * LW_SCALE;
  const line = (w = lw) => { ctx.strokeStyle = LINE; ctx.lineWidth = w; ctx.stroke(); };
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.fillStyle = 'rgba(70,50,30,.2)';
  ell(x, y + r * 0.45, r * 0.92, r * 0.3);
  y -= bob;
  // 위에서 살짝 누른 듯 좌우로 통통하게
  ctx.save();
  ctx.translate(x, y); ctx.scale(1.15, 0.9); ctx.translate(-x, -y);

  // 꼬리 (몸 뒤에 그려요)
  const tt = performance.now() / 1000 + phase;
  if (kind === 'cat') {
    const sw = Math.sin(tt * (opts.sleep ? 0.8 : 2.6));
    const tx = x + r * (1.25 + sw * 0.15), ty = y - r * (0.85 + sw * 0.1);
    ctx.beginPath();
    ctx.moveTo(x + r * 0.35, y - r * 0.05);
    ctx.bezierCurveTo(x + r * 1.15, y + r * 0.1, x + r * (1.35 + sw * 0.25), y - r * 0.35, tx, ty);
    ctx.strokeStyle = LINE; ctx.lineWidth = r * 0.3 + lw * 2; ctx.stroke();
    ctx.strokeStyle = C.c; ctx.lineWidth = r * 0.3; ctx.stroke();
  } else {
    const wag = Math.sin(tt * (opts.sleep ? 2 : opts.excited ? 22 : 14)) * 0.35;
    ctx.save();
    ctx.translate(x + r * 0.42, y - r * 0.15);
    ctx.rotate(-0.55 + wag);
    ctx.beginPath(); ctx.ellipse(r * 0.38, 0, r * 0.4, r * 0.21, 0, 0, Math.PI * 2);
    ctx.fillStyle = C.c; ctx.fill(); line();
    ctx.restore();
  }
  // 발 (몸 아래)
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(x + s * r * 0.25, y + r * 0.42, r * 0.17, r * 0.11, 0, 0, Math.PI * 2);
    ctx.fillStyle = C.c; ctx.fill(); line(lw * 0.8);
  }

  const hx = x, hy = y - r * 1.2, hr = r * 1.02;
  const bodyPath = () => rr(x - r * 0.52, y - r * 0.55, r * 1.04, r * 1.0, r * 0.48);
  const headPath = () => { ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); };
  const catEar = s => {
    ctx.beginPath();
    ctx.moveTo(hx + s * hr * 0.95, hy - hr * 0.1); ctx.lineTo(hx + s * hr * 0.75, hy - hr * 1.22); ctx.lineTo(hx + s * hr * 0.12, hy - hr * 0.75);
    ctx.closePath();
  };
  const dogEar = s => { ctx.beginPath(); ctx.ellipse(hx + s * hr * 0.86, hy + hr * 0.08, hr * 0.3, hr * 0.6, -s * 0.35, 0, Math.PI * 2); };
  const ear = kind === 'cat' ? catEar : dogEar;

  // 한 덩어리 실루엣: 몸·귀·머리의 바깥 테두리를 먼저 굵게 긋고, 그 위를 색으로 채워요.
  // → 겉 테두리만 남고, 몸과 얼굴 / 귀와 얼굴이 이어지는 안쪽에는 선이 없어요.
  ctx.strokeStyle = LINE; ctx.lineWidth = lw * 2;
  bodyPath(); ctx.stroke(); ear(-1); ctx.stroke(); ear(1); ctx.stroke(); headPath(); ctx.stroke();

  // 몸 (위는 밝고 아래는 살짝 어둡게) + 크림색 배
  const bg = ctx.createLinearGradient(0, y - r * 0.55, 0, y + r * 0.45);
  bg.addColorStop(0, LT); bg.addColorStop(0.5, C.c); bg.addColorStop(1, SH);
  bodyPath(); ctx.fillStyle = bg; ctx.fill();
  ctx.fillStyle = 'rgba(253,245,230,.75)'; ell(x, y - r * 0.02, r * 0.22, r * 0.25);

  // 귀
  for (const s of [-1, 1]) {
    ear(s); ctx.fillStyle = kind === 'cat' ? C.c : SH; ctx.fill();
    if (kind === 'cat') {
      ctx.fillStyle = '#efb5bf';
      ctx.beginPath();
      ctx.moveTo(hx + s * hr * 0.78, hy - hr * 0.38); ctx.lineTo(hx + s * hr * 0.7, hy - hr * 0.95); ctx.lineTo(hx + s * hr * 0.38, hy - hr * 0.72);
      ctx.closePath(); ctx.fill();
    }
  }

  // 머리: 왼쪽 위에서 햇빛이 드는 듯 부드러운 음영
  const hg = ctx.createRadialGradient(hx - hr * 0.35, hy - hr * 0.42, hr * 0.1, hx, hy, hr * 1.05);
  hg.addColorStop(0, LT); hg.addColorStop(0.65, C.c); hg.addColorStop(1, SH);
  headPath(); ctx.fillStyle = hg; ctx.fill();
  // 강아지 귀는 얼굴 위로 늘어지게: 귀를 한 번 더 칠하면 바깥 테두리는 남고 얼굴 쪽 이음새엔 선이 없어요
  if (kind === 'dog') for (const s of [-1, 1]) { dogEar(s); ctx.fillStyle = SH; ctx.fill(); }

  // 분홍 보따리 (몇몇 친구만): 막대에 매달아 어깨에 메고 있어요
  if (opts.bag) {
    ctx.beginPath(); ctx.moveTo(x + r * 0.05, y - r * 0.25); ctx.lineTo(x - r * 0.78, y - r * 1.05);
    ctx.strokeStyle = '#8f6a4d'; ctx.lineWidth = r * 0.13; ctx.stroke();
    const bx = x - r * 0.98, by = y - r * 0.78;
    ctx.beginPath(); ctx.arc(bx, by, r * 0.42, 0, Math.PI * 2);
    ctx.fillStyle = '#f2abbe'; ctx.fill(); line();
    ctx.fillStyle = 'rgba(255,250,245,.85)';
    circle(bx - r * 0.15, by + r * 0.05, r * 0.06); circle(bx + r * 0.14, by + r * 0.16, r * 0.06); circle(bx + r * 0.05, by - r * 0.17, r * 0.05);
    ctx.beginPath(); ctx.ellipse(bx + r * 0.1, by - r * 0.42, r * 0.13, r * 0.08, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = '#e897ad'; ctx.fill(); line(lw * 0.8);
  }

  // 정수리 털 한 가닥
  ctx.beginPath();
  ctx.moveTo(hx - hr * 0.08, hy - hr * 0.97);
  ctx.quadraticCurveTo(hx + hr * 0.02, hy - hr * 1.2, hx + hr * 0.2, hy - hr * 1.06);
  line(lw * 0.85);

  if (kind === 'dog') {
    ctx.beginPath(); ctx.ellipse(hx, hy + hr * 0.36, hr * 0.42, hr * 0.28, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fbf1de'; ctx.fill(); line(lw * 0.6);
    ctx.fillStyle = '#3a2c20'; ell(hx, hy + hr * 0.22, hr * 0.16, hr * 0.11);
  } else {
    ctx.fillStyle = 'rgba(253,245,230,.85)'; ell(hx, hy + hr * 0.32, hr * 0.36, hr * 0.22);
    ctx.fillStyle = '#d98490'; ell(hx, hy + hr * 0.2, hr * 0.12, hr * 0.08);
    if (r >= 7) {
      ctx.strokeStyle = 'rgba(60,40,30,.55)'; ctx.lineWidth = 0.8 * LW_SCALE;
      ctx.beginPath();
      for (const s of [-1, 1]) {
        ctx.moveTo(hx + s * hr * 0.32, hy + hr * 0.3); ctx.lineTo(hx + s * hr * 1.0, hy + hr * 0.2);
        ctx.moveTo(hx + s * hr * 0.32, hy + hr * 0.36); ctx.lineTo(hx + s * hr * 1.0, hy + hr * 0.46);
      }
      ctx.stroke();
    }
  }
  // 발그레한 볼
  for (const s of [-1, 1]) {
    const bx = hx + s * hr * 0.56, by = hy + hr * 0.2;
    ctx.fillStyle = `rgba(255,130,160,${opts.excited ? 0.5 : 0.35})`; ell(bx, by, hr * 0.24, hr * 0.16);
    ctx.fillStyle = 'rgba(255,95,135,.6)'; ell(bx, by, hr * 0.15, hr * 0.1);
    if (r >= 7) {
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 0.7 * LW_SCALE;
      ctx.beginPath();
      ctx.moveTo(bx - hr * 0.08, by + hr * 0.04); ctx.lineTo(bx - hr * 0.02, by - hr * 0.04);
      ctx.moveTo(bx + hr * 0.02, by + hr * 0.04); ctx.lineTo(bx + hr * 0.08, by - hr * 0.04);
      ctx.stroke();
    }
  }
  // 눈
  if (opts.sad) {
    // 시무룩: 눈물이 그렁그렁 맺힌 커다란 눈 + 축 처진 눈썹 + 살짝 내려간 입 + 또르르 눈물
    const tt2 = performance.now() / 1000 + phase;
    ctx.strokeStyle = '#2e231a'; ctx.lineWidth = Math.max(1, hr * 0.06); ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      const ex = hx + s * hr * 0.34, ey = hy - hr * 0.04;
      ctx.fillStyle = '#2e231a'; ell(ex, ey, hr * 0.17, hr * 0.2);
      ctx.fillStyle = 'rgba(160,210,240,.55)'; ell(ex, ey + hr * 0.1, hr * 0.17, hr * 0.09);   // 아래에 고인 눈물
      ctx.fillStyle = '#fffaf0';
      circle(ex - hr * 0.06, ey - hr * 0.08, hr * 0.07); circle(ex + hr * 0.06, ey + hr * 0.04, hr * 0.035);
      // 시무룩한 눈썹: 가운데(안쪽)는 올라가고 바깥쪽은 축 처진 八 모양
      ctx.beginPath(); ctx.moveTo(ex - s * hr * 0.14, ey - hr * 0.44); ctx.quadraticCurveTo(ex + s * hr * 0.04, ey - hr * 0.4, ex + s * hr * 0.2, ey - hr * 0.28); ctx.stroke();
      // 또르르 흐르는 눈물방울
      const k = (tt2 * 0.6 + (s > 0 ? 0.5 : 0)) % 1, dy = hr * (0.2 + k * 0.45);
      ctx.globalAlpha = 1 - k * 0.5;
      ctx.beginPath(); ctx.moveTo(ex + s * hr * 0.1, ey + dy - hr * 0.14);
      ctx.quadraticCurveTo(ex + s * hr * 0.21, ey + dy + hr * 0.04, ex + s * hr * 0.1, ey + dy + hr * 0.09);
      ctx.quadraticCurveTo(ex + s * hr * -0.01, ey + dy + hr * 0.04, ex + s * hr * 0.1, ey + dy - hr * 0.14);
      ctx.fillStyle = '#a9d6f2'; ctx.fill(); ctx.strokeStyle = 'rgba(96,140,170,.7)'; ctx.lineWidth = Math.max(0.6, hr * 0.03); ctx.stroke();
      ctx.globalAlpha = 1; ctx.strokeStyle = '#2e231a'; ctx.lineWidth = Math.max(1, hr * 0.06);
    }
    ctx.beginPath(); ctx.arc(hx, hy + hr * 0.62, hr * 0.13, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();   // 시무룩한 입
  } else if (opts.sleep) {
    // 쿨쿨: 감은 눈 (아래로 둥근 선)
    ctx.strokeStyle = '#2e231a'; ctx.lineWidth = Math.max(1, hr * 0.08);
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(hx + s * hr * 0.34, hy - hr * 0.1, hr * 0.13, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
  } else if (opts.excited) {
    // 초롱초롱: 크고 반짝이는 눈 + 별빛
    ctx.fillStyle = '#2e231a';
    ell(hx - hr * 0.34, hy - hr * 0.06, hr * 0.18, hr * 0.21); ell(hx + hr * 0.34, hy - hr * 0.06, hr * 0.18, hr * 0.21);
    ctx.fillStyle = '#fffaf0';
    for (const s of [-1, 1]) {
      circle(hx + s * hr * 0.34 - hr * 0.06, hy - hr * 0.14, hr * 0.075);
      circle(hx + s * hr * 0.34 + hr * 0.06, hy - hr * 0.0, hr * 0.035);
    }
    const tw = 0.6 + Math.sin(tt * 10) * 0.4;
    ctx.fillStyle = `rgba(255,214,110,${f1(tw)})`;
    star(hx + hr * 1.05, hy - hr * 0.85, hr * 0.22);
  } else {
    ctx.fillStyle = '#2e231a';
    ell(hx - hr * 0.34, hy - hr * 0.05, hr * 0.14, hr * 0.17); ell(hx + hr * 0.34, hy - hr * 0.05, hr * 0.14, hr * 0.17);
    // 초롱초롱: 큰 하얀 점 + 아래쪽에 작은 하얀 점 하나 더
    ctx.fillStyle = 'rgba(255,252,245,.95)';
    for (const s of [-1, 1]) {
      circle(hx + s * hr * 0.34 - hr * 0.045, hy - hr * 0.11, hr * 0.055);
      circle(hx + s * hr * 0.34 + hr * 0.05, hy + hr * 0.02, hr * 0.03);
    }
  }
  // 리본 (몇몇 친구만): 머리 위 오른쪽에 나비 모양
  if (opts.ribbon) {
    const rx = hx + hr * 0.42, ry = hy - hr * 0.92, k = hr * 0.32;
    ctx.fillStyle = opts.ribbon; ctx.strokeStyle = LINE; ctx.lineWidth = lw;
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + s * k * 1.25, ry - k * 0.7); ctx.lineTo(rx + s * k * 1.25, ry + k * 0.7); ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(rx, ry, k * 0.32, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
// 작은 반짝이 별
function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4, k = i % 2 ? r * 0.35 : r;
    ctx.lineTo(x + Math.cos(a) * k, y + Math.sin(a) * k);
  }
  ctx.closePath(); ctx.fill();
}

function vehiclePose(v) {
  if (v.state === 'parked' || v.state === 'exiting') {
    const a = axes(v.ang);
    const shake = v.shake > 0 ? Math.sin(v.shake * 60) * 3 : 0;
    const pop = v.pop < 1 ? 1 + Math.sin(v.pop * Math.PI) * 0.15 : 1;
    return {
      x: L.bx + (v.cx + a.ux * v.off) * L.cs + shake, y: L.by + (v.cy + a.uy * v.off) * L.cs,
      a: v.ang, w: v.w * L.cs, l: v.l * L.cs, scale: pop,
    };
  }
  const p = slotPos(v.slot), s = slotSize(v);
  if (v.state === 'toSlot') {
    const e = easeInOut(v.t), f = v.from;
    const lift = v.lifted ? 1 + Math.sin(v.t * Math.PI) * 0.3 : 1;
    return {
      x: lerp(f.x, p.x, e), y: lerp(f.y, p.y, e), a: f.a + normAng(-f.a) * e,
      w: lerp(f.w, s.w, e), l: lerp(f.l, s.l, e), scale: lift,
    };
  }
  if (v.state === 'departing') {
    if (v.t < 0.22) {   // 칸에서 아래 찻길로 빠져나오며 오른쪽으로 방향을 틀어요
      const u = easeInOut(v.t / 0.22);
      return { x: v.depX + u * s.w * 0.3, y: lerp(v.depY, L.roadY, u), a: u * Math.PI / 2, w: s.w, l: s.l };
    }
    const u = easeIn((v.t - 0.22) / 0.78);
    return { x: lerp(v.depX + s.w * 0.3, L.W + s.l, u), y: L.roadY, a: Math.PI / 2, w: s.w, l: s.l };
  }
  return { x: p.x, y: p.y, a: 0, w: s.w, l: s.l };
}

function drawQueueArea() {
  // 풀밭
  // 풀밭 색도 메인 화면의 계절을 따라가요
  const SP = SEASONS[season];
  const g = ctx.createLinearGradient(0, L.qTop, 0, L.qTop + L.qH);
  g.addColorStop(0, SP.meadow[0]); g.addColorStop(1, SP.meadow[1]);
  ctx.fillStyle = g;
  rr(8, L.qTop, L.W - 16, L.qH, 18); ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1; ctx.stroke();
  for (const [x, y, k] of L.tufts) {
    if (k < 0.75 || !SP.flowers.length) {
      ctx.strokeStyle = SP.grass[Math.floor(k * 7) % SP.grass.length]; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(x - 3, y + 3); ctx.lineTo(x - 1, y - 3); ctx.moveTo(x, y + 3); ctx.lineTo(x + 2, y - 4); ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + 5, y - 2); ctx.stroke();
    } else {
      ctx.fillStyle = SP.flowers[Math.floor(k * 13) % SP.flowers.length]; circle(x, y, 2.2);
    }
  }

  // 대기 줄 길 + 원형 길: 테두리를 먼저 둘 다 그리고 흙길을 위에 덮어서
  // 두 길이 만나는 곳에는 경계선 없이 하나로 이어져 보여요
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const waitPath = () => { ctx.beginPath(); L.wait.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); };
  const polyPath = pts => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); };
  // 하트 가운데 잔디 섬을 길보다 "먼저" 칠해요 → 하트 위쪽 움푹한 곳에서도 길 테두리가 가려지지 않아요
  polyPath(L.islandPts);
  ctx.fillStyle = SP.meadow[0]; ctx.fill();
  const ringPath = () => polyPath(L.ringPts);   // 하트 모양 길
  const exitPath = () => { ctx.beginPath(); ctx.moveTo(L.exitX, L.exitY); ctx.lineTo(L.exitX, L.qTop + L.qH); };
  const dirt = season === 'winter' ? '#eef1f4' : '#ebd8b2';
  // 길 끝(패널 경계에 닿는 곳)은 평평하게 잘라서 양쪽 테두리가 경계선까지 쭉 이어지게
  ctx.save(); rr(8, L.qTop, L.W - 16, L.qH, 18); ctx.clip();
  ctx.strokeStyle = LINE; ctx.lineWidth = L.laneW + 2;   // 길 양쪽 테두리 1px씩
  ctx.lineCap = 'butt'; waitPath(); ctx.stroke(); exitPath(); ctx.stroke(); ctx.lineCap = 'round'; ringPath(); ctx.stroke();
  ctx.strokeStyle = dirt; ctx.lineWidth = L.laneW;
  ctx.lineCap = 'butt'; waitPath(); ctx.stroke(); exitPath(); ctx.stroke(); ctx.lineCap = 'round'; ringPath(); ctx.stroke();
  ctx.restore();

  // (집은 없애고, 대기 줄 길이 풀밭 패널 위쪽 경계선까지 쭉 이어져요)

  // 하트 가운데 잔디 섬 + 큰 나무 + 꽃
  const iry = L.ry - L.laneW / 2 - 4;
  const cyI = L.rcy + L.ry * 0.05;
  for (let i = 0; i < 12 && SP.flowers.length; i++) {
    const [x, y] = L.islandPts[Math.floor(i / 12 * L.islandPts.length)];
    ctx.fillStyle = SP.flowers[i % SP.flowers.length];
    circle(L.rcx + (x - L.rcx) * 0.8, cyI + (y - cyI) * 0.8, 2.2);
  }
  // 가운데 큰 나무 (메인 화면과 같은 계절의 잎사귀 나무)
  if (islandTree.complete && islandTree.naturalWidth) {
    const imgH = iry * 1.55, baseY = L.rcy + iry * 0.42;   // 하트 섬 안에 들어가는 크기
    const sh = S.treeShake > 0 ? Math.sin(S.treeShake * 40) * 0.06 * S.treeShake : 0;   // 누르면 살랑 흔들려요
    ctx.save(); ctx.translate(L.rcx, baseY); ctx.rotate(sh); ctx.translate(-L.rcx, -baseY);
    ctx.drawImage(islandTree, L.rcx - imgH / 2, baseY - imgH * (110 / 120), imgH, imgH);
    ctx.restore();
  }

  // 도는 방향 화살표 (하트 길을 따라)
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  const n = L.ringPts.length;
  for (const f of [0.12, 0.38, 0.62, 0.88]) {
    const i = Math.floor(f * n), [px, py] = L.ringPts[i], [qx, qy] = L.ringPts[(i + 2) % n];
    const ang = Math.atan2(qy - py, qx - px);
    ctx.save(); ctx.translate(px, py); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-3, -3.5); ctx.lineTo(-3, 3.5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 고양이 / 강아지들 (위쪽부터 그려서 아래쪽 친구가 앞에 보이도록)
  const vis = [];
  const add = (p, i, waitIdx = -1) => {
    if (!p || p.x === undefined) return;
    // 줄 뒤쪽에서 오래 기다리는 몇몇 친구: 간식 생각 중이거나, 지쳐서 쿨쿨 자는 중
    const back = waitIdx >= 8 && !p.walking;
    const sleep = back && waitIdx >= 10 && p.id % 6 === 2;
    const think = !sleep && back && p.id % 5 === 0 && (S.time + p.id * 1.7) % 9 < 4.5;
    vis.push({ x: p.x, y: p.y, c: p.color, kind: p.kind, think, sleep, ph: i * 0.73,
      opts: { bag: p.bag, ribbon: p.ribbon, sleep },
      bob: p.walking ? Math.abs(Math.sin(S.time * 14 + i)) * 2 : 0 });
  };
  S.ring.forEach((p, i) => add(p, i));
  S.waiting.forEach((p, i) => add(p, i + 100, i));
  vis.sort((a, b) => a.y - b.y);
  for (const p of vis) drawAnimal(p.x, p.y + L.pr * 0.3, L.pr, p.c, p.kind, p.bob, p.ph, p.opts);
  let bubbles = 0;
  for (const p of vis) {
    if (p.sleep) { drawZzz(p.x, p.y + L.pr * 0.3 - L.pr * 2.0, L.pr, p.ph); continue; }
    if (!p.think || bubbles >= 6) continue;
    bubbles++;
    drawThought(p.x, p.y + L.pr * 0.3 - L.pr * 2.05 - p.bob, L.pr, p.kind);
  }

  const hiddenN = S.waiting.length - Math.min(S.waiting.length, L.waitMax);
  if (hiddenN > 0) {
    const t = `+${hiddenN}`;
    ctx.font = '700 14px MaruBuri, serif';
    const tw = ctx.measureText(t).width + 14;
    ctx.fillStyle = 'rgba(59,50,38,.85)';
    rr(L.W - 16 - tw, L.qTop + 6, tw, 22, 11); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t, L.W - 16 - tw / 2, L.qTop + 17);
  }
}

function draw() {
  ctx.clearRect(0, 0, L.W || 0, L.H || 0);
  if (!S || !L.ring) return;

  drawQueueArea();

  // 정류장: 위쪽 보도 + 하얗게 칠한 주차 칸 + 아래쪽 찻길
  const panelH = L.swH + L.sH + L.roadH + 8;
  ctx.fillStyle = '#8f8a83';
  rr(8, L.sTop - 4, L.W - 16, panelH, 14); ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1; ctx.stroke();
  drawSpeckles(8, L.sTop - 4, L.W - 16, panelH, 50);
  // 보도 (멍냥이들이 걸어가는 길)
  ctx.fillStyle = '#e4dccb';
  rr(8.5, L.sTop - 3.5, L.W - 17, L.swH + 3.5, 13); ctx.fill();
  ctx.fillRect(8.5, L.sTop + 6, L.W - 17, L.swH - 6);
  ctx.strokeStyle = 'rgba(112,104,96,.25)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 22; x < L.W - 14; x += Math.max(8, L.swH * 1.1)) { ctx.moveTo(x, L.sTop - 2); ctx.lineTo(x, L.sTop + L.swH); }
  ctx.stroke();
  ctx.strokeStyle = LINE; ctx.beginPath(); ctx.moveTo(8, L.sTop + L.swH); ctx.lineTo(L.W - 8, L.sTop + L.swH); ctx.stroke();
  // 찻길 (다 탄 버스가 떠나는 길) + 가운데 점선
  const ry0 = L.sTop + L.swH + L.sH;
  ctx.fillStyle = '#7c7771';
  ctx.fillRect(8.5, ry0, L.W - 17, L.roadH - 8);
  rr(8.5, ry0, L.W - 17, L.roadH + 3.5, 13); ctx.fill();
  ctx.strokeStyle = 'rgba(246,232,190,.75)'; ctx.lineWidth = 1.4; ctx.setLineDash([8, 7]);
  ctx.beginPath(); ctx.moveTo(18, L.roadY); ctx.lineTo(L.W - 18, L.roadY); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = LINE; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(8, ry0); ctx.lineTo(L.W - 8, ry0); ctx.stroke();
  // 원에서 내려오는 길을 보도까지 이어 주기
  const bw2 = L.laneW;
  ctx.fillStyle = '#ebd8b2';
  ctx.fillRect(L.exitX - bw2 / 2, L.qTop + L.qH - 3, bw2, L.sTop - (L.qTop + L.qH) + 4);
  ctx.strokeStyle = LINE; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(L.exitX - bw2 / 2, L.qTop + L.qH); ctx.lineTo(L.exitX - bw2 / 2, L.sTop - 4);
  ctx.moveTo(L.exitX + bw2 / 2, L.qTop + L.qH); ctx.lineTo(L.exitX + bw2 / 2, L.sTop - 4);
  ctx.stroke();
  for (let i = 0; i < MAX_SLOTS; i++) {
    const p = slotPos(i), w = L.sw * 0.9, h = L.sH * 0.92;
    const x0 = p.x - w / 2, x1 = p.x + w / 2, y0 = p.y - h / 2, y1 = p.y + h / 2;
    if (i < S.slotCount) {
      ctx.strokeStyle = 'rgba(246,240,226,.85)'; ctx.lineWidth = 1.6; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(x0, y1); ctx.lineTo(x0, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.fillStyle = '#d8cfbf';
      rr(p.x - w * 0.28, y0 + h * 0.06, w * 0.56, h * 0.05, 2); ctx.fill();
      ctx.strokeStyle = LINE; ctx.lineWidth = 1; ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(246,240,226,.4)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(x0, y1); ctx.lineTo(x0, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = S.boost.slot > 0 ? '#e3efcf' : 'rgba(255,255,255,.3)';
      ctx.font = `700 ${L.sw * 0.5}px MaruBuri, serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('+', p.x, p.y + 1);
    }
  }

  // 주차장: 연석 + 따뜻한 회색 아스팔트 + 바랜 주차선 + P 표시
  //   위쪽 대기 구역·정류장과 똑같은 가로 폭으로 깔고, 버스들은 그 가운데에 놓여요
  const bx0 = 13, by0 = L.bTop - 4 + 5, bw = L.W - 26, bh = L.bH + 4 - 10;
  ctx.fillStyle = '#e2dacb';
  rr(8, L.bTop - 4, L.W - 16, L.bH + 4, 16); ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = S.liftMode ? '#cdbb86' : '#a7a199';
  rr(bx0, by0, bw, bh, 12); ctx.fill(); ctx.stroke();
  drawSpeckles(bx0, by0, bw, bh, 160);
  ctx.strokeStyle = 'rgba(246,240,226,.32)'; ctx.lineWidth = 1.4;
  ctx.setLineDash([L.cs * 0.55, L.cs * 0.45]);
  for (let i = 1; i < S.cols; i++) {
    ctx.beginPath(); ctx.moveTo(L.bx + i * L.cs, L.by + L.cs * 0.1); ctx.lineTo(L.bx + i * L.cs, L.by + S.rows * L.cs); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(246,240,226,.16)';
  ctx.font = `700 ${L.cs * 1.4}px MaruBuri, serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('P', L.bx + S.cols * L.cs / 2, L.by + S.rows * L.cs / 2);

  // 버스를 타러 걸어가는 친구들 (눈이 초롱초롱, 신나서 통통 뛰며)
  const walkers = S.flying.map(f => ({ f, p: pathPoint(f.path, f.s) })).sort((a, b) => a.p.y - b.p.y);
  for (const { f, p } of walkers) {
    const bob = Math.abs(Math.sin(S.time * 16 + f.id)) * 2.5;
    drawAnimal(p.x, p.y + L.pr * 0.3, L.pr * 0.92, f.color, f.kind, bob, f.id * 0.7,
      { bag: f.bag, ribbon: f.ribbon, excited: true });
  }

  const order = { parked: 0, slot: 1, departing: 1, exiting: 2, toSlot: 2 };
  const list = S.vehicles.filter(v => v.state in order).sort((a, b) => order[a.state] - order[b.state]);
  for (const v of list) {
    const P = vehiclePose(v);
    const inSlot = v.state === 'slot' || v.state === 'departing';
    drawVehicle(P.x, P.y, P.a, P.w, P.l, v.color, v.hidden, {
      arrow: !inSlot, seats: inSlot ? v.cap - v.filled : null, capLabel: v.state === 'parked' ? v.cap : null,
      alpha: P.alpha, scale: P.scale,
    });
  }
  // 떠나는 버스: 신나는 음표 말풍선
  for (const v of S.vehicles) {
    if (v.state !== 'departing' || v.t < 0.12) continue;
    const P = vehiclePose(v);
    drawNoteBubble(P.x, P.y - P.w * 0.55, L.pr, v.t);
  }
}

// 음표 말풍선 (♪ 신난다!)
function drawNoteBubble(x, y, r, t) {
  const bx = x + r * 0.6, by = y - r * 1.9 - Math.sin(t * 20) * 1.2;
  const w = r * 3.2, h = r * 2;
  ctx.beginPath();
  rr(bx - w / 2, by - h / 2, w, h, h * 0.45);
  ctx.moveTo(bx - r * 0.5, by + h / 2 - 0.5); ctx.lineTo(bx - r * 0.9, by + h / 2 + r * 0.7); ctx.lineTo(bx - r * 0.05, by + h / 2 - 0.5);
  ctx.fillStyle = '#fffdf8'; ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1;
  rr(bx - w / 2, by - h / 2, w, h, h * 0.45); ctx.stroke();
  ctx.font = `700 ${r * 1.35}px serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#d9906a'; ctx.fillText('♪', bx - r * 0.65, by + 1 + Math.sin(t * 25) * 1.5);
  ctx.fillStyle = '#7fb4d6'; ctx.fillText('♫', bx + r * 0.65, by + 1 - Math.sin(t * 25) * 1.5);
}

// 쿨쿨 자는 친구 머리 위의 Z
function drawZzz(x, headTop, r, ph) {
  const t = (performance.now() / 1000 + ph) % 2.4 / 2.4;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 3; i++) {
    const k = (t + i / 3) % 1;
    ctx.globalAlpha = Math.sin(k * Math.PI) * 0.9;
    ctx.font = `700 ${r * (0.6 + k * 0.6)}px MaruBuri, serif`;
    ctx.fillStyle = '#8f9bb3';
    ctx.fillText('z', x + r * (0.7 + k * 0.9), headTop - r * k * 1.4);
  }
  ctx.globalAlpha = 1;
}

// =====================================================================
//  메인 화면 (단계 지도)
// =====================================================================
function showScreen(name) {
  $('menu').classList.toggle('hidden', name !== 'game' ? false : true);
  $('game').classList.toggle('hidden', name !== 'game');
}

function showMenu() {
  S = null;
  hideOverlay();
  showScreen('menu');
  renderMap();
  if (typeof updateSky === 'function' && document.getElementById('celestial')) updateSky();
}

function renderMap() {
  const scroll = $('mapScroll'), inner = $('mapInner');
  const W = scroll.clientWidth;
  if (!W) return;
  const N = Math.max(30, unlocked + 10), SP = 104;
  const H = N * SP + 90;
  inner.style.height = H + 'px';
  const amp = Math.min(W * 0.28, 130);
  const pts = [];
  for (let i = 0; i < N; i++) pts.push({ x: W / 2 + Math.sin(i * 1.05) * amp, y: H - 60 - i * SP });

  // 구불구불한 시골길 (부드러운 곡선)
  let d = `M ${pts[0].x} ${H + 20} L ${pts[0].x} ${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C ${p1.x + (p2.x - p0.x) / 6} ${p1.y + (p2.y - p0.y) / 6}, ${p2.x - (p3.x - p1.x) / 6} ${p2.y - (p3.y - p1.y) / 6}, ${p2.x} ${p2.y}`;
  }
  // (지도와 함께 스크롤되는 나무는 위쪽 페이드 구간에서 반투명하게 보여서 없앴어요.
  //  나무는 움직이지 않는 배경 들판에만 심어요.)
  const deco = '';
  // 흙길: 얇은 회색 테두리 + 바퀴 자국 (겨울엔 눈길)
  // 길과 나무는 한 번만 그림(이미지)으로 만들어 두어, 스크롤해도 다시 그리지 않아요
  const road = season === 'winter' ? ['#eef1f4', '#dfe5ea'] : ['#ead6b0', '#d6bf96'];
  const img = $('mapRoad');
  img.style.width = W + 'px'; img.style.height = H + 'px';
  setSvgImage(img, `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <defs><filter id="wash" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter></defs>
    <path d="${d}" fill="none" stroke="#a8a097" stroke-width="29.5" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="${road[0]}" stroke-width="27.5" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="${road[1]}" stroke-width="12" stroke-linecap="round" opacity=".55"/>
    <path d="${d}" fill="none" stroke="${road[0]}" stroke-width="7" stroke-linecap="round"/>
    ${deco}</svg>`);
  updateHello();

  inner.querySelectorAll('.node').forEach(n => n.remove());
  pts.forEach((p, i) => {
    const n = i + 1;
    const b = document.createElement('button');
    b.className = 'node ' + (n < unlocked ? 'done' : n === unlocked ? 'current' : 'locked');
    b.style.left = p.x + 'px';
    b.style.top = p.y + 'px';
    b.innerHTML = n > unlocked ? LOCK_SVG : `${n}<small>${'★'.repeat(TIERS[levelTier(n)].stars)}</small>`;
    if (n === unlocked) b.innerHTML += BUS_SVG;
    b.onclick = () => n <= unlocked ? showLevelPopup(n) : toast('앞 단계를 먼저 깨 주세요');
    inner.appendChild(b);
  });

  const cur = pts[Math.min(unlocked, N) - 1];
  scroll.scrollTop = cur.y - scroll.clientHeight * 0.6;
}

// =====================================================================
//  화면 UI
// =====================================================================
function updateUI() {
  $('levelLabel').textContent = `${S.level}단계`;
  $('leftLabel').textContent = `${TIERS[levelTier(S.level)].name} · 남은 승객 ${remainingCount()}명`;
  $('slotCnt').textContent = S.boost.slot;
  $('liftCnt').textContent = S.boost.lift;
  $('slotBtn').disabled = S.boost.slot <= 0 || S.slotCount >= MAX_SLOTS;
  $('liftBtn').disabled = S.boost.lift <= 0;
  $('liftBtn').classList.toggle('active', S.liftMode);
}

let toastTimer = 0;
function toast(msg, ms = 1400) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

function showOverlay(kind) {
  const card = $('card');
  if (kind === 'win') {
    const tries = S.tries || 1;
    const all = store.get('busGame.tries', {}); all[S.level] = 0; store.set('busGame.tries', all);   // 다음 도전은 새로 세요
    card.innerHTML = `<canvas id="celebCv" class="perch" width="600" height="250"></canvas>
      <h2>축하드립니다!</h2><p><b>${tries}번</b>의 시도로 성공했습니다!</p>
      <button class="btn" id="ovNext">${S.level + 1}단계로</button>
      <button class="btn alt" id="ovMap">메인 메뉴로</button>`;
    card.querySelector('#ovNext').onclick = () => { stopCelebration(); tryStart(S.level + 1); };
    card.querySelector('#ovMap').onclick = () => { stopCelebration(); showMenu(); };
    $('overlay').classList.add('show');
    celebrate();
    return;
  } else {
    const canSlot = S.boost.slot > 0 && S.slotCount < MAX_SLOTS;
    refreshHearts();
    card.innerHTML = `<canvas id="sadCv" class="perch" width="600" height="250"></canvas>
      <h2>꽉 막혔어요</h2><p>대기 칸이 가득 차서 더 태울 수 없어요.<br>
      <small>다시 하기·지도 보기를 누르면 하트가 1개 줄어요</small><br>
      <span class="heartNow">${HEART_SVG}지금 하트 ${hearts.n}개</span></p>
      <button class="btn" id="ovSlot" ${canSlot ? '' : 'disabled'}>아이템 사용${canSlot ? ' (자리 +1)' : ' (없음)'}</button>
      <button class="btn alt" id="ovRetry">다시 하기</button>
      <button class="btn alt" id="ovMap">지도 보기</button>`;
    if (canSlot) card.querySelector('#ovSlot').onclick = () => { stopCelebration(); useSlotBooster(); S.over = false; hideOverlay(); };
    card.querySelector('#ovRetry').onclick = () => {
      if (!useHeart()) { toast(`하트가 없어요 · ${heartLeft()} 뒤에 1개 충전`, 2200); return; }
      stopCelebration(); startLevel(S.level);
    };
    card.querySelector('#ovMap').onclick = () => { useHeart(); stopCelebration(); showMenu(); };
    $('overlay').classList.add('show');
    sadLoop();
    return;
  }
  card.querySelector('#ovMap').onclick = () => showMenu();
  $('overlay').classList.add('show');
}
function hideOverlay() { $('overlay').classList.remove('show'); stopCelebration(); }

// =====================================================================
//  클리어 축하: 핑크·파랑·노랑·연두 폭죽 + 나팔 부는 강아지와 고양이
// =====================================================================
let celebRAF = 0;
function stopCelebration() {
  cancelAnimationFrame(celebRAF); celebRAF = 0;
  const cf = $('confetti'); if (cf) cf.getContext('2d').clearRect(0, 0, cf.width, cf.height);
}
function celebrate() {
  stopCelebration();
  const cf = $('confetti'), app = $('app');
  const dpr = window.devicePixelRatio || 1, W = app.clientWidth, H = app.clientHeight;
  cf.width = W * dpr; cf.height = H * dpr;
  const fc = cf.getContext('2d'); fc.setTransform(dpr, 0, 0, dpr, 0, 0);
  const COLS = ['#f4a3bd', '#8dbbe0', '#f6d76b', '#b4dc88', '#fbe0ea'];
  const parts = [];
  const burst = (x, y) => {
    sfx('board', Math.floor(Math.random() * 8));
    for (let i = 0; i < 64; i++) {
      const a = Math.random() * Math.PI * 2, v = 140 + Math.random() * 240;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 1.8 + Math.random() * 0.9, age: 0,
        c: COLS[i % COLS.length], s: 5 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12, round: Math.random() < 0.4 });
    }
  };
  const plan = [0, 0.35, 0.8, 1.3, 1.9, 2.6, 3.4].map(t => ({ t, done: false }));
  const cc = $('celebCv') ? $('celebCv').getContext('2d') : null;
  const t0 = performance.now();
  let last = t0;
  const frame = () => {
    const now = performance.now();   // 한 가지 시계만 써요 (기기마다 rAF 시각 기준이 달라도 안전)
    const T = (now - t0) / 1000, dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    // 폭죽 터뜨리기
    for (const p of plan) if (!p.done && T >= p.t) { p.done = true; burst(W * (0.15 + Math.random() * 0.7), H * (0.12 + Math.random() * 0.35)); }
    fc.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.age += dt; p.vy += 260 * dt; p.vx *= 0.985; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      const a = Math.max(0, 1 - p.age / p.life);
      if (!a) continue;
      fc.save(); fc.globalAlpha = a; fc.translate(p.x, p.y); fc.rotate(p.rot); fc.fillStyle = p.c;
      if (p.round) { fc.beginPath(); fc.arc(0, 0, p.s * 0.6, 0, Math.PI * 2); fc.fill(); }
      else fc.fillRect(-p.s / 2, -p.s * 0.3, p.s, p.s * 0.6);
      fc.restore();
    }
    // 나팔 부는 고양이와 강아지
    if (cc) drawTrumpeters(cc, T);
    if ($('overlay').classList.contains('show')) celebRAF = requestAnimationFrame(frame);
  };
  celebRAF = requestAnimationFrame(frame);
}
// 나팔 (입에서 바깥 위쪽으로, 끝에 나팔꽃 모양 벨)
function drawTrumpet(c, mx, my, dir, k) {
  const ex = mx + dir * k * 1.5, ey = my - k * 0.7;
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = LINE; c.lineWidth = k * 0.2 + 2; c.beginPath(); c.moveTo(mx, my); c.lineTo(ex, ey); c.stroke();
  c.strokeStyle = '#f2c94c'; c.lineWidth = k * 0.2; c.stroke();
  const ang = Math.atan2(ey - my, ex - mx);
  c.save(); c.translate(ex, ey); c.rotate(ang);
  c.beginPath(); c.moveTo(0, -k * 0.12); c.lineTo(k * 0.6, -k * 0.42); c.lineTo(k * 0.6, k * 0.42); c.lineTo(0, k * 0.12); c.closePath();
  c.fillStyle = '#f6d76b'; c.fill(); c.strokeStyle = LINE; c.lineWidth = 2; c.stroke();
  c.beginPath(); c.ellipse(k * 0.6, 0, k * 0.12, k * 0.42, 0, 0, Math.PI * 2); c.fillStyle = '#e9b949'; c.fill(); c.stroke();
  c.restore();
  return { x: ex + Math.cos(ang) * k * 0.7, y: ey + Math.sin(ang) * k * 0.7 };
}
// 실패: 시무룩하게 눈물이 그렁그렁한 고양이와 강아지 (팝업 위에 걸터앉아 있어요)
function sadLoop() {
  stopCelebration();
  const c = $('sadCv') && $('sadCv').getContext('2d');
  if (!c) return;
  const t0 = performance.now();
  const frame = () => {
    const T = (performance.now() - t0) / 1000, W = c.canvas.width, H = c.canvas.height;
    c.clearRect(0, 0, W, H);
    const saved = ctx, savedLW = LW_SCALE;
    ctx = c; LW_SCALE = 2;
    try {
      for (const [x, kind, col, ph] of [[W * 0.36, 'cat', 6, 0], [W * 0.64, 'dog', 1, 1.1]]) {
        const sniff = Math.max(0, Math.sin(T * 2.2 + ph)) * 2;   // 훌쩍훌쩍 어깨가 들썩
        drawAnimal(x, H - 22, 46, col, kind, sniff, ph, { sad: true, ribbon: kind === 'cat' ? '#e8768e' : null });
      }
    } finally { ctx = saved; LW_SCALE = savedLW; }
    if ($('overlay').classList.contains('show')) celebRAF = requestAnimationFrame(frame);
  };
  celebRAF = requestAnimationFrame(frame);
}

function drawTrumpeters(c, T) {
  const W = c.canvas.width, H = c.canvas.height;
  c.clearRect(0, 0, W, H);
  const saved = ctx, savedLW = LW_SCALE;
  ctx = c; LW_SCALE = 2;
  try {
    const r = 40;
    for (const [x, kind, col, dir, ph] of [[W * 0.3, 'cat', 6, -1, 0], [W * 0.7, 'dog', 1, 1, 1.3]]) {
      const bob = Math.abs(Math.sin(T * 5 + ph)) * 6;
      drawAnimal(x, H - 22, r, col, kind, bob, ph, { excited: true, ribbon: kind === 'cat' ? '#e8768e' : null });
      // 입 위치 (drawAnimal의 머리 좌표에 맞춰)
      const my = H - 22 - bob - r * 1.2 * 0.9 + r * 0.3, mx = x + dir * r * 0.2;
      const bell = drawTrumpet(c, mx, my, dir, r * (1 + Math.sin(T * 10 + ph) * 0.04));
      // 나팔에서 나오는 음표
      for (let i = 0; i < 2; i++) {
        const k = (T * 0.8 + i * 0.5 + ph) % 1;
        c.globalAlpha = Math.sin(k * Math.PI);
        c.font = `700 ${24 + k * 14}px serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillStyle = i ? '#8dbbe0' : '#f4a3bd';
        c.fillText(i ? '♫' : '♪', bell.x + dir * k * 40, bell.y - k * 60);
      }
      c.globalAlpha = 1;
    }
  } finally { ctx = saved; LW_SCALE = savedLW; }
}

// =====================================================================
//  계절 풍경 (봄 / 여름 / 가을 / 겨울)
// =====================================================================
const SEASONS = {
  spring: {
    sky: ['#a9cde2', '#dcebee', '#f7e9e2'], sun: '#fff4e4', mt: ['#aebdd0', '#d9e0e6'],
    forest: ['#f4cbd6', '#efbccb', '#e6a9bc', '#f8dbe3', '#fbe8ee'], meadow: ['#cfe4a8', '#acd08a', '#93be72'],   // 봄 숲: 벚꽃 핑크
    grass: ['#7fae5f', '#95c072', '#6f9e52', '#a7cd84'], flowers: ['#f6c9d6', '#fffaf4', '#f9e6a0'],
    leaves: ['#f4c4d1', '#f8d6df', '#eeb1c2', '#fbe6ec', '#f9dbe3'], leafBase: '#e3a7b8', trunk: '#7b5a46', cloudShade: '#dfe2ea',
  },
  summer: {
    sky: ['#86c0e6', '#cbe6f0', '#f1f0dc'], sun: '#fff7d6', mt: ['#9fb8cc', '#d3e0e2'],
    forest: ['#6f9f58', '#7fae63', '#5f8f4c', '#8ab86c', '#4f7f3f'], meadow: ['#b7da8e', '#95c56e', '#7cb35a'],
    grass: ['#5f9a45', '#78ae55', '#4f8a3a', '#8cc064'], flowers: ['#fffdf6', '#f9e6a0', '#c9d9f5'],
    leaves: ['#a6d17a', '#8cc463', '#c4e39b', '#72ab50', '#b4dc88', '#5f9a45'], leafBase: '#3f7232', trunk: '#6f5240', cloudShade: '#d8e2ec',
  },
  autumn: {
    sky: ['#a4c2d4', '#e8dcc8', '#f6dfb8'], sun: '#ffeccc', mt: ['#b1b9c4', '#dfd9cf'],
    forest: ['#c8783f', '#d99a4a', '#b5602f', '#c9a050', '#8c8f4a'], meadow: ['#d6cd8e', '#c3b674', '#ad9f5d'],
    grass: ['#b39a55', '#c8ae64', '#9c8a4a', '#d3b56a'], flowers: ['#e9a96a', '#f1d58a'],
    leaves: ['#d9653f', '#e8913f', '#f0b54a', '#c9472f', '#e07a3a'], leafBase: '#a8452a', trunk: '#6a4c3a', cloudShade: '#e3dbd0',
  },
  winter: {
    sky: ['#b6c6d5', '#dde5ec', '#eff1f3'], sun: '#ffffff', mt: ['#c3ccd6', '#eef1f4'],
    forest: ['#a9b4bc', '#b9c2c9', '#94a0a9', '#c9d1d7'], meadow: ['#f6f8fa', '#e8edf2', '#dde4ea'],
    grass: ['#c6d0d8', '#b5c1ca'], flowers: [],
    leaves: null, leafBase: null, trunk: '#6d5e55', cloudShade: '#cfd6de',
  },
};
const SEASON_KEYS = ['spring', 'summer', 'autumn', 'winter'];
// 계절: 기본은 '지금 계절'(오늘 날짜 기준, 3~5월 봄 / 6~8월 여름 / 9~11월 가을 / 12~2월 겨울). 설정에서 바꿀 수 있어요.
const seasonByDate = () => SEASON_KEYS[Math.floor(((new Date().getMonth() + 10) % 12) / 3)];
let seasonPref = store.get('busGame.seasonPref', 'auto');
let season = SEASONS[seasonPref] ? seasonPref : seasonByDate();
const f1 = n => n.toFixed(1);
const pick = (R, arr) => arr[Math.floor(R() * arr.length)];

// 수채화 나무: 줄기에서 가지가 여러 번 갈라지며 풍성하게 뻗고,
// 가지 끝마다 작은 잎이 여러 장 + 옅은 물감 번짐 (동그란 덩어리 없음)
//   봄: 벚꽃 / 여름: 싱그러운 초록 / 가을: 단풍나무와 은행나무 / 겨울: 앙상한 가지 + 눈
const GINKGO = ['#f2c94c', '#f6d769', '#e8b72f', '#f9e49a', '#dcae2a'];
function makeTree(seed, h, ss = season, detail = 1) {
  const R = mulberry32(seed), P = SEASONS[ss];
  const bare = !P.leaves;
  const ginkgo = ss === 'autumn' && seed % 2 === 0;
  const cols = ginkgo ? GINKGO : P.leaves;
  const maxD = (detail < 1 ? 3 : h < 100 ? 5 : 6) + (bare ? 1 : 0);
  const tw = h * 0.055;
  let branches = '';
  const tips = [], mids = [];

  function grow(x, y, ang, len, w, d) {
    const ex = x + Math.sin(ang) * len, ey = y - Math.cos(ang) * len;
    const bend = (R() - 0.5) * len * 0.3;
    const mx = (x + ex) / 2 + Math.cos(ang) * bend, my = (y + ey) / 2 + Math.sin(ang) * bend;
    branches += `<path d="M${f1(x)} ${f1(y)} Q${f1(mx)} ${f1(my)} ${f1(ex)} ${f1(ey)}" stroke-width="${f1(Math.max(w, 0.35))}"/>`;
    if (d >= 2) mids.push([mx, my, d]);
    if (d >= maxD) { tips.push([ex, ey]); return; }
    const n = R() < 0.35 ? 3 : 2;
    for (let i = 0; i < n; i++) {
      const spread = 0.36 + R() * 0.36;
      const off = n === 2 ? (i ? spread : -spread) : (i - 1) * spread * 1.15;
      const a = clamp((ang + off + (R() - 0.5) * 0.25) * 0.97, -1.5, 1.5);   // 위쪽으로 살짝 모이게
      grow(ex, ey, a, len * (0.7 + R() * 0.14), w * 0.64, d + 1);
    }
  }

  // 줄기 (아래가 넓은 원뿔꼴) + 큰 가지 2~3개
  const lean = (R() - 0.5) * 0.12, trunkLen = h * 0.21;
  const tx = Math.sin(lean) * trunkLen, ty = -trunkLen;
  const limbs = R() < 0.5 ? 2 : 3;
  for (let i = 0; i < limbs; i++) {
    const off = limbs === 2 ? (i ? 0.38 : -0.42) : (i - 1) * 0.5;
    grow(tx, ty, lean + off * 1.25 + (R() - 0.5) * 0.2, h * (0.16 + R() * 0.04), tw * 0.72, 1);
  }
  // 먼 숲(detail<1)은 줄기·가지 없이 잎만 빽빽하게 → 가지가 안 보이는 울창한 숲
  const foliageOnly = detail < 1 && !bare;
  let s = detail >= 1 ? `<ellipse cx="0" cy="0" rx="${f1(h * 0.3)}" ry="${f1(h * 0.045)}" fill="rgba(60,50,30,.14)"/>` : '';
  if (!foliageOnly) s += `<path d="M${f1(-tw * 0.65)} 0 Q${f1(-tw * 0.4)} ${f1(-trunkLen * 0.5)} ${f1(tx - tw * 0.36)} ${f1(ty)} L${f1(tx + tw * 0.36)} ${f1(ty)}
    Q${f1(tw * 0.4)} ${f1(-trunkLen * 0.5)} ${f1(tw * 0.65)} 0Z" fill="${P.trunk}" stroke="rgba(112,104,96,.45)" stroke-width=".6"/>`;

  let wash = '', leaves = '';
  if (!bare) {
    // 물감 번짐: 가지 끝 근처에 옅은 색이 스며든 듯
    for (let i = 0; i < tips.length; i++) {
      const [x, y] = tips[i];
      wash += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(h * (0.08 + R() * 0.05))}" ry="${f1(h * (0.06 + R() * 0.04))}" fill="${pick(R, cols)}" opacity="${foliageOnly ? '.7' : '.42'}"/>`;
    }
    // 잎사귀: 가지 끝마다 여러 장, 중간 가지에도 조금
    const perTip = detail >= 1 ? 8 : 7;
    const L0 = h * (detail >= 1 ? 0.04 : 0.075);
    const addLeaf = (x, y, spread) => {
      const lx = x + (R() - 0.5) * spread, ly = y + (R() - 0.5) * spread;
      const L = L0 * (0.75 + R() * 0.55), W = L * (ginkgo ? 0.7 : 0.45);
      const shape = ginkgo
        ? `M0 0 L${f1(L * 0.85)} ${f1(-W)} Q${f1(L * 1.1)} 0 ${f1(L * 0.85)} ${f1(W)}Z`
        : `M0 0 Q${f1(L / 2)} ${f1(-W)} ${f1(L)} 0 Q${f1(L / 2)} ${f1(W)} 0 0Z`;
      leaves += `<path d="${shape}" fill="${pick(R, cols)}" opacity="${f1(0.72 + R() * 0.25)}" transform="translate(${f1(lx)} ${f1(ly)}) rotate(${Math.round(R() * 360)})"/>`;
    };
    for (const [x, y] of tips) for (let k = 0; k < perTip; k++) addLeaf(x, y, h * 0.13);
    // 가지 중간·아래쪽까지 잎을 달아 아래도 풍성하게 (아래로 갈수록 살짝 늘어지듯)
    for (const [x, y, dd] of mids) {
      const k = dd <= 3 ? 4 : 3;
      for (let i = 0; i < k; i++) addLeaf(x, y + h * 0.02, h * 0.11);
      if (R() < 0.5) wash += `<ellipse cx="${f1(x)}" cy="${f1(y + h * 0.02)}" rx="${f1(h * 0.07)}" ry="${f1(h * 0.05)}" fill="${pick(R, cols)}" opacity=".35"/>`;
    }
    if (ss === 'spring') for (let k = 0; k < tips.length; k++) if (R() < 0.3) { const [x, y] = tips[k]; leaves += `<circle cx="${f1(x + (R() - 0.5) * h * 0.05)}" cy="${f1(y)}" r="${f1(h * 0.012)}" fill="#a9c98a" opacity=".8"/>`; }
  } else {
    // 겨울: 가지 위에 쌓인 눈
    for (const [x, y] of tips) if (R() < 0.45) leaves += `<ellipse cx="${f1(x)}" cy="${f1(y - 0.5)}" rx="${f1(h * 0.022)}" ry="${f1(h * 0.009)}" fill="#fbfcfd"/>`;
    for (const [x, y] of mids) if (R() < 0.3) leaves += `<ellipse cx="${f1(x)}" cy="${f1(y - 0.5)}" rx="${f1(h * 0.02)}" ry="${f1(h * 0.008)}" fill="#fbfcfd"/>`;
  }
  s += `<g filter="url(#wash)">${wash}</g>`;
  if (!foliageOnly) s += `<g stroke="${P.trunk}" fill="none" stroke-linecap="round">${branches}</g>`;
  s += leaves;
  return s;
}

// 몽글몽글한 뭉게구름 (가장자리를 노이즈로 일렁이게 해서 실제 구름처럼)
function makeCloud(id, seed, P) {
  const R = mulberry32(seed);
  const n = 7, puffs = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const r = 16 + Math.sin(t * Math.PI) * 24 + R() * 9;
    puffs.push([40 + t * 180 + (R() - 0.5) * 12, 82 - r * 0.6, r]);
  }
  const circles = (dy, fill, k = 1) => puffs.map(([x, y, r]) => `<circle cx="${f1(x)}" cy="${f1(y + dy)}" r="${f1(r * k)}"/>`).join('').replace(/^/, `<g fill="${fill}">`) + '</g>';
  return `<svg viewBox="0 0 260 120" width="100%" aria-hidden="true">
    <defs><filter id="${id}" x="-20%" y="-30%" width="140%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".028" numOctaves="4" seed="${seed}" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="20" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.3"/></filter></defs>
    <g filter="url(#${id})">
      ${circles(8, P.cloudShade)}
      <rect x="40" y="70" width="180" height="22" rx="11" fill="${P.cloudShade}"/>
      ${circles(0, '#fdfdfc')}
      <g opacity=".85">${circles(-5, '#ffffff', 0.72)}</g>
    </g></svg>`;
}

// 들판 앞쪽 길가: 왼쪽엔 버스 정류장, 오른쪽엔 서 있는 시내버스 (가는 펜 선 + 수채화 채색)
function makeBusStopScene() {
  const INK = 'rgba(80,74,68,.85)', P = SEASONS[season], R = mulberry32(808);
  const y0 = 372;   // 길 바닥 높이
  let s = `<g stroke="${INK}" stroke-width=".8" stroke-linejoin="round" stroke-linecap="round">`;
  // 길: 옅은 회색 물감이 번진 아스팔트 + 연석
  s += `<path d="M-5 ${y0 - 4} C 120 ${y0 - 7} 260 ${y0 - 3} 405 ${y0 - 6} L405 ${y0 + 12} C 260 ${y0 + 14} 120 ${y0 + 10} -5 ${y0 + 13}Z" fill="#c9c6c0" opacity=".85" stroke="none" filter="url(#wash)"/>`;
  s += `<path d="M-5 ${y0 - 4} C 120 ${y0 - 7} 260 ${y0 - 3} 405 ${y0 - 6}" fill="none" stroke-width=".7"/>`;
  s += `<path d="M-5 ${y0 + 1} C 120 ${y0 - 2} 260 ${y0 + 2} 405 ${y0 - 1}" fill="none" stroke="rgba(80,74,68,.35)"/>`;
  if (season === 'autumn') for (let i = 0; i < 26; i++) s += `<ellipse cx="${f1(R() * 400)}" cy="${f1(y0 - 2 + R() * 13)}" rx="1.4" ry=".8" fill="${pick(R, ['#d9653f', '#e8913f', '#f0b54a'])}" stroke="none"/>`;
  if (season === 'winter') s += `<path d="M-5 ${y0 - 5} C 120 ${y0 - 8} 260 ${y0 - 4} 405 ${y0 - 7} L405 ${y0 - 2} C 260 ${y0} 120 ${y0 - 3} -5 ${y0}Z" fill="#fbfcfd" stroke="none"/>`;

  // ---- 왼쪽: 버스 정류장 (표지판 기둥 + 작은 대기소) ----
  s += `<rect x="16" y="${y0 - 64}" width="2.6" height="62" fill="#b9b6b0"/>`;                       // 기둥
  s += `<path d="M17 ${y0 - 60} L48 ${y0 - 60}" stroke-width="1.4" stroke="#8f8b85"/>`;              // 팔
  s += `<rect x="30" y="${y0 - 59}" width="20" height="7" rx="1" fill="#a87c5c"/>`;                  // 정류장 이름판
  s += `<circle cx="17.3" cy="${y0 - 68}" r="6" fill="#f6f3ec"/><rect x="13.5" y="${y0 - 70.5}" width="7.6" height="5" rx="1" fill="#7fb4d6"/>`;
  // 대기소: 지붕 + 투명 벽 + 의자
  s += `<path d="M30 ${y0 - 36} L78 ${y0 - 36} L74 ${y0 - 42} L34 ${y0 - 42}Z" fill="#9fb9b0"/>`;
  s += `<rect x="34" y="${y0 - 36}" width="2" height="34" fill="#b9b6b0"/><rect x="72" y="${y0 - 36}" width="2" height="34" fill="#b9b6b0"/>`;
  s += `<rect x="36" y="${y0 - 35}" width="36" height="22" fill="#d7e6ea" opacity=".55"/>`;
  s += `<rect x="40" y="${y0 - 14}" width="28" height="3" rx="1" fill="#a87c5c"/><path d="M43 ${y0 - 11} L43 ${y0 - 3} M65 ${y0 - 11} L65 ${y0 - 3}"/>`;
  s += `<rect x="38" y="${y0 - 33}" width="10" height="14" fill="#f2e6c9" opacity=".9"/>`;            // 노선도

  // 가로등 (버스는 움직이는 별도 층에서 그려요 → busLive)
  s += `<path d="M206 ${y0 - 2} L206 ${y0 - 84} Q206 ${y0 - 92} 216 ${y0 - 92} L224 ${y0 - 92}" fill="none" stroke="#9c9891" stroke-width="2"/>`;
  s += `<path d="M220 ${y0 - 94} L230 ${y0 - 94} L228 ${y0 - 90} L222 ${y0 - 90}Z" fill="#cfcbc4"/>`;
  // 길가 장면 전체를 약 1.15배 크게 (양옆이 잘리지 않게 기준점을 왼쪽에 둬요)
  return `<g transform="${SCENE_T}">${s}</g></g>`;
}
const SCENE_T = 'translate(42.7 372) scale(1.15) translate(-42.7 -372)';

// =====================================================================
//  메인 화면의 움직이는 버스: 멍냥이 5마리가 줄 서 있다가 5초마다 한 마리씩 타고,
//  탄 친구는 창밖을 바라보는 얼굴로 창문에 나타나요. 창문이 다 차면 출발 → 새 버스 도착.
// =====================================================================
const BUS = { x: 222, y0: 372, w: 120, h: 44, windows: 6, doorX: 244, gap: 13, every: 5 };
const busLive = { dx: 0, phase: 'arrive', t: 0, faces: [], queue: [], walker: null, timer: 2.5, last: 0 };
const OUTL = 'rgba(112,104,96,.75)';
const RIBBONS = ['#e8768e', '#7fb4d6', '#f2c35a', '#b9a2d8'];
const randFriend = () => ({
  kind: Math.random() < 0.5 ? 'cat' : 'dog', c: Math.floor(Math.random() * COLORS.length),
  ribbon: Math.random() < 0.18 ? RIBBONS[Math.floor(Math.random() * 4)] : null, bag: Math.random() < 0.16,
});

// 줄 서 있는 작은 멍냥이 (발 위치 = 0,0)
function miniAnimalSVG(a, sleep = false) {
  const C = COLORS[a.c], o = `stroke="${OUTL}" stroke-width=".55"`;
  const ears = a.kind === 'cat'
    ? `<path d="M-4.2 -12 L-3.3 -17.2 L-0.8 -14.6Z M4.2 -12 L3.3 -17.2 L0.8 -14.6Z" fill="${C.c}" ${o}/>`
    : '';
  const dogEars = a.kind === 'dog'
    ? `<ellipse cx="-4.1" cy="-11.4" rx="1.5" ry="2.9" transform="rotate(18 -4.1 -11.4)" fill="${C.d}"/><ellipse cx="4.1" cy="-11.4" rx="1.5" ry="2.9" transform="rotate(-18 4.1 -11.4)" fill="${C.d}"/>`
    : '';
  return `<ellipse cx="0" cy=".4" rx="4.6" ry="1.2" fill="rgba(70,50,30,.2)"/>
    <ellipse cx="0" cy="-3.4" rx="3.9" ry="3.6" fill="${C.c}" ${o}/>${ears}
    <circle cx="0" cy="-11" r="4.6" fill="${C.c}" ${o}/>${dogEars}
    <ellipse cx="0" cy="-9.4" rx="1.9" ry="1.2" fill="#fbf1de"/>
    ${sleep
      ? `<path d="M-2.5 -11.6 Q-1.6 -10.6 -0.7 -11.6 M0.7 -11.6 Q1.6 -10.6 2.5 -11.6" fill="none" stroke="#2e231a" stroke-width=".55" stroke-linecap="round"/>`
      : `<circle cx="-1.6" cy="-11.4" r=".75" fill="#2e231a"/><circle cx="1.6" cy="-11.4" r=".75" fill="#2e231a"/>
    <circle cx="-1.8" cy="-11.7" r=".28" fill="#fff"/><circle cx="1.4" cy="-11.7" r=".28" fill="#fff"/>`}
    <ellipse cx="-2.9" cy="-9.9" rx=".9" ry=".55" fill="rgba(255,110,140,.55)"/><ellipse cx="2.9" cy="-9.9" rx=".9" ry=".55" fill="rgba(255,110,140,.55)"/>
    ${a.ribbon ? `<path d="M2 -15.2 L4.6 -16.6 L4.6 -13.8Z M2 -15.2 L-0.6 -16.6 L-0.6 -13.8Z" fill="#e8768e" ${o}/>` : ''}`;
}
// 창밖을 바라보는 얼굴 (창문 안쪽)
function windowFaceSVG(a, wx, wy) {
  const C = COLORS[a.c], o = `stroke="${OUTL}" stroke-width=".5"`, cx = wx + 6.75, cy = wy + 10.5;
  const ears = a.kind === 'cat'
    ? `<path d="M${cx - 4.2} ${cy - 2} L${cx - 3.3} ${cy - 7} L${cx - 0.8} ${cy - 4.4}Z M${cx + 4.2} ${cy - 2} L${cx + 3.3} ${cy - 7} L${cx + 0.8} ${cy - 4.4}Z" fill="${C.c}" ${o}/>`
    : `<ellipse cx="${cx - 4}" cy="${cy - 0.6}" rx="1.5" ry="2.8" fill="${C.d}"/><ellipse cx="${cx + 4}" cy="${cy - 0.6}" rx="1.5" ry="2.8" fill="${C.d}"/>`;
  return `<g>${a.kind === 'cat' ? ears : ''}<circle cx="${cx}" cy="${cy}" r="4.6" fill="${C.c}" ${o}/>${a.kind === 'dog' ? ears : ''}
    <ellipse cx="${cx}" cy="${cy + 1.6}" rx="1.9" ry="1.2" fill="#fbf1de"/>
    <circle cx="${cx - 1.6}" cy="${cy - 0.4}" r=".75" fill="#2e231a"/><circle cx="${cx + 1.6}" cy="${cy - 0.4}" r=".75" fill="#2e231a"/>
    <circle cx="${cx - 1.8}" cy="${cy - 0.7}" r=".28" fill="#fff"/><circle cx="${cx + 1.4}" cy="${cy - 0.7}" r=".28" fill="#fff"/>
    <ellipse cx="${cx - 2.9}" cy="${cy + 1.1}" rx=".9" ry=".55" fill="rgba(255,110,140,.55)"/><ellipse cx="${cx + 2.9}" cy="${cy + 1.1}" rx=".9" ry=".55" fill="rgba(255,110,140,.55)"/></g>`;
}
// 버스 그림 (왼쪽 위 = 0,0)
function busBodySVG(faces) {
  const bw = BUS.w, bh = BUS.h, I = `stroke="rgba(80,74,68,.85)" stroke-width=".8" stroke-linejoin="round"`;
  let s = `<ellipse cx="${bw / 2}" cy="${bh + 3}" rx="${bw * 0.52}" ry="4" fill="rgba(70,65,60,.22)"/>`;
  s += `<path d="M6 0 L${bw - 4} 0 Q${bw} 0 ${bw} 5 L${bw} ${bh - 4} L0 ${bh - 4} L0 9 Q0 0 6 0Z" fill="#f6f5f1" ${I}/>`;
  s += `<path d="M1 6 Q2 1 8 1 L54 1 L40 9 L1 9Z" fill="#8cbfdd" opacity=".85"/>`;
  s += `<path d="M30 ${bh - 12} L${bw} ${bh - 16} L${bw} ${bh - 10} L26 ${bh - 6}Z" fill="#8cbfdd" opacity=".7"/>`;
  s += `<path d="M2 11 L14 11 L14 30 L2 32Z" fill="#6f7c86" ${I}/>`;
  s += `<rect x="3" y="3" width="18" height="4" rx=".8" fill="#e8c56a" ${I}/>`;
  for (let i = 0; i < BUS.windows; i++) {
    const wx = 30 + i * 15;
    s += `<rect x="${wx}" y="11" width="13.5" height="15" rx="1" fill="#6d7a83" ${I}/>`;
    if (faces[i]) s += windowFaceSVG(faces[i], wx, 11);
    s += `<rect x="${wx}" y="11" width="13.5" height="15" rx="1" fill="rgba(200,225,235,.18)" stroke="none"/>`;   // 유리 반사
  }
  s += `<rect x="17" y="11" width="10" height="${bh - 16}" fill="#7d8992" ${I}/><path d="M22 11 L22 ${bh - 5}" ${I}/>`;
  s += `<rect x="-1" y="${bh - 7}" width="${bw + 2}" height="4" rx="1.5" fill="#d9d6cf" ${I}/>`;
  s += `<circle cx="4" cy="${bh - 11}" r="1.8" fill="#fff3c4" ${I}/>`;
  for (const wx of [30, bw - 24]) s += `<circle cx="${wx}" cy="${bh}" r="8" fill="#4b4642" ${I}/><circle cx="${wx}" cy="${bh}" r="3.6" fill="#cfcbc4"/>`;
  return s;
}
// ---- 인게임과 똑같은 멍냥이를 작은 그림(스프라이트)으로 한 번 그려 두고 메인 화면에서 재사용 ----
const SPR_PX = 26 / 5.3;      // 스프라이트 픽셀 ÷ 메인 화면 단위 (인게임 r=26으로 그려서 r=5.3 크기로 보여요)
const spriteIds = new Map();
function animalSpriteId(a, lying = false) {
  const key = `${a.kind}-${a.c}-${a.ribbon ? a.ribbon.slice(1) : 'n'}-${a.bag ? 1 : 0}-${lying ? 1 : 0}`;
  if (spriteIds.has(key)) return spriteIds.get(key);
  const W = lying ? 200 : 128, H = lying ? 120 : 128;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const saved = ctx, savedLW = LW_SCALE;
  ctx = cv.getContext('2d'); LW_SCALE = 2.6;
  try {
    if (lying) drawLyingAnimal(W / 2, H - 14, 26, a.c, a.kind, a.ribbon);
    else drawAnimal(64, 108, 26, a.c, a.kind, 0, 0, { ribbon: a.ribbon, bag: a.bag });
  } finally { ctx = saved; LW_SCALE = savedLW; }
  const id = 'spr-' + key;
  const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
  img.setAttribute('id', id);
  img.setAttribute('href', cv.toDataURL());
  img.setAttribute('width', f1(W / SPR_PX)); img.setAttribute('height', f1(H / SPR_PX));
  // 발 위치가 (0,0)에 오도록
  img.setAttribute('x', f1(-W / 2 / SPR_PX)); img.setAttribute('y', f1(-(lying ? H - 14 : 108) / SPR_PX));
  $('busDefs').appendChild(img);
  spriteIds.set(key, id);
  return id;
}

// 엎드려서 자는 멍냥이 (앞발 위에 턱을 괴고). x=가운데, y=바닥
function drawLyingAnimal(x, y, r, colorIdx, kind, ribbon) {
  const C = COLORS[colorIdx], LT = lightOf(C), SH = shadeOf(C), lw = 0.9 * LW_SCALE;
  const line = (w = lw) => { ctx.strokeStyle = LINE; ctx.lineWidth = w; ctx.stroke(); };
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.fillStyle = 'rgba(70,50,30,.18)'; ell(x + r * 0.2, y + r * 0.05, r * 1.9, r * 0.22);
  const bx = x + r * 0.35, by = y - r * 0.5;                    // 몸 가운데
  const hx = x - r * 0.95, hy = y - r * 0.8, hr = r * 0.85;     // 머리
  const body = () => rr(bx - r * 1.25, by - r * 0.5, r * 2.5, r * 1.0, r * 0.5);
  const head = () => { ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); };
  const catEar = s => {
    ctx.beginPath();
    ctx.moveTo(hx + s * hr * 0.95, hy - hr * 0.1); ctx.lineTo(hx + s * hr * 0.75, hy - hr * 1.22); ctx.lineTo(hx + s * hr * 0.12, hy - hr * 0.75);
    ctx.closePath();
  };
  const dogEar = s => { ctx.beginPath(); ctx.ellipse(hx + s * hr * 0.86, hy + hr * 0.12, hr * 0.3, hr * 0.6, -s * 0.35, 0, Math.PI * 2); };
  const ear = kind === 'cat' ? catEar : dogEar;

  // 꼬리: 몸 뒤쪽에서 동그랗게 말려 있어요
  ctx.beginPath();
  ctx.moveTo(bx + r * 1.1, by + r * 0.1);
  ctx.bezierCurveTo(bx + r * 1.9, by + r * 0.2, bx + r * 1.9, by - r * 0.8, bx + r * 1.35, by - r * 0.75);
  ctx.strokeStyle = LINE; ctx.lineWidth = r * 0.3 + lw * 2; ctx.stroke();
  ctx.strokeStyle = C.c; ctx.lineWidth = r * 0.3; ctx.stroke();

  // 몸·귀·머리를 하나의 실루엣으로 (바깥만 테두리)
  ctx.strokeStyle = LINE; ctx.lineWidth = lw * 2;
  body(); ctx.stroke(); ear(-1); ctx.stroke(); ear(1); ctx.stroke(); head(); ctx.stroke();
  const bg = ctx.createLinearGradient(0, by - r * 0.5, 0, by + r * 0.5);
  bg.addColorStop(0, LT); bg.addColorStop(0.55, C.c); bg.addColorStop(1, SH);
  body(); ctx.fillStyle = bg; ctx.fill();
  for (const s of [-1, 1]) {
    ear(s); ctx.fillStyle = kind === 'cat' ? C.c : SH; ctx.fill();
    if (kind === 'cat') {
      ctx.fillStyle = '#efb5bf'; ctx.beginPath();
      ctx.moveTo(hx + s * hr * 0.78, hy - hr * 0.38); ctx.lineTo(hx + s * hr * 0.7, hy - hr * 0.95); ctx.lineTo(hx + s * hr * 0.38, hy - hr * 0.72);
      ctx.closePath(); ctx.fill();
    }
  }
  const hg = ctx.createRadialGradient(hx - hr * 0.35, hy - hr * 0.42, hr * 0.1, hx, hy, hr * 1.05);
  hg.addColorStop(0, LT); hg.addColorStop(0.65, C.c); hg.addColorStop(1, SH);
  head(); ctx.fillStyle = hg; ctx.fill();
  if (kind === 'dog') for (const s of [-1, 1]) { dogEar(s); ctx.fillStyle = SH; ctx.fill(); }

  // 턱 아래 앞발 두 개
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(hx + s * hr * 0.42, y - r * 0.12, r * 0.28, r * 0.15, 0, 0, Math.PI * 2);
    ctx.fillStyle = C.c; ctx.fill(); line(lw * 0.9);
  }
  // 주둥이·코
  ctx.fillStyle = kind === 'dog' ? '#fbf1de' : 'rgba(253,245,230,.85)'; ell(hx, hy + hr * 0.34, hr * 0.38, hr * 0.24);
  ctx.fillStyle = kind === 'dog' ? '#3a2c20' : '#d98490'; ell(hx, hy + hr * 0.22, hr * 0.13, hr * 0.09);
  // 감은 눈 + 발그레한 볼
  ctx.strokeStyle = '#2e231a'; ctx.lineWidth = Math.max(1, hr * 0.08);
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(hx + s * hr * 0.34, hy - hr * 0.06, hr * 0.13, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
  for (const s of [-1, 1]) { ctx.fillStyle = 'rgba(255,120,150,.45)'; ell(hx + s * hr * 0.58, hy + hr * 0.2, hr * 0.2, hr * 0.13); }
  if (ribbon) {
    const rx = hx + hr * 0.42, ry = hy - hr * 0.92, k = hr * 0.32;
    ctx.fillStyle = ribbon; ctx.strokeStyle = LINE; ctx.lineWidth = lw;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + s * k * 1.25, ry - k * 0.7); ctx.lineTo(rx + s * k * 1.25, ry + k * 0.7); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(rx, ry, k * 0.32, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
}

function renderBusLive() {
  const el = $('busLive');
  if (!el) return;
  if (!$('busDyn')) el.innerHTML = `<defs id="busDefs"></defs><g transform="${SCENE_T}" id="busDyn"></g>`;
  const B = busLive, by = BUS.y0 - 6 - BUS.h;
  let s = `<g transform="translate(${f1(BUS.x + B.dx)} ${by})">${busBodySVG(B.faces)}</g>`;
  // 줄 선 친구들 (인게임과 똑같은 그림, 크기만 작게)
  B.queue.forEach(a => {
    s += `<use href="#${animalSpriteId(a)}" transform="translate(${f1(a.x)} ${BUS.y0 + 7})" opacity="${f1(a.op)}"/>`;
  });
  if (B.walker) {
    const w = B.walker;
    s += `<use href="#${animalSpriteId(w)}" transform="translate(${f1(w.x)} ${f1(w.y)}) scale(${f1(w.k)})" opacity="${f1(w.op)}"/>`;
  }
  // 정류장 벤치에 엎드려 쿨쿨 자는 친구 + 둥실 떠오르는 z
  const tz = performance.now() / 1000;
  s += `<use href="#${animalSpriteId(benchSleeper, true)}" transform="translate(54 ${f1(BUS.y0 - 14 + Math.sin(tz * 1.6) * 0.25)}) scale(.72)"/>`;
  for (let i = 0; i < 3; i++) {
    const k = (tz / 2.4 + i / 3) % 1;
    s += `<text x="${f1(48 + k * 8)}" y="${f1(BUS.y0 - 24 - k * 12)}" font-size="${f1(3 + k * 3)}" font-family="MaruBuri, serif" font-weight="700" fill="#8f9bb3" opacity="${f1(Math.sin(k * Math.PI) * 0.9)}">z</text>`;
  }
  $('busDyn').innerHTML = s;
}
const benchSleeper = { kind: 'cat', c: 3, ribbon: '#e8768e', bag: false };
function tickBusLive() {
  const now = performance.now(), dt = Math.min(0.1, (now - (busLive.last || now)) / 1000);
  busLive.last = now;
  if (S || document.hidden) return;                       // 게임 중이거나 화면이 꺼져 있으면 쉬어요
  const B = busLive;
  while (B.queue.length < 5) B.queue.push({ ...randFriend(), x: 150, op: 0 });
  // 줄 선 친구들은 자기 자리로 조금씩 걸어가요
  B.queue.forEach((a, i) => {
    const tx = BUS.doorX - 12 - i * BUS.gap;
    a.x += (tx - a.x) * Math.min(1, dt * 4);
    a.op = Math.min(1, a.op + dt * 2);
  });
  B.t += dt;
  if (B.phase === 'arrive') {                             // 새 버스가 오른쪽에서 들어와요
    B.dx = 230 * Math.pow(1 - Math.min(1, B.t / 2.6), 3);
    if (B.t >= 2.6) { B.phase = 'board'; B.t = 0; B.timer = 1.2; B.dx = 0; }
  } else if (B.phase === 'board') {
    B.timer -= dt;
    if (B.timer <= 0 && !B.walker && B.faces.length < BUS.windows) {
      const a = B.queue.shift();                          // 맨 앞 친구가 문으로 쏙
      B.walker = { ...a, y: BUS.y0 + 7, k: 1, op: 1, t: 0 };
      B.timer = BUS.every;
    }
    if (B.walker) {
      const w = B.walker;
      w.t += dt / 0.9;
      w.x = lerp(w.x, BUS.x + 22, Math.min(1, dt * 6));
      w.y = BUS.y0 + 7 - w.t * 8;
      w.k = 1 - w.t * 0.3; w.op = 1 - w.t;
      if (w.t >= 1) { B.faces.push(w); B.walker = null; }   // 창문에 얼굴이 나타나요
    }
    if (B.faces.length >= BUS.windows && !B.walker) { B.phase = 'full'; B.t = 0; }
  } else if (B.phase === 'full') {                        // 모두 창밖을 바라보는 모습을 잠깐 보여 주고
    if (B.t >= 1.6) { B.phase = 'leave'; B.t = 0; }
  } else if (B.phase === 'leave') {                       // 왼쪽으로 출발!
    B.dx = -360 * Math.pow(Math.min(1, B.t / 3.4), 2);
    if (B.t >= 3.4) { B.phase = 'arrive'; B.t = 0; B.faces = []; B.dx = 230; }
  }
  renderBusLive();
}
setInterval(tickBusLive, 50);

    <path d="M-17 -22 L-36 -36 M-31 -32 L-35 -40 M17 -22 L35 -34 M30 -31 L36 -38" stroke="#6d5e55" stroke-width="2" stroke-linecap="round" fill="none"/>
