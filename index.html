<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>멍냥이의 버스여행</title>
<style>
  /* 마루 부리 (네이버, OFL - 상업적 사용 가능) */
  @font-face { font-family: 'MaruBuri'; font-weight: 200; font-display: swap; src: url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-ExtraLight.woff2) format('woff2'); }
  @font-face { font-family: 'MaruBuri'; font-weight: 300; font-display: swap; src: url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Light.woff2) format('woff2'); }
  @font-face { font-family: 'MaruBuri'; font-weight: 400; font-display: swap; src: url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2) format('woff2'); }
  @font-face { font-family: 'MaruBuri'; font-weight: 600; font-display: swap; src: url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-SemiBold.woff2) format('woff2'); }
  @font-face { font-family: 'MaruBuri'; font-weight: 700; font-display: swap; src: url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Bold.woff2) format('woff2'); }

  :root {
    --ink: #4a3b2c;
    --muted: #8a7660;
    --accent: #eb9a68;
    --accent-dark: #c47548;
    --green: #93b97b;
    --green-dark: #6f945a;
    --cream: #fff8ec;
    --locked: #cdbfae;
    --line: #4a3b2c;     /* 얇은 그림 테두리 색 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden; user-select: none; color: var(--ink);
    background: #f3e6cf;
    font-family: 'MaruBuri', "Apple SD Gothic Neo", "Malgun Gothic", serif;
    font-weight: 600;
  }
  button { font-family: inherit; }
  #app { position: relative; height: 100%; max-width: 560px; margin: 0 auto; overflow: hidden; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .screen.hidden { display: none; }

  /* ---------------- 메인 화면 ---------------- */
  #menu .scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #menu .sky { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  #menu > *:not(.scene):not(.sky) { position: relative; z-index: 1; }
  /* 흘러가는 뭉게구름 */
  .cloud { position: absolute; left: -200px; opacity: .95; animation: drift linear infinite; }
  .cloud.c1 { top: 4%; width: 170px; animation-duration: 70s; animation-delay: -20s; }
  .cloud.c2 { top: 15%; width: 120px; animation-duration: 95s; animation-delay: -60s; opacity: .8; }
  .cloud.c3 { top: 27%; width: 210px; animation-duration: 120s; animation-delay: -5s; opacity: .7; }
  @keyframes drift { from { left: -220px; } to { left: 105%; } }
  /* 바람에 날리는 민들레 홀씨 */
  .fluff {
    position: absolute; width: 7px; height: 7px; border-radius: 50%;
    background: radial-gradient(circle, #fff 30%, rgba(255, 255, 255, 0) 70%);
    animation: float linear infinite; opacity: 0;
  }
  @keyframes float {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: .9; }
    50% { transform: translate(60px, -90px); }
    90% { opacity: .8; }
    100% { transform: translate(130px, -200px); opacity: 0; }
  }
  #mapScroll { flex: 1; overflow-y: auto; position: relative; scrollbar-width: none; }
  #mapScroll::-webkit-scrollbar { display: none; }
  #mapInner { position: relative; width: 100%; }
  #mapRoad { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  /* 단계 원: 얇은 갈색 테두리, 차분한 색 */
  .node {
    position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    border: 1.6px solid var(--line); color: #fffaf1; font-size: 22px; line-height: 1; cursor: pointer;
    box-shadow: 0 3px 6px rgba(70, 50, 30, .18);
  }
  .node small { display: block; font-size: 9px; letter-spacing: 1px; margin-top: 3px; color: rgba(255, 250, 241, .9); }
  .node.done { background: #8fae78; }
  .node.current { background: #d9906a; animation: breathe 2.4s ease-in-out infinite; }
  .node.locked { background: #d8ccb9; cursor: pointer; box-shadow: 0 2px 4px rgba(70, 50, 30, .1); }
  .node.locked svg { display: block; margin: 0 auto; }
  .node .busIcon {
    position: absolute; left: 50%; top: -34px; width: 40px; transform: translateX(-50%);
    animation: bob 1.6s ease-in-out infinite; pointer-events: none;
  }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes bob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -4px); } }
  #menu > #settingsBtn { position: absolute; top: 14px; right: 14px; z-index: 2; }

  /* ---------------- 게임 화면 ---------------- */
  #game { background: linear-gradient(#cfe0dc, #f2e7d0 40%, #eee0c4); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 4px; }
  .hbtns { display: flex; gap: 8px; }
  .round {
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
    background: var(--cream); color: var(--ink); font-size: 20px;
    border: 1.6px solid var(--line); box-shadow: 0 2px 5px rgba(70, 50, 30, .15);
  }
  .round:active { transform: translateY(1px); box-shadow: none; }
  #title { text-align: center; }
  #levelLabel { font-size: 22px; }
  #leftLabel { font-size: 13px; color: var(--muted); }
  #stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  footer { display: flex; gap: 12px; justify-content: center; padding: 8px 14px 16px; }
  .booster {
    position: relative; flex: 1; max-width: 160px; height: 52px; border-radius: 14px; cursor: pointer;
    background: var(--cream); color: var(--ink); font-size: 16px;
    border: 1.6px solid var(--line); box-shadow: 0 2px 5px rgba(70, 50, 30, .15);
  }
  .booster:active { transform: translateY(1px); box-shadow: none; }
  .booster:disabled { opacity: .45; cursor: default; }
  .booster.active { background: #f3dc9c; }
  .booster .cnt {
    position: absolute; top: -9px; right: -7px; min-width: 22px; height: 22px; padding: 0 5px;
    border-radius: 11px; background: #8fae78; color: #fffaf1; font-size: 12px; line-height: 19px;
    border: 1.4px solid var(--line);
  }

  /* 설정 / 단계 팝업 */
  .setRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0 6px; font-size: 16px; }
  .setRow input[type=range] { flex: 1; accent-color: #b98a64; }
  .switch { position: relative; width: 46px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span {
    position: absolute; inset: 0; border-radius: 13px; background: #d8ccb9; border: 1.4px solid var(--line);
    transition: background .2s; cursor: pointer;
  }
  .switch span::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%;
    background: var(--cream); border: 1.2px solid var(--line); transition: transform .2s;
  }
  .switch input:checked + span { background: #8fae78; }
  .switch input:checked + span::after { transform: translateX(19px); }
  .stars { font-size: 26px; letter-spacing: 3px; color: #d9906a; margin: 2px 0 6px; }
  .stars .off { color: #dccfbc; }

  #toast {
    position: absolute; left: 50%; top: 68px; transform: translateX(-50%);
    background: rgba(74, 59, 44, .92); color: #fffaf1; padding: 10px 16px; border-radius: 12px;
    font-size: 16px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 6;
  }
  #toast.show { opacity: 1; }

  #overlay {
    position: absolute; inset: 0; background: rgba(40, 34, 25, .5); z-index: 5;
    display: none; align-items: center; justify-content: center;
  }
  #overlay.show { display: flex; }
  .card {
    background: var(--cream); border-radius: 20px; padding: 24px 22px 20px; text-align: center; width: min(86%, 340px);
    border: 1.6px solid var(--line); box-shadow: 0 8px 24px rgba(60, 40, 20, .25);
  }
  .card h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  #levelLabel, .btn, .node { font-weight: 700; }
  .card p { margin-bottom: 12px; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .btn {
    display: block; width: 100%; padding: 13px; margin-top: 10px; border-radius: 12px; cursor: pointer;
    font-size: 17px; background: #d9906a; color: #fffaf1;
    border: 1.6px solid var(--line); box-shadow: 0 2px 5px rgba(70, 50, 30, .15);
  }
  .btn:active { transform: translateY(1px); box-shadow: none; }
  .btn.alt { background: #f1e5cf; color: var(--ink); }
</style>
</head>
<body>
<div id="app">

  <!-- ================= 메인 화면 ================= -->
  <section class="screen" id="menu">
    <svg class="scene" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9dcbe0"/>
          <stop offset="0.3" stop-color="#cfe6e2"/>
          <stop offset="0.55" stop-color="#f7ecd3"/>
          <stop offset="1" stop-color="#f3e2c0"/>
        </linearGradient>
        <radialGradient id="sun" cx="0.85" cy="0.08" r="0.55">
          <stop offset="0" stop-color="#fff7da" stop-opacity="1"/>
          <stop offset="0.4" stop-color="#fff2cc" stop-opacity=".45"/>
          <stop offset="1" stop-color="#fff2cc" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="mt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3cad0"/><stop offset="1" stop-color="#d9e4d8"/></linearGradient>
        <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe2ad"/><stop offset="1" stop-color="#b5d296"/></linearGradient>
        <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6d595"/><stop offset="1" stop-color="#9cc47f"/></linearGradient>
        <linearGradient id="h4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a2c985"/><stop offset="1" stop-color="#86b46d"/></linearGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
        <!-- 종이 질감 -->
        <filter id="paper">
          <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="4"/>
          <feColorMatrix type="matrix" values="0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .2  0 0 0 .08 0"/>
        </filter>
      </defs>
      <rect width="400" height="800" fill="url(#sky)"/>
      <rect width="400" height="800" fill="url(#sun)"/>

      <!-- 먼 산 -->
      <path d="M0 300 C 30 278 60 258 100 266 C 140 236 185 226 228 252 C 268 232 318 220 360 246 C 380 240 394 242 400 244 L400 800 L0 800Z" fill="url(#mt)" stroke="#4a3b2c" stroke-opacity=".35" stroke-width="1"/>

      <!-- 언덕 2 + 작은 빨간 지붕 집 + 나무 덤불 (얇은 테두리) -->
      <path d="M0 360 C 70 322 140 346 200 332 C 270 314 330 342 400 322 L400 800 L0 800Z" fill="url(#h2)" stroke="#4a3b2c" stroke-opacity=".45" stroke-width="1"/>
      <g transform="translate(88 318)" stroke="#4a3b2c" stroke-width=".9" stroke-linejoin="round">
        <rect x="0" y="8" width="22" height="14" fill="#efe2c8"/>
        <path d="M-4 9 L11 -2 L26 9 Z" fill="#c97f68"/>
        <rect x="8" y="13" width="5" height="9" fill="#a9876a"/>
        <rect x="15" y="12" width="4" height="4" fill="#9dc3d6"/>
      </g>
      <g stroke="#4a3b2c" stroke-width=".9" stroke-opacity=".7">
        <circle cx="316" cy="326" r="12" fill="#6f9658"/><circle cx="298" cy="322" r="15" fill="#81a868"/>
        <circle cx="162" cy="342" r="7" fill="#6f9658"/><circle cx="150" cy="340" r="9" fill="#81a868"/></g>
      <g fill="#a3c587" opacity=".7"><circle cx="293" cy="316" r="6"/><circle cx="147" cy="336" r="3.5"/></g>

      <!-- 언덕 3 -->
      <path d="M0 470 C 90 422 180 462 260 432 C 320 410 362 426 400 414 L400 800 L0 800Z" fill="url(#h3)" stroke="#4a3b2c" stroke-opacity=".5" stroke-width="1.1"/>
      <g stroke="#4a3b2c" stroke-width="1" stroke-opacity=".75">
        <rect x="52" y="462" width="5" height="14" rx="2" fill="#8f6a4d"/>
        <circle cx="70" cy="456" r="17" fill="#6a9254"/><circle cx="46" cy="452" r="22" fill="#78a160"/></g>
      <g fill="#9dc17f" opacity=".7"><circle cx="38" cy="442" r="9"/><circle cx="64" cy="448" r="5"/></g>

      <!-- 가까운 언덕 -->
      <path d="M0 600 C 100 560 200 600 290 570 C 340 554 375 562 400 558 L400 800 L0 800Z" fill="url(#h4)" stroke="#4a3b2c" stroke-opacity=".55" stroke-width="1.2"/>
      <g stroke="#5f8a4a" stroke-width="1.4" stroke-linecap="round" opacity=".6" fill="none">
        <path d="M30 650 l3 -9 M36 652 l1 -10 M42 650 l-2 -8"/><path d="M330 690 l3 -9 M336 692 l1 -10 M342 690 l-2 -8"/>
        <path d="M180 740 l3 -9 M186 742 l1 -10 M192 740 l-2 -8"/><path d="M90 770 l3 -9 M96 772 l1 -10"/>
      </g>
      <g fill="#fff4f0" opacity=".85"><circle cx="60" cy="700" r="2.5"/><circle cx="250" cy="660" r="2.5"/><circle cx="350" cy="760" r="2.5"/><circle cx="140" cy="640" r="2"/></g>
      <g fill="#fbe7a0" opacity=".9"><circle cx="210" cy="720" r="2.5"/><circle cx="300" cy="630" r="2"/><circle cx="30" cy="760" r="2"/></g>

      <rect width="400" height="800" filter="url(#paper)"/>
    </svg>

    <!-- 흘러가는 구름 + 민들레 홀씨 -->
    <div class="sky" id="sky">
      <svg class="cloud c1" viewBox="0 0 200 95"><g fill="#e4ecef"><circle cx="60" cy="62" r="30"/><circle cx="96" cy="48" r="38"/><circle cx="136" cy="60" r="30"/><circle cx="166" cy="70" r="20"/><circle cx="34" cy="72" r="18"/></g><g fill="#fff"><circle cx="60" cy="56" r="30"/><circle cx="96" cy="42" r="38"/><circle cx="136" cy="54" r="30"/><circle cx="166" cy="64" r="20"/><circle cx="34" cy="66" r="18"/></g></svg>
      <svg class="cloud c2" viewBox="0 0 200 95"><g fill="#e4ecef"><circle cx="70" cy="62" r="28"/><circle cx="110" cy="50" r="34"/><circle cx="148" cy="64" r="24"/></g><g fill="#fff"><circle cx="70" cy="56" r="28"/><circle cx="110" cy="44" r="34"/><circle cx="148" cy="58" r="24"/></g></svg>
      <svg class="cloud c3" viewBox="0 0 200 95"><g fill="#e4ecef"><circle cx="50" cy="66" r="22"/><circle cx="85" cy="52" r="32"/><circle cx="125" cy="48" r="36"/><circle cx="162" cy="66" r="22"/></g><g fill="#fff"><circle cx="50" cy="60" r="22"/><circle cx="85" cy="46" r="32"/><circle cx="125" cy="42" r="36"/><circle cx="162" cy="60" r="22"/></g></svg>
    </div>

    <button class="round settingsBtn" id="settingsBtn" title="설정"></button>
    <div id="mapScroll"><div id="mapInner"><svg id="mapRoad"></svg></div></div>
  </section>

  <!-- ================= 게임 화면 ================= -->
  <section class="screen hidden" id="game">
    <header>
      <button class="round" id="homeBtn" title="지도로">⌂</button>
      <div id="title">
        <div id="levelLabel">1단계</div>
        <div id="leftLabel">남은 승객 0명</div>
      </div>
      <div class="hbtns">
        <button class="round" id="restartBtn" title="다시 하기">↻</button>
        <button class="round settingsBtn" id="settingsBtn2" title="설정"></button>
      </div>
    </header>
    <div id="stage"><canvas id="cv"></canvas></div>
    <footer>
      <button class="booster" id="slotBtn">+ 자리 추가<span class="cnt" id="slotCnt">1</span></button>
      <button class="booster" id="liftBtn">크레인<span class="cnt" id="liftCnt">1</span></button>
    </footer>
  </section>

  <div id="toast"></div>
  <div id="overlay"><div class="card" id="card"></div></div>
</div>

<script>
// =====================================================================
//  기본 설정
// =====================================================================
// 따뜻한 파스텔 팔레트 (c = 밝은 색, d = 그림자 색)
const COLORS = [
  { c: '#ec8c7e', d: '#c2675b' }, // 토마토 (빨강)
  { c: '#8dbbe0', d: '#6290b8' }, // 여름 하늘 (파랑)
  { c: '#a3cf8c', d: '#73a25f' }, // 새싹 (초록)
  { c: '#f4d27c', d: '#cba54e' }, // 버터 (노랑)
  { c: '#bda6dc', d: '#8f78b2' }, // 라벤더 (보라)
  { c: '#f5ae74', d: '#cc844c' }, // 살구 (주황)
  { c: '#f3a9c1', d: '#c97e98' }, // 복숭아 (분홍)
  { c: '#92d3c6', d: '#5fa699' }, // 박하 (민트)
  { c: '#c19674', d: '#8f6a4d' }, // 코코아 (갈색)
];
const HIDDEN_COLOR = { c: '#776b7d', d: '#524857' };
const LINE = 'rgba(58,44,32,.9)';   // 그림의 얇은 갈색 테두리
const MAX_SLOTS = 7;    // 대기 칸 최대
const BASE_SLOTS = 4;   // 처음 열린 대기 칸
const BODY_W = 0.74;    // 버스 폭 (칸 단위)
const GAP = 0.03;       // 버스 사이 최소 간격의 절반

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);

// 얇은 갈색 선으로 그린 아이콘들
const GEAR_SVG = `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="#4a3b2c" stroke-width="1.6" stroke-linecap="round">
  <circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="6.8"/>
  <path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.4 5.4l1.8 1.8M16.8 16.8l1.8 1.8M5.4 18.6l1.8-1.8M16.8 7.2l1.8-1.8"/></g></svg>`;
const LOCK_SVG = `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g stroke="#4a3b2c" stroke-width="1.5" stroke-linejoin="round">
  <path d="M8 11V8.2a4 4 0 0 1 8 0V11" fill="none"/><rect x="5.5" y="11" width="13" height="9" rx="2" fill="#f1e5cf"/>
  <circle cx="12" cy="15.3" r="1.2" fill="#4a3b2c" stroke="none"/></g></svg>`;
const BUS_SVG = `<svg class="busIcon" viewBox="0 0 42 28" aria-hidden="true"><g stroke="#4a3b2c" stroke-width="1.2" stroke-linejoin="round">
  <path d="M3 8 Q3 3 9 3 H33 Q39 3 39 9 V21 H3 Z" fill="#efd9a0"/><path d="M3 14 H39 V21 H3 Z" fill="#d9906a"/>
  <rect x="7" y="6" width="6" height="5" rx="1" fill="#b9d0d6"/><rect x="15" y="6" width="6" height="5" rx="1" fill="#b9d0d6"/>
  <rect x="23" y="6" width="6" height="5" rx="1" fill="#b9d0d6"/><rect x="31" y="6" width="5" height="7" rx="1" fill="#b9d0d6"/>
  <circle cx="11" cy="22" r="3.4" fill="#5a4a3a"/><circle cx="31" cy="22" r="3.4" fill="#5a4a3a"/></g></svg>`;

// 저장 (브라우저에 진행 상황 기억)
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let unlocked = Math.max(store.get('busGame.unlocked', 1), store.get('busGameLevel', 1));
// 소리 설정 (설정 창에서 바꿈)
const settings = Object.assign({ bgmOn: true, bgmVol: 0.6, sfxOn: true, sfxVol: 0.8 }, store.get('busGame.settings', {}));
const saveSettings = () => store.set('busGame.settings', settings);

let S = null;  // 게임 상태 (메인 화면에서는 null)
const L = {};  // 게임 화면 배치 정보

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const normAng = a => { while (a > Math.PI) a -= Math.PI * 2; while (a <= -Math.PI) a += Math.PI * 2; return a; };

// =====================================================================
//  도형 계산 (버스 = 회전된 직사각형)
//  ang = 버스가 바라보는 방향. 0 = 위, 90도 = 오른쪽, 45도 = 오른쪽 위 ...
// =====================================================================
function axes(ang) {
  return { ux: Math.sin(ang), uy: -Math.cos(ang), vx: Math.cos(ang), vy: Math.sin(ang) };
}
function makeBox(cx, cy, ang, hl, hw) { return { cx, cy, hl, hw, ...axes(ang) }; }
function bodyBox(v, inflate = 0) { return makeBox(v.cx, v.cy, v.ang, v.l / 2 + inflate, v.w / 2 + inflate); }
// 버스가 앞으로 쭉 나갈 때 쓸고 지나가는 영역
function sweepBox(v) {
  const F = 40, a = axes(v.ang);
  return makeBox(v.cx + a.ux * F / 2, v.cy + a.uy * F / 2, v.ang, v.l / 2 + F / 2, v.w / 2 - 0.02);
}
function proj(b, ax, ay) {
  const c = b.cx * ax + b.cy * ay;
  const r = b.hl * Math.abs(b.ux * ax + b.uy * ay) + b.hw * Math.abs(b.vx * ax + b.vy * ay);
  return [c - r, c + r];
}
// 두 직사각형이 겹치는지 (분리축 정리)
function overlap(A, B) {
  const dx = A.cx - B.cx, dy = A.cy - B.cy;
  const rs = Math.hypot(A.hl, A.hw) + Math.hypot(B.hl, B.hw);
  if (dx * dx + dy * dy > rs * rs) return false;
  for (const [ax, ay] of [[A.ux, A.uy], [A.vx, A.vy], [B.ux, B.uy], [B.vx, B.vy]]) {
    const pa = proj(A, ax, ay), pb = proj(B, ax, ay);
    if (pa[1] <= pb[0] + 1e-6 || pb[1] <= pa[0] + 1e-6) return false;
  }
  return true;
}
function insideBoard(v, cols, rows) {
  const b = bodyBox(v);
  for (const s of [1, -1]) for (const t of [1, -1]) {
    const x = b.cx + b.ux * b.hl * s + b.vx * b.hw * t;
    const y = b.cy + b.uy * b.hl * s + b.vy * b.hw * t;
    if (x < 0.04 || y < 0.04 || x > cols - 0.04 || y > rows - 0.04) return false;
  }
  return true;
}

// =====================================================================
//  단계(레벨) 만들기
//  1) 주차장을 버스로 빽빽하게 채웁니다 (가로/세로/대각선).
//  2) "지금 앞이 뚫린 버스"를 하나씩 골라 방향을 정하고 빼냅니다.
//     → 이 순서대로 빼면 반드시 풀리므로, 모든 단계는 풀 수 있습니다.
// =====================================================================
// 난이도 주기: 10단계마다 [쉬움 → 어려움 → 매우 어려움]이 반복되고, 10번째 단계가 가장 어려워요.
//   1:쉬움 2:어려움 3:매우 어려움 4:쉬움 5:어려움 6:매우 어려움 7:쉬움 8:어려움 9:매우 어려움 10:최고 난이도
// 10단계 묶음이 넘어갈 때마다 전체 난이도가 조금씩 올라갑니다.
const TIERS = {
  1: { stars: 1, name: '쉬움' },
  3: { stars: 3, name: '어려움' },
  4: { stars: 4, name: '매우 어려움' },
  5: { stars: 5, name: '최고 난이도' },
};
function levelTier(n) {
  const pos = (n - 1) % 10 + 1;
  if (pos === 10) return 5;
  return [1, 3, 4][(pos - 1) % 3];
}
// 실제로 버스 수, 색 수 등을 정할 때 쓰는 "체감 난이도" 값
function effectiveLevel(n) {
  const block = Math.floor((n - 1) / 10);
  return (levelTier(n) - 1) * 4 + 1 + block * 5;
}

function levelParams(n) {
  const e = effectiveLevel(n);
  return {
    cols: Math.min(6 + Math.floor((e - 1) / 4), 9),
    rows: Math.min(8 + Math.floor((e - 1) / 3), 11),
    colorCount: Math.min(3 + Math.floor((e - 1) / 2), COLORS.length),
    diagChance: Math.min(0.1 + e * 0.025, 0.35),
    hiddenChance: e >= 4 ? Math.min(0.08 + e * 0.02, 0.3) : 0,
    mix: Math.min(10 + e * 3, 70),   // 승객 순서가 섞이는 정도
    target: e,
  };
}

function genLevel(n) {
  const rng = mulberry32(n * 7919 + 13);
  const P = levelParams(n);
  const { cols, rows } = P;
  const target = Math.min(17 + 3 * (P.target - 1), Math.floor(cols * rows / 2));

  // 1) 빽빽하게 배치
  const placed = [];
  for (let tries = 0; tries < 25000 && placed.length < target; tries++) {
    const len = rng() < 0.38 ? 3 : 2;
    let base, cx, cy;
    if (rng() < P.diagChance) {
      base = rng() < 0.5 ? Math.PI / 4 : Math.PI * 3 / 4;
      cx = Math.round(rng() * cols * 2) / 2;
      cy = Math.round(rng() * rows * 2) / 2;
    } else if (rng() < 0.5) {
      base = 0;
      cx = Math.floor(rng() * cols) + 0.5;
      cy = Math.floor(rng() * (rows - len + 1)) + len / 2;
    } else {
      base = Math.PI / 2;
      cx = Math.floor(rng() * (cols - len + 1)) + len / 2;
      cy = Math.floor(rng() * rows) + 0.5;
    }
    const v = { cx, cy, ang: base, len, l: len - 0.14, w: BODY_W };
    if (!insideBoard(v, cols, rows)) continue;
    v.pack = bodyBox(v, GAP);
    if (placed.some(o => overlap(v.pack, o.pack))) continue;
    v.body = bodyBox(v);
    placed.push(v);
  }

  // 2) 빼낼 수 있는 순서와 방향 정하기
  let remaining = placed.slice();
  const order = [];
  while (remaining.length) {
    const cands = [];
    for (const v of remaining) {
      for (const flip of [0, Math.PI]) {
        const sw = sweepBox({ ...v, ang: v.ang + flip });
        if (!remaining.some(o => o !== v && overlap(sw, o.body))) cands.push([v, v.ang + flip]);
      }
    }
    if (!cands.length) {  // 꽉 막혀 아무도 못 나가면 버스 하나를 없앱니다
      remaining.splice(Math.floor(rng() * remaining.length), 1);
      continue;
    }
    const [v, ang] = cands[Math.floor(rng() * cands.length)];
    v.ang = normAng(ang);
    order.push(v);
    remaining = remaining.filter(o => o !== v);
  }

  // 색 / 정원 / 미스터리
  const idx = COLORS.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  const palette = idx.slice(0, P.colorCount);
  order.forEach((v, i) => {
    v.color = palette[i < P.colorCount ? i : Math.floor(rng() * P.colorCount)];
    v.cap = v.len === 3 ? 6 : 4;
    v.hidden = rng() < P.hiddenChance;
  });

  // 승객 줄: 빼낼 순서대로 만든 뒤 단계가 오를수록 더 섞기
  const q = [];
  let k = 0;
  for (const v of order) for (let j = 0; j < v.cap; j++) q.push({ color: v.color, key: k++ });
  q.forEach(p => p.key += rng() * P.mix);
  q.sort((a, b) => a.key - b.key);

  return { cols, rows, vehicles: order, queue: q.map(p => ({ color: p.color, kind: rng() < 0.5 ? 'cat' : 'dog' })) };
}

// =====================================================================
//  게임 시작
// =====================================================================
function startLevel(n) {
  const g = genLevel(n);
  S = {
    level: n, cols: g.cols, rows: g.rows, vehicles: [],
    waiting: g.queue,   // 원 밖에서 줄 서서 기다리는 승객
    ring: [],           // 원 위의 자리들 (승객 또는 빈자리 null)
    ringOff: 0,         // 원이 돌아간 거리
    slots: new Array(MAX_SLOTS).fill(null), slotCount: BASE_SLOTS,
    flying: [], boardTimer: 0.6, boost: { slot: 1, lift: 1 }, liftMode: false, over: false, time: 0,
  };
  g.vehicles.forEach((v, i) => {
    S.vehicles.push({
      id: i, cx: v.cx, cy: v.cy, ang: v.ang, len: v.len, l: v.l, w: v.w, body: bodyBox(v),
      color: v.color, cap: v.cap, hidden: v.hidden,
      state: 'parked', off: 0, bump: null, shake: 0, filled: 0, incoming: 0, pop: 1, t: 0,
    });
  });
  showScreen('game');
  revealCheck(true);
  layout();
  for (let k = 0; k < S.ring.length; k++) if (S.waiting.length) S.ring[k] = S.waiting.shift();
  hideOverlay();
  updateUI();
  if (n === 1) toast('화살표 앞이 뚫린 버스를 눌러 보세요!', 2600);
}

const parkedBlockers = v => {
  const sw = sweepBox(v);
  return S.vehicles.filter(o => o !== v && o.state === 'parked' && overlap(sw, o.body));
};

function revealCheck(instant) {
  for (const v of S.vehicles) {
    if (v.state === 'parked' && v.hidden && parkedBlockers(v).length === 0) {
      v.hidden = false;
      v.pop = instant ? 1 : 0;
    }
  }
}

function freeSlot() {
  for (let i = 0; i < S.slotCount; i++) if (!S.slots[i]) return i;
  return -1;
}

// =====================================================================
//  게임 화면 배치
// =====================================================================
function layout() {
  const W = stage.clientWidth, H = stage.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  L.W = W; L.H = H;
  const pad = 10;

  // 승객 구역: 빙글빙글 도는 원형 길 + 원에 들어가려고 기다리는 줄
  L.pr = clamp(W / 46, 6, 10);
  L.laneW = L.pr * 2.9;
  L.sp = L.pr * 2.15;
  L.qTop = 2; L.qH = clamp(H * 0.27, 130, 250);
  L.headRoom = L.pr * 2.3;
  L.ry = Math.max(20, (L.qH - L.laneW - L.headRoom - 12) / 2);
  L.rx = Math.max(L.ry * 1.2, Math.min((W - 28) * 0.34, L.ry * 2.4));
  L.rcx = 16 + L.laneW / 2 + L.rx + 4;
  L.rcy = L.qTop + L.headRoom + 6 + L.laneW / 2 + L.ry;
  buildRing();
  buildWaitPath();
  L.tufts = [];
  const tr = mulberry32(7);
  for (let i = 0; i < 26; i++) L.tufts.push([14 + tr() * (W - 28), L.qTop + 8 + tr() * (L.qH - 16), tr()]);

  // 정류장 대기 칸
  L.sTop = L.qTop + L.qH + 8;
  L.sH = clamp(H * 0.12, 60, 110);
  L.sw = Math.min((W - 2 * pad) / MAX_SLOTS, L.sH * 0.62);
  L.sx0 = (W - L.sw * MAX_SLOTS) / 2;

  // 주차장
  const bTop = L.sTop + L.sH + 12, bH = H - bTop - pad;
  L.cs = Math.floor(Math.min((W - 2 * pad) / (S.cols + 0.4), bH / (S.rows + 0.4)));
  L.bx = (W - L.cs * S.cols) / 2;
  L.by = bTop + (bH - L.cs * S.rows) / 2;

  syncRing();
}

// 점들을 이어 만든 길 (길이를 따라 위치를 구할 수 있게)
function makePath(pts, closed) {
  if (closed) pts = pts.concat([pts[0]]);
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, total: cum[cum.length - 1] };
}
function pathPoint(path, s) {
  const { cum, pts, total } = path;
  if (s <= 0) return { x: pts[0][0], y: pts[0][1] };
  if (s >= total) { const p = pts[pts.length - 1]; return { x: p[0], y: p[1] }; }
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
  const t = (s - cum[lo]) / (cum[hi] - cum[lo] || 1);
  return { x: lerp(pts[lo][0], pts[hi][0], t), y: lerp(pts[lo][1], pts[hi][1], t) };
}

// 원형 길 (오른쪽 끝에서 시작해 시계 방향으로 돕니다)
function buildRing() {
  const pts = [];
  for (let i = 0; i < 160; i++) {
    const a = i / 160 * Math.PI * 2;
    pts.push([L.rcx + Math.cos(a) * L.rx, L.rcy + Math.sin(a) * L.ry]);
  }
  L.ring = makePath(pts, true);
  L.ringN = Math.max(8, Math.floor(L.ring.total / (L.sp * 1.05)));
  L.ringSp = L.ring.total / L.ringN;
}

// 원 입구(오른쪽)에서 시작해 위아래로 구불구불한 대기 줄
function buildWaitPath() {
  const g = L.laneW + 7, ex = L.rcx + L.rx, ey = L.rcy;
  const xa = ex + L.laneW / 2 + 6, xb = L.W - 16;
  const C = Math.max(1, Math.floor((xb - xa) / g));
  const yT = L.qTop + L.headRoom + 6 + L.laneW / 2 + g / 2;
  const yB = L.qTop + L.qH - 6 - L.laneW / 2 - g / 2;
  const pts = [[ex, ey]];
  for (let c = 0; c < C; c++) {
    const x = xa + g / 2 + c * g, down = c % 2 === 0;
    const ys = c === 0 ? ey : (down ? yT : yB), ye = down ? yB : yT;
    const steps = Math.max(2, Math.ceil(Math.abs(ye - ys) / 6));
    for (let i = 0; i <= steps; i++) pts.push([x, lerp(ys, ye, i / steps)]);
    if (c < C - 1) {
      for (let i = 1; i < 14; i++) {
        const a = down ? Math.PI - (i / 14) * Math.PI : Math.PI + (i / 14) * Math.PI;
        pts.push([x + g / 2 + Math.cos(a) * g / 2, ye + Math.sin(a) * g / 2]);
      }
    }
  }
  L.wait = makePath(pts, false);
  L.waitMax = Math.max(0, Math.floor(L.wait.total / L.sp) - 1);
}

// 화면 크기가 바뀌어 원 위 자리 수가 달라지면 승객을 다시 배치
function syncRing() {
  if (S.ring.length === L.ringN) return;
  const ppl = S.ring.filter(Boolean);
  S.ring = new Array(L.ringN).fill(null);
  ppl.forEach((p, i) => { if (i < L.ringN) S.ring[i] = p; else S.waiting.unshift(p); });
}
const ringS = k => (k * L.ringSp + S.ringOff) % L.ring.total;
const remainingCount = () => S.waiting.length + S.ring.filter(Boolean).length + S.flying.length;

function bestVehicleFor(color) {
  let best = null;
  for (let i = 0; i < S.slotCount; i++) {
    const v = S.slots[i];
    if (v && v.state === 'slot' && v.color === color && v.filled + v.incoming < v.cap) {
      if (!best || v.filled + v.incoming > best.filled + best.incoming) best = v;
    }
  }
  return best;
}

const slotPos = i => ({ x: L.sx0 + L.sw * (i + 0.5), y: L.sTop + L.sH / 2 });
const slotSize = v => { const w = L.sw * 0.72; return { w, l: Math.min(L.sH * 0.9, w * (v.len === 3 ? 2.4 : 1.8)) }; };

// =====================================================================
//  입력
// =====================================================================
canvas.addEventListener('pointerdown', e => {
  if (!S || S.over) return;
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;

  if (py > L.sTop && py < L.sTop + L.sH) {
    const i = Math.floor((px - L.sx0) / L.sw);
    if (i >= S.slotCount && i < MAX_SLOTS) { useSlotBooster(); return; }
  }

  const gx = (px - L.bx) / L.cs, gy = (py - L.by) / L.cs;
  let hit = null;
  for (const v of S.vehicles) {
    if (v.state !== 'parked') continue;
    const a = axes(v.ang), dx = gx - v.cx, dy = gy - v.cy;
    if (Math.abs(dx * a.ux + dy * a.uy) <= v.l / 2 + 0.08 && Math.abs(dx * a.vx + dy * a.vy) <= v.w / 2 + 0.14) hit = v;
  }
  if (hit) tapVehicle(hit);
});

function tapVehicle(v) {
  if (S.liftMode) {
    const si = freeSlot();
    if (si < 0) { toast('빈 자리가 없어요!'); return; }
    S.liftMode = false;
    S.boost.lift--;
    launch(v, si, true);
    updateUI();
    return;
  }

  const blockers = parkedBlockers(v);
  if (blockers.length) {
    // 막힌 버스: 부딪히는 곳까지 갔다가 돌아오기
    const a = axes(v.ang), front = v.cx * a.ux + v.cy * a.uy + v.l / 2;
    let d = Infinity;
    for (const o of blockers) d = Math.min(d, proj(o.body, a.ux, a.uy)[0] - front);
    d = Math.max(0, d);
    v.bump = { d, t: 0, T: 0.22 + d * 0.05 };
    sfx('block');
    return;
  }

  const si = freeSlot();
  if (si < 0) { v.shake = 0.35; toast('대기 칸이 꽉 찼어요!'); sfx('block'); return; }
  launch(v, si, false);
}

function launch(v, si, lifted) {
  S.slots[si] = v;
  v.slot = si;
  v.bump = null;
  if (lifted) {
    v.hidden = false;
    v.lifted = true;
    v.state = 'toSlot';
    v.t = 0;
    v.from = { x: L.bx + v.cx * L.cs, y: L.by + v.cy * L.cs, a: v.ang, w: v.w * L.cs, l: v.l * L.cs };
  } else {
    v.state = 'exiting';
    v.off = 0;
    // 버스 꼬리가 주차장 밖으로 나갈 때까지의 거리
    const a = axes(v.ang);
    const rx = v.cx - a.ux * v.l / 2, ry = v.cy - a.uy * v.l / 2;
    let t = Infinity;
    if (a.ux > 1e-6) t = Math.min(t, (S.cols - rx) / a.ux);
    if (a.ux < -1e-6) t = Math.min(t, -rx / a.ux);
    if (a.uy > 1e-6) t = Math.min(t, (S.rows - ry) / a.uy);
    if (a.uy < -1e-6) t = Math.min(t, -ry / a.uy);
    v.exitDist = t + v.w * 0.5 + 0.1;
  }
  revealCheck(false);
  sfx('go');
}

function useSlotBooster() {
  if (S.boost.slot <= 0 || S.slotCount >= MAX_SLOTS) {
    toast(S.slotCount >= MAX_SLOTS ? '더 이상 늘릴 수 없어요' : '자리 추가를 이미 썼어요');
    return false;
  }
  S.boost.slot--;
  S.slotCount++;
  sfx('depart');
  updateUI();
  return true;
}

$('slotBtn').onclick = () => { if (S && !S.over) useSlotBooster(); };
$('liftBtn').onclick = () => {
  if (!S || S.over || S.boost.lift <= 0) return;
  S.liftMode = !S.liftMode;
  if (S.liftMode) toast('꺼낼 버스를 아무거나 눌러 주세요', 2000);
  updateUI();
};
$('restartBtn').onclick = () => startLevel(S.level);
$('homeBtn').onclick = () => showMenu();
$('settingsBtn').onclick = $('settingsBtn2').onclick = () => showSettings();
document.querySelectorAll('.settingsBtn').forEach(b => b.innerHTML = GEAR_SVG);
// 화면의 모든 버튼에 "톡" 피아노 소리
document.addEventListener('click', e => { if (e.target.closest('button')) sfx('click'); }, true);
// 브라우저는 사용자가 한 번 터치해야 소리를 낼 수 있어서, 첫 터치 때 배경음악을 시작해요
document.addEventListener('pointerdown', () => startBgm(), { once: true });
window.addEventListener('resize', () => { if (S) layout(); else renderMap(); });

// =====================================================================
//  매 프레임 업데이트
// =====================================================================
function update(dt) {
  if (!S) return;
  S.time += dt;

  for (const v of S.vehicles) {
    if (v.pop < 1) v.pop = Math.min(1, v.pop + dt * 4);
    if (v.shake > 0) v.shake -= dt;

    if (v.state === 'parked' && v.bump) {
      const b = v.bump;
      b.t += dt;
      if (b.t >= b.T) { v.bump = null; v.off = 0; }
      else {
        const u = b.t / b.T, peak = b.d + 0.15;
        v.off = u < 0.45 ? peak * easeOut(u / 0.45) : peak * (1 - easeIn((u - 0.45) / 0.55));
      }
    } else if (v.state === 'exiting') {
      v.off += dt * 22;
      if (v.off >= v.exitDist) {
        const a = axes(v.ang);
        v.from = {
          x: L.bx + (v.cx + a.ux * v.off) * L.cs, y: L.by + (v.cy + a.uy * v.off) * L.cs,
          a: v.ang, w: v.w * L.cs, l: v.l * L.cs,
        };
        v.state = 'toSlot';
        v.t = 0;
      }
    } else if (v.state === 'toSlot') {
      v.t += dt / (v.lifted ? 0.55 : 0.32);
      if (v.t >= 1) { v.t = 1; v.state = 'slot'; }
    } else if (v.state === 'slot') {
      if (v.filled >= v.cap && v.incoming === 0) { v.state = 'departing'; v.t = 0; sfx('depart'); }
    } else if (v.state === 'departing') {
      v.t += dt / 0.5;
      if (v.t >= 1) { S.slots[v.slot] = null; v.state = 'gone'; checkWin(); }
    }
  }

  // 원이 빙글빙글 돌고, 빈자리가 입구를 지나가면 기다리던 승객이 들어갑니다
  S.ringOff = (S.ringOff + dt * L.pr * 3.2) % L.ring.total;
  for (let k = 0; k < S.ring.length; k++) {
    if (!S.ring[k] && S.waiting.length && ringS(k) < L.ringSp * 0.7) S.ring[k] = S.waiting.shift();
  }

  // 승객 태우기: 원 위에 있는 승객은 누구든 같은 색 버스에 탈 수 있어요
  S.boardTimer -= dt;
  if (S.boardTimer <= 0) {
    let pick = null;
    S.ring.forEach((p, k) => {
      if (!p || p.x === undefined) return;
      const v = bestVehicleFor(p.color);
      if (v && (!pick || p.y > pick.p.y)) pick = { k, p, v };  // 버스에 가까운(아래쪽) 승객부터
    });
    if (pick) {
      const { k, p, v } = pick;
      S.ring[k] = null;
      v.incoming++;
      S.flying.push({ color: p.color, kind: p.kind, x0: p.x, y0: p.y, t: 0, v });
      S.boardTimer = 0.08;
      sfx('board', v.filled + v.incoming);
      updateUI();
    }
  }

  let landed = false;
  for (const f of S.flying) {
    f.t += dt / 0.24;
    if (f.t >= 1) { f.v.filled++; f.v.incoming--; landed = true; }
  }
  S.flying = S.flying.filter(f => f.t < 1);
  if (landed) updateUI();

  // 승객들이 자기 자리로 걸어가기
  const k = Math.min(1, dt * 10);
  const walkTo = (p, t) => {
    if (p.x === undefined) { p.x = t.x; p.y = t.y; }
    const dx = t.x - p.x, dy = t.y - p.y;
    p.x += dx * k; p.y += dy * k;
    p.walking = Math.abs(dx) + Math.abs(dy) > 1.5;
  };
  S.ring.forEach((p, i) => { if (p) walkTo(p, pathPoint(L.ring, ringS(i))); });
  S.waiting.forEach((p, i) => {
    if (i < L.waitMax) walkTo(p, pathPoint(L.wait, (i + 1) * L.sp));
    else p.x = undefined;
  });

  checkLose();
}

function checkWin() {
  if (S.over) return;
  if (remainingCount() === 0 && S.vehicles.every(v => v.state === 'gone')) {
    S.over = true;
    if (S.level + 1 > unlocked) { unlocked = S.level + 1; store.set('busGame.unlocked', unlocked); }
    sfx('win');
    setTimeout(() => showOverlay('win'), 350);
  }
}

function checkLose() {
  if (S.over || S.flying.length || !remainingCount()) return;
  if (S.vehicles.some(v => ['exiting', 'toSlot', 'departing'].includes(v.state))) return;
  if (S.vehicles.some(v => v.state === 'slot' && v.filled >= v.cap)) return;
  for (let i = 0; i < S.slotCount; i++) if (!S.slots[i]) return;
  // 원에 빈자리가 있고 기다리는 승객이 있으면 아직 채워지는 중
  if (S.waiting.length && S.ring.some(p => !p)) return;
  // 원 위의 누군가가 탈 수 있으면 아직 진행 중
  if (S.ring.some(p => p && bestVehicleFor(p.color))) return;
  S.over = true;
  sfx('lose');
  setTimeout(() => showOverlay('lose'), 400);
}

// =====================================================================
//  그리기
// =====================================================================
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

function drawVehicle(x, y, a, w, l, colorIdx, hidden, o = {}) {
  const C = hidden ? HIDDEN_COLOR : COLORS[colorIdx];
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  if (o.scale) ctx.scale(o.scale, o.scale);
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;

  const lw = Math.max(1, w * 0.05), R = w * 0.3;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  // 땅에 드리운 옅은 그림자
  ctx.fillStyle = 'rgba(70,50,30,.16)';
  rr(-w / 2 + 1.5, -l / 2 + 2.5, w, l, R); ctx.fill();

  // 차체: 무광, 양옆이 살짝 어두워 둥근 부피감 + 얇은 갈색 테두리
  const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  g.addColorStop(0, C.d); g.addColorStop(0.24, C.c); g.addColorStop(0.76, C.c); g.addColorStop(1, C.d);
  ctx.fillStyle = g;
  rr(-w / 2, -l / 2, w, l, R); ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = lw; ctx.stroke();

  // 옛날 시골버스 같은 투톤 지붕
  ctx.fillStyle = 'rgba(250,240,222,.3)';
  rr(-w * 0.31, -l / 2 + w * 0.46, w * 0.62, l - w * 0.9, w * 0.14); ctx.fill();
  ctx.strokeStyle = 'rgba(58,44,32,.4)'; ctx.lineWidth = lw * 0.7; ctx.stroke();

  // 옆 창문 (위에서 보면 가장자리에 줄지어 보여요)
  const span = l - w * 0.95, n = Math.max(1, Math.floor(span / (w * 0.34))), step = span / n;
  ctx.fillStyle = 'rgba(120,140,146,.85)';
  for (let i = 0; i < n; i++) {
    const yy = -l / 2 + w * 0.5 + step * (i + 0.15);
    for (const s of [-1, 1]) { rr(s * w * 0.43 - w * 0.04, yy, w * 0.08, step * 0.7, 1); ctx.fill(); }
  }
  // 앞유리 / 뒷유리
  ctx.fillStyle = '#7f9195';
  rr(-w * 0.36, -l / 2 + w * 0.1, w * 0.72, w * 0.24, w * 0.07); ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = lw * 0.75; ctx.stroke();
  ctx.fillStyle = '#8d9ea1';
  rr(-w * 0.3, l / 2 - w * 0.27, w * 0.6, w * 0.13, w * 0.05); ctx.fill(); ctx.stroke();

  if (hidden) {
    ctx.rotate(-a);
    ctx.font = `700 ${w * 0.62}px MaruBuri, serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = LINE; ctx.lineWidth = lw * 1.4; ctx.strokeText('?', 0, 1);
    ctx.fillStyle = '#f6ecd8'; ctx.fillText('?', 0, 1);
  } else if (o.arrow) {
    // 크림색 화살표 + 얇은 테두리
    const s = Math.min(l * 0.22, w * 0.7), hw = w * 0.25, sw = w * 0.075, hb = -s + w * 0.2;
    ctx.beginPath();
    ctx.moveTo(0, -s - w * 0.12); ctx.lineTo(hw, hb); ctx.lineTo(sw, hb); ctx.lineTo(sw, s);
    ctx.lineTo(-sw, s); ctx.lineTo(-sw, hb); ctx.lineTo(-hw, hb); ctx.closePath();
    ctx.fillStyle = '#fbf3e2'; ctx.fill();
    ctx.strokeStyle = LINE; ctx.lineWidth = lw * 0.8; ctx.stroke();
  } else if (o.seats) {
    const { filled, cap } = o.seats;
    const rowsN = cap / 2;
    const top = -l / 2 + w * 0.55, bottom = l / 2 - w * 0.45;
    const gap = (bottom - top) / Math.max(1, rowsN - 1);
    const r = Math.min(w * 0.13, gap * 0.38);
    for (let i = 0; i < cap; i++) {
      ctx.beginPath(); ctx.arc((i % 2 === 0 ? -1 : 1) * w * 0.2, top + Math.floor(i / 2) * gap, r, 0, Math.PI * 2);
      if (i < filled) { ctx.fillStyle = '#fbf3e2'; ctx.fill(); ctx.strokeStyle = LINE; ctx.lineWidth = lw * 0.6; ctx.stroke(); }
      else { ctx.fillStyle = 'rgba(58,44,32,.2)'; ctx.fill(); }
    }
  }
  ctx.restore();
}

function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }

// 색 섞기 (밝은 털색 / 그늘진 털색 만들기)
function mixHex(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const lightOf = C => C.l || (C.l = mixHex(C.c, '#fff8ec', 0.4));
const shadeOf = C => C.s || (C.s = mixHex(C.c, C.d, 0.55));

// 고양이 / 강아지 승객 (발 위치 기준)
function drawAnimal(x, y, r, colorIdx, kind, bob = 0, phase = 0) {
  const C = COLORS[colorIdx], LT = lightOf(C), SH = shadeOf(C);
  const lw = Math.max(0.75, r * 0.1);
  const line = (w = lw) => { ctx.strokeStyle = LINE; ctx.lineWidth = w; ctx.stroke(); };
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.fillStyle = 'rgba(70,50,30,.2)';
  ell(x, y + r * 0.45, r * 0.8, r * 0.3);
  y -= bob;

  // 꼬리 (몸 뒤에 그려요)
  const tt = performance.now() / 1000 + phase;
  if (kind === 'cat') {
    // 고양이: 길고 살랑살랑 흔들리는 꼬리 (테두리 → 털색 순서로 두 번 그어요)
    const sw = Math.sin(tt * 2.6);
    const tx = x + r * (1.25 + sw * 0.15), ty = y - r * (0.85 + sw * 0.1);
    ctx.beginPath();
    ctx.moveTo(x + r * 0.35, y - r * 0.05);
    ctx.bezierCurveTo(x + r * 1.15, y + r * 0.1, x + r * (1.35 + sw * 0.25), y - r * 0.35, tx, ty);
    ctx.strokeStyle = LINE; ctx.lineWidth = r * 0.3 + lw * 2; ctx.stroke();
    ctx.strokeStyle = C.c; ctx.lineWidth = r * 0.3; ctx.stroke();
  } else {
    // 강아지: 짧고 복슬복슬, 신나서 붕붕 흔드는 꼬리
    const wag = Math.sin(tt * 14) * 0.35;
    ctx.save();
    ctx.translate(x + r * 0.42, y - r * 0.15);
    ctx.rotate(-0.55 + wag);
    ctx.beginPath(); ctx.ellipse(r * 0.38, 0, r * 0.4, r * 0.21, 0, 0, Math.PI * 2);
    ctx.fillStyle = C.c; ctx.fill(); line();
    ctx.restore();
  }

  // 작고 통통한 몸 (위는 밝고 아래는 살짝 어둡게) + 크림색 배 + 발
  const bg = ctx.createLinearGradient(0, y - r * 0.55, 0, y + r * 0.45);
  bg.addColorStop(0, LT); bg.addColorStop(0.5, C.c); bg.addColorStop(1, SH);
  rr(x - r * 0.52, y - r * 0.55, r * 1.04, r * 1.0, r * 0.48);
  ctx.fillStyle = bg; ctx.fill(); line();
  ctx.fillStyle = 'rgba(253,245,230,.75)'; ell(x, y - r * 0.02, r * 0.22, r * 0.25);
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(x + s * r * 0.25, y + r * 0.42, r * 0.17, r * 0.11, 0, 0, Math.PI * 2);
    ctx.fillStyle = C.c; ctx.fill(); line(lw * 0.8);
  }

  // 큰 머리
  const hx = x, hy = y - r * 1.2, hr = r * 1.02;
  // 고양이: 뾰족한 귀 (머리 뒤에)
  if (kind === 'cat') {
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(hx + s * hr * 0.95, hy - hr * 0.1); ctx.lineTo(hx + s * hr * 0.75, hy - hr * 1.22); ctx.lineTo(hx + s * hr * 0.12, hy - hr * 0.75);
      ctx.closePath(); ctx.fillStyle = C.c; ctx.fill(); line();
      ctx.fillStyle = '#efb5bf';
      ctx.beginPath();
      ctx.moveTo(hx + s * hr * 0.78, hy - hr * 0.38); ctx.lineTo(hx + s * hr * 0.7, hy - hr * 0.95); ctx.lineTo(hx + s * hr * 0.38, hy - hr * 0.72);
      ctx.closePath(); ctx.fill();
    }
  }
  // 머리: 왼쪽 위에서 햇빛이 드는 듯 부드러운 음영
  const hg = ctx.createRadialGradient(hx - hr * 0.35, hy - hr * 0.42, hr * 0.1, hx, hy, hr * 1.05);
  hg.addColorStop(0, LT); hg.addColorStop(0.65, C.c); hg.addColorStop(1, SH);
  ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2);
  ctx.fillStyle = hg; ctx.fill(); line();
  // 정수리 털 한 가닥
  ctx.beginPath();
  ctx.moveTo(hx - hr * 0.08, hy - hr * 0.97);
  ctx.quadraticCurveTo(hx + hr * 0.02, hy - hr * 1.2, hx + hr * 0.2, hy - hr * 1.06);
  line(lw * 0.85);

  if (kind === 'dog') {
    // 강아지: 늘어진 귀 + 크림색 주둥이 + 코
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(hx + s * hr * 0.9, hy + hr * 0.08, hr * 0.3, hr * 0.6, -s * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = SH; ctx.fill(); line();
    }
    ctx.beginPath(); ctx.ellipse(hx, hy + hr * 0.36, hr * 0.42, hr * 0.28, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fbf1de'; ctx.fill(); line(lw * 0.6);
    ctx.fillStyle = '#3a2c20'; ell(hx, hy + hr * 0.22, hr * 0.16, hr * 0.11);
  } else {
    // 고양이: 분홍 코 + 수염
    ctx.fillStyle = 'rgba(253,245,230,.85)'; ell(hx, hy + hr * 0.32, hr * 0.36, hr * 0.22);
    ctx.fillStyle = '#d98490'; ell(hx, hy + hr * 0.2, hr * 0.12, hr * 0.08);
    if (r >= 7) {
      ctx.strokeStyle = 'rgba(60,40,30,.55)'; ctx.lineWidth = 0.8;
      ctx.beginPath();
      for (const s of [-1, 1]) {
        ctx.moveTo(hx + s * hr * 0.32, hy + hr * 0.3); ctx.lineTo(hx + s * hr * 1.0, hy + hr * 0.2);
        ctx.moveTo(hx + s * hr * 0.32, hy + hr * 0.36); ctx.lineTo(hx + s * hr * 1.0, hy + hr * 0.46);
      }
      ctx.stroke();
    }
  }
  // 발그레한 볼 (부드러운 분홍 + 진한 가운데 + 작은 빗금)
  for (const s of [-1, 1]) {
    const bx = hx + s * hr * 0.56, by = hy + hr * 0.2;
    ctx.fillStyle = 'rgba(255,130,160,.35)'; ell(bx, by, hr * 0.24, hr * 0.16);
    ctx.fillStyle = 'rgba(255,95,135,.6)'; ell(bx, by, hr * 0.15, hr * 0.1);
    if (r >= 7) {
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(bx - hr * 0.08, by + hr * 0.04); ctx.lineTo(bx - hr * 0.02, by - hr * 0.04);
      ctx.moveTo(bx + hr * 0.02, by + hr * 0.04); ctx.lineTo(bx + hr * 0.08, by - hr * 0.04);
      ctx.stroke();
    }
  }
  // 동글동글한 눈 + 작은 빛
  ctx.fillStyle = '#2e231a';
  ell(hx - hr * 0.34, hy - hr * 0.05, hr * 0.14, hr * 0.17); ell(hx + hr * 0.34, hy - hr * 0.05, hr * 0.14, hr * 0.17);
  ctx.fillStyle = 'rgba(255,250,240,.9)';
  circle(hx - hr * 0.38, hy - hr * 0.11, hr * 0.05); circle(hx + hr * 0.3, hy - hr * 0.11, hr * 0.05);
}

function vehiclePose(v) {
  if (v.state === 'parked' || v.state === 'exiting') {
    const a = axes(v.ang);
    const shake = v.shake > 0 ? Math.sin(v.shake * 60) * 3 : 0;
    const pop = v.pop < 1 ? 1 + Math.sin(v.pop * Math.PI) * 0.15 : 1;
    return {
      x: L.bx + (v.cx + a.ux * v.off) * L.cs + shake, y: L.by + (v.cy + a.uy * v.off) * L.cs,
      a: v.ang, w: v.w * L.cs, l: v.l * L.cs, scale: pop,
    };
  }
  const p = slotPos(v.slot), s = slotSize(v);
  if (v.state === 'toSlot') {
    const e = easeInOut(v.t), f = v.from;
    const lift = v.lifted ? 1 + Math.sin(v.t * Math.PI) * 0.3 : 1;
    return {
      x: lerp(f.x, p.x, e), y: lerp(f.y, p.y, e), a: f.a + normAng(-f.a) * e,
      w: lerp(f.w, s.w, e), l: lerp(f.l, s.l, e), scale: lift,
    };
  }
  if (v.state === 'departing') return { x: p.x, y: p.y - easeIn(v.t) * L.sH * 1.3, a: 0, w: s.w, l: s.l, alpha: 1 - v.t };
  return { x: p.x, y: p.y, a: 0, w: s.w, l: s.l };
}

function drawQueueArea() {
  // 풀밭
  const g = ctx.createLinearGradient(0, L.qTop, 0, L.qTop + L.qH);
  g.addColorStop(0, '#d3e7b3'); g.addColorStop(1, '#b4d593');
  ctx.fillStyle = g;
  rr(8, L.qTop, L.W - 16, L.qH, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(58,44,32,.55)'; ctx.lineWidth = 1.2; ctx.stroke();
  for (const [x, y, k] of L.tufts) {
    if (k < 0.75) {
      ctx.strokeStyle = '#93bb77'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x - 3, y + 3); ctx.lineTo(x - 1, y - 3); ctx.moveTo(x, y + 3); ctx.lineTo(x + 2, y - 4); ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + 5, y - 2); ctx.stroke();
    } else {
      ctx.fillStyle = k < 0.88 ? '#fff6c8' : '#ffc4d6'; circle(x, y, 2.4);
    }
  }

  // 대기 줄 길 + 원형 길 (흙길 + 하얀 울타리)
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  L.wait.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.strokeStyle = 'rgba(58,44,32,.6)'; ctx.lineWidth = L.laneW + 2.4; ctx.stroke();
  ctx.strokeStyle = '#ead6b0'; ctx.lineWidth = L.laneW; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(L.rcx, L.rcy, L.rx, L.ry, 0, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(58,44,32,.6)'; ctx.lineWidth = L.laneW + 2.4; ctx.stroke();
  ctx.strokeStyle = '#ecd9b4'; ctx.lineWidth = L.laneW; ctx.stroke();

  // 원 가운데 잔디 섬 + 큰 나무 + 꽃
  const irx = L.rx - L.laneW / 2 - 4, iry = L.ry - L.laneW / 2 - 4;
  ctx.fillStyle = '#c2dea0'; ell(L.rcx, L.rcy, irx, iry);
  ctx.strokeStyle = 'rgba(58,44,32,.35)'; ctx.lineWidth = 1; ctx.stroke();
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2 + 0.3;
    ctx.fillStyle = i % 3 === 0 ? '#ffc4d6' : i % 3 === 1 ? '#fff6c8' : '#ffffff';
    circle(L.rcx + Math.cos(a) * irx * 0.78, L.rcy + Math.sin(a) * iry * 0.7, 2.4);
  }
  const tr = Math.min(iry * 0.62, irx * 0.4);
  ctx.fillStyle = '#9a7556'; rr(L.rcx - tr * 0.13, L.rcy - tr * 0.1, tr * 0.26, tr * 0.75, 3); ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1;
  for (const [dx, dy, rr2, col] of [[-0.55, -0.05, 0.5, '#6f9658'], [0.55, -0.02, 0.48, '#6a9254'], [0, -0.4, 0.68, '#81a868']]) {
    ctx.beginPath(); ctx.arc(L.rcx + tr * dx, L.rcy + tr * dy, tr * rr2, 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(165,200,135,.75)'; circle(L.rcx - tr * 0.2, L.rcy - tr * 0.62, tr * 0.24);

  // 정류장 표지판
  const sx = L.rcx + irx * 0.62, sy = L.rcy + iry * 0.55;
  ctx.fillStyle = '#9a8f84'; ctx.fillRect(sx - 1.5, sy - 26, 3, 26);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#df8a78'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(sx, sy - 30, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#8dbbe0'; rr(sx - 5, sy - 33.5, 10, 7, 2); ctx.fill();

  // 도는 방향 화살표
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const a of [0.8, 2.4, 3.95, 5.5]) {
    const px = L.rcx + Math.cos(a) * L.rx, py = L.rcy + Math.sin(a) * L.ry;
    const ang = Math.atan2(L.ry * Math.cos(a), -L.rx * Math.sin(a));
    ctx.save(); ctx.translate(px, py); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-3, -3.5); ctx.lineTo(-3, 3.5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 고양이 / 강아지들 (위쪽부터 그려서 아래쪽 친구가 앞에 보이도록)
  const vis = [];
  const add = (p, i) => {
    if (!p || p.x === undefined) return;
    vis.push({ x: p.x, y: p.y, c: p.color, kind: p.kind, ph: i * 0.73, bob: p.walking ? Math.abs(Math.sin(S.time * 14 + i)) * 2 : 0 });
  };
  S.ring.forEach(add);
  S.waiting.forEach((p, i) => add(p, i + 100));
  vis.sort((a, b) => a.y - b.y);
  for (const p of vis) drawAnimal(p.x, p.y + L.pr * 0.3, L.pr, p.c, p.kind, p.bob, p.ph);

  const hiddenN = S.waiting.length - Math.min(S.waiting.length, L.waitMax);
  if (hiddenN > 0) {
    const t = `+${hiddenN}`;
    ctx.font = '700 14px MaruBuri, serif';
    const tw = ctx.measureText(t).width + 14;
    ctx.fillStyle = 'rgba(59,50,38,.85)';
    rr(L.W - 16 - tw, L.qTop + 6, tw, 22, 11); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t, L.W - 16 - tw / 2, L.qTop + 17);
  }
}

function draw() {
  ctx.clearRect(0, 0, L.W || 0, L.H || 0);
  if (!S || !L.ring) return;

  drawQueueArea();

  // 정류장 대기 칸 (도로)
  ctx.fillStyle = '#a08f7d';
  rr(8, L.sTop - 4, L.W - 16, L.sH + 8, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(58,44,32,.6)'; ctx.lineWidth = 1.2; ctx.stroke();
  for (let i = 0; i < MAX_SLOTS; i++) {
    const p = slotPos(i), w = L.sw * 0.86, h = L.sH * 0.94;
    if (i < S.slotCount) {
      ctx.fillStyle = '#b5a592';
      rr(p.x - w / 2, p.y - h / 2, w, h, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(58,44,32,.55)'; ctx.lineWidth = 1.2;
      rr(p.x - w / 2, p.y - h / 2, w, h, 10); ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(58,44,32,.4)'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]);
      rr(p.x - w / 2, p.y - h / 2, w, h, 10); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = S.boost.slot > 0 ? '#d6efb6' : 'rgba(255,255,255,.3)';
      ctx.font = `700 ${L.sw * 0.5}px MaruBuri, serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('+', p.x, p.y + 1);
    }
  }

  // 주차장
  const pad = L.cs * 0.2;
  ctx.fillStyle = S.liftMode ? '#f6dc95' : '#d9ccb4';
  rr(L.bx - pad, L.by - pad, L.cs * S.cols + pad * 2, L.cs * S.rows + pad * 2, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(58,44,32,.6)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = 'rgba(120,95,65,.22)';
  for (let i = 1; i < S.cols; i++) for (let j = 1; j < S.rows; j++) circle(L.bx + i * L.cs, L.by + j * L.cs, 1.5);

  const order = { parked: 0, slot: 1, departing: 1, exiting: 2, toSlot: 2 };
  const list = S.vehicles.filter(v => v.state in order).sort((a, b) => order[a.state] - order[b.state]);
  for (const v of list) {
    const P = vehiclePose(v);
    const inSlot = v.state === 'slot' || v.state === 'departing';
    drawVehicle(P.x, P.y, P.a, P.w, P.l, v.color, v.hidden, {
      arrow: !inSlot, seats: inSlot ? { filled: v.filled, cap: v.cap } : null, alpha: P.alpha, scale: P.scale,
    });
  }

  for (const f of S.flying) {
    const p = slotPos(f.v.slot), e = easeIn(f.t);
    drawAnimal(lerp(f.x0, p.x, e), lerp(f.y0, p.y, e) - Math.sin(f.t * Math.PI) * 18, L.pr * (1 - f.t * 0.4), f.color, f.kind);
  }
}

function renderMap() {
  const scroll = $('mapScroll'), inner = $('mapInner');
  const W = scroll.clientWidth;
  if (!W) return;
  const N = Math.max(30, unlocked + 10), SP = 104;
  const H = N * SP + 90;
  inner.style.height = H + 'px';
  const amp = Math.min(W * 0.28, 130);
  const pts = [];
  for (let i = 0; i < N; i++) pts.push({ x: W / 2 + Math.sin(i * 1.05) * amp, y: H - 60 - i * SP });

  // 구불구불한 시골길 (부드러운 곡선)
  let d = `M ${pts[0].x} ${H + 20} L ${pts[0].x} ${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C ${p1.x + (p2.x - p0.x) / 6} ${p1.y + (p2.y - p0.y) / 6}, ${p2.x - (p3.x - p1.x) / 6} ${p2.y - (p3.y - p1.y) / 6}, ${p2.x} ${p2.y}`;
  }
  let deco = '';
  for (let i = 0; i < N; i += 2) {
    const tx = pts[i].x > W / 2 ? 36 + (i % 4) * 6 : W - 36 - (i % 4) * 6, ty = pts[i].y - 30;
    deco += `<g transform="translate(${tx} ${ty})" stroke="#4a3b2c" stroke-width="1" stroke-opacity=".75">
      <ellipse cx="0" cy="25" rx="16" ry="4" fill="#5f8a4a" opacity=".3" stroke="none"/>
      <rect x="-3.5" y="6" width="7" height="18" rx="2" fill="#8f6a4d"/>
      <circle cx="9" cy="7" r="11" fill="#6a9254"/><circle cx="-9" cy="8" r="11" fill="#78a160"/><circle cx="0" cy="-1" r="16" fill="#81a868"/>
      <circle cx="-5" cy="-6" r="6" fill="#9dc17f" stroke="none" opacity=".8"/></g>`;
  }
  const svg = $('mapRoad');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  // 흙길: 얇은 갈색 테두리 + 바퀴 자국
  svg.innerHTML = `${deco}
    <path d="${d}" fill="none" stroke="#4a3b2c" stroke-opacity=".6" stroke-width="30" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#ead6b0" stroke-width="27.5" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#d6bf96" stroke-width="12" stroke-linecap="round" opacity=".55"/>
    <path d="${d}" fill="none" stroke="#ead6b0" stroke-width="7" stroke-linecap="round"/>`;

  inner.querySelectorAll('.node').forEach(n => n.remove());
  pts.forEach((p, i) => {
    const n = i + 1;
    const b = document.createElement('button');
    b.className = 'node ' + (n < unlocked ? 'done' : n === unlocked ? 'current' : 'locked');
    b.style.left = p.x + 'px';
    b.style.top = p.y + 'px';
    b.innerHTML = n > unlocked ? LOCK_SVG : `${n}<small>${'★'.repeat(TIERS[levelTier(n)].stars)}</small>`;
    if (n === unlocked) b.innerHTML += BUS_SVG;
    b.onclick = () => n <= unlocked ? showLevelPopup(n) : toast('앞 단계를 먼저 깨 주세요');
    inner.appendChild(b);
  });

  const cur = pts[Math.min(unlocked, N) - 1];
  scroll.scrollTop = cur.y - scroll.clientHeight * 0.6;
}

// =====================================================================
//  소리: 피아노 음색을 브라우저에서 직접 합성합니다 (음악 파일 없음)
// =====================================================================
let AC = null, sfxBus = null, bgmBus = null;
function audio() {
  if (AC) return AC;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  // 잔향: 작은 나무 방에서 치는 피아노 느낌
  const len = Math.floor(AC.sampleRate * 2.4);
  const ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
  }
  const verb = AC.createConvolver(); verb.buffer = ir;
  const wet = AC.createGain(); wet.gain.value = 0.3;
  verb.connect(wet).connect(AC.destination);
  sfxBus = AC.createGain(); bgmBus = AC.createGain();
  sfxBus.gain.value = 0; bgmBus.gain.value = 0;
  for (const b of [sfxBus, bgmBus]) { b.connect(AC.destination); b.connect(verb); }
  applyVolumes();
  return AC;
}
function applyVolumes() {
  if (!AC) return;
  const t = AC.currentTime;
  sfxBus.gain.setTargetAtTime(settings.sfxOn ? settings.sfxVol * 0.9 : 0, t, 0.03);
  bgmBus.gain.setTargetAtTime(settings.bgmOn ? settings.bgmVol * 0.55 : 0, t, 0.15);
}
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend(); else AC.resume();
});

// 피아노 한 음: 배음 몇 개 + 빠른 타건 + 천천히 사라지는 울림
function piano(m, t, dur, vel, bus) {
  const f = 440 * Math.pow(2, (m - 69) / 12);
  const out = AC.createGain();
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(Math.min(9000, f * 8), t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(500, f * 2.2), t + 0.9);
  out.connect(lp).connect(bus);
  const end = t + Math.max(0.45, Math.min(dur + 0.6, clamp(3.4 - (m - 48) * 0.045, 0.8, 3.6)));
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(vel, t + 0.008);
  out.gain.exponentialRampToValueAtTime(vel * 0.35, t + 0.35);
  out.gain.exponentialRampToValueAtTime(0.0001, end);
  for (const [h, amp, det] of [[1, 1, 0], [2, 0.45, 2], [3, 0.2, -3], [4, 0.08, 4]]) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = f * h; o.detune.value = det; g.gain.value = amp;
    o.connect(g).connect(out);
    o.start(t); o.stop(end + 0.05);
  }
}

// 효과음: "뿅뿅" 느낌을 피아노로
const PENTA = [72, 74, 76, 79, 81, 84, 86, 88];   // 탈 때마다 한 음씩 올라가요
function sfx(kind, arg = 0) {
  if (!settings.sfxOn || !audio()) return;
  if (AC.state === 'suspended') AC.resume();
  const t = AC.currentTime + 0.01, B = sfxBus;
  switch (kind) {
    case 'click':  piano(84, t, 0.12, 0.09, B); break;                                        // 톡
    case 'go':     piano(79, t, 0.1, 0.12, B); piano(86, t + 0.07, 0.25, 0.12, B); break;    // 뿅!
    case 'block':  piano(50, t, 0.2, 0.17, B); piano(49, t + 0.06, 0.25, 0.1, B); break;     // 쿵
    case 'board':  piano(PENTA[arg % PENTA.length], t, 0.12, 0.07, B); break;                 // 폴짝
    case 'depart': [72, 76, 79, 84].forEach((m, i) => piano(m, t + i * 0.07, 0.35, 0.1, B)); break;
    case 'win':    [65, 69, 72, 77, 81, 84].forEach((m, i) => piano(m, t + i * 0.11, 0.9, 0.11, B)); break;
    case 'lose':   [69, 65, 62, 57].forEach((m, i) => piano(m, t + i * 0.18, 0.9, 0.09, B)); break;
  }
}

// 배경음악: 시골의 푸근한 오후 같은 잔잔한 피아노 (F장조, 16마디 반복)
//   마디마다 [왼손 아르페지오 음 5개(낮은→높은), 오른손 멜로디 [시작 박, 길이(박), 음]]
const BPM = 66, BEAT = 60 / BPM;
const SONG = [
  [[41, 48, 53, 57, 60], [[0, 1.5, 69], [1.5, 0.5, 72], [2, 2, 77]]],              // F
  [[40, 48, 52, 55, 60], [[0, 1.5, 76], [1.5, 0.5, 74], [2, 2, 72]]],              // C/E
  [[38, 45, 50, 53, 57], [[0, 1, 74], [1, 1, 77], [2, 1.5, 81], [3.5, 0.5, 79]]],  // Dm
  [[45, 52, 57, 60, 64], [[0, 3, 76]]],                                            // Am
  [[46, 53, 58, 62, 65], [[0, 1.5, 74], [1.5, 0.5, 72], [2, 1, 70], [3, 1, 74]]],  // Bb
  [[45, 48, 53, 57, 60], [[0, 1.5, 72], [1.5, 0.5, 69], [2, 2, 65]]],              // F/A
  [[43, 50, 53, 58, 62], [[0, 1, 67], [1, 1, 70], [2, 1, 74], [3, 1, 77]]],        // Gm7
  [[36, 43, 48, 52, 55], [[0, 2, 76], [2, 2, 72]]],                                // C
  [[41, 48, 53, 57, 60], [[0, 1.5, 77], [1.5, 0.5, 76], [2, 1, 72], [3, 1, 69]]],  // F
  [[45, 52, 57, 60, 64], [[0, 1.5, 72], [1.5, 0.5, 76], [2, 2, 81]]],              // Am
  [[46, 53, 58, 62, 65], [[0, 1, 79], [1, 1, 77], [2, 2, 74]]],                    // Bb
  [[41, 48, 53, 57, 60], [[0, 1, 72], [1, 1, 69], [2, 2, 72]]],                    // F
  [[43, 50, 55, 58, 62], [[0, 1, 70], [1, 1, 74], [2, 1.5, 79], [3.5, 0.5, 77]]],  // Gm
  [[45, 52, 57, 60, 64], [[0, 1.5, 76], [1.5, 0.5, 72], [2, 2, 69]]],              // Am
  [[46, 53, 58, 62, 65], [[0, 1, 74], [1, 1, 72], [2, 1, 70], [3, 1, 67]]],        // Bb
  [[36, 43, 48, 53, 55], [[0, 2, 72], [2, 2, 67]]],                                // Csus4
];
let bgmTimer = null, bgmNext = 0, bgmBar = 0;
const hum = () => (Math.random() - 0.5) * 0.014;     // 사람이 치는 듯한 미세한 흔들림
const vary = () => 0.85 + Math.random() * 0.3;
function scheduleBgm() {
  if (bgmNext < AC.currentTime) bgmNext = AC.currentTime + 0.1;
  while (bgmNext < AC.currentTime + 1.2) {
    const [arp, mel] = SONG[bgmBar % SONG.length], t0 = bgmNext;
    const high = Math.floor(bgmBar / SONG.length) % 2 === 1;   // 두 번째 반복은 한 옥타브 위 오르골 느낌
    [0, 1, 2, 3, 4, 3, 2, 1].forEach((k, i) =>
      piano(arp[k], t0 + i * BEAT / 2 + hum(), BEAT * 0.9, (i === 0 ? 0.06 : 0.032) * vary(), bgmBus));
    mel.forEach(([s, d, m]) =>
      piano(m + (high ? 12 : 0), t0 + s * BEAT + hum(), d * BEAT, (high ? 0.05 : 0.075) * vary(), bgmBus));
    bgmNext += 4 * BEAT;
    bgmBar++;
  }
}
function startBgm() {
  if (!settings.bgmOn || bgmTimer || !audio()) return;
  if (AC.state === 'suspended') AC.resume();
  bgmNext = AC.currentTime + 0.3;
  applyVolumes();
  scheduleBgm();
  bgmTimer = setInterval(scheduleBgm, 300);
}
function stopBgm() {
  clearInterval(bgmTimer);
  bgmTimer = null;
  applyVolumes();
}

// =====================================================================
//  시작!
// =====================================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// 메인 화면에 날리는 민들레 홀씨
for (let i = 0; i < 16; i++) {
  const f = document.createElement('div');
  f.className = 'fluff';
  f.style.left = (Math.random() * 90) + '%';
  f.style.top = (35 + Math.random() * 60) + '%';
  const s = 4 + Math.random() * 5;
  f.style.width = f.style.height = s + 'px';
  f.style.animationDuration = (9 + Math.random() * 9) + 's';
  f.style.animationDelay = (-Math.random() * 18) + 's';
  $('sky').appendChild(f);
}
// 주소 뒤에 ?level=10 처럼 붙이면 그 단계로 바로 이동 (테스트용)
const urlLevel = parseInt(new URLSearchParams(location.search).get('level'), 10);
if (urlLevel > 0) startLevel(urlLevel);
else showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
