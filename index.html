<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>멍냥이의 버스여행</title>
<style>
  /* 마루 부리 (네이버, OFL - 상업적 사용 가능) */
  @font-face { font-family: 'MaruBuri'; font-weight: 200; font-display: swap; src: url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-ExtraLight.woff2) format('woff2'); }
  @font-face { font-family: 'MaruBuri'; font-weight: 300; font-display: swap; src: url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Light.woff2) format('woff2'); }
  @font-face { font-family: 'MaruBuri'; font-weight: 400; font-display: swap; src: url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2) format('woff2'); }
  @font-face { font-family: 'MaruBuri'; font-weight: 600; font-display: swap; src: url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-SemiBold.woff2) format('woff2'); }
  @font-face { font-family: 'MaruBuri'; font-weight: 700; font-display: swap; src: url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Bold.woff2) format('woff2'); }

  :root {
    --ink: #4a3b2c;
    --muted: #8a7660;
    --accent: #eb9a68;
    --accent-dark: #c47548;
    --green: #93b97b;
    --green-dark: #6f945a;
    --cream: #fff8ec;
    --locked: #cdbfae;
    --line: #a8a097;     /* 얇은 회색 테두리 (1px) */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden; user-select: none; color: var(--ink);
    background: #f3e6cf;
    font-family: 'MaruBuri', "Apple SD Gothic Neo", "Malgun Gothic", serif;
    font-weight: 600;
  }
  button { font-family: inherit; }
  #app { position: relative; height: 100%; max-width: 560px; margin: 0 auto; overflow: hidden; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .screen.hidden { display: none; }

  /* ---------------- 메인 화면 ---------------- */
  #menu .scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #menu img.scene { object-fit: cover; object-position: center; }
  img { pointer-events: none; -webkit-user-drag: none; user-select: none; }
  /* 꾹 눌러도 복사/저장 메뉴가 뜨지 않게 (닉네임 입력칸만 예외) */
  * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  input { -webkit-user-select: text; user-select: text; font-size: 16px; }
  /* 두 번 톡톡 눌러도 화면이 확대되지 않게 */
  html, body, button, canvas, #app { touch-action: manipulation; }
  ::selection { background: transparent; }
  #menu .sky { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  /* 흘러가는 뭉게구름 */
  .cloud { position: absolute; left: -260px; animation: drift linear infinite; }
  @keyframes drift { from { left: -280px; } to { left: 105%; } }
  /* 계절 입자: 벚꽃잎 / 나뭇잎 / 단풍 / 눈 */
  .fx { position: absolute; inset: 0; z-index: 3; overflow: hidden; pointer-events: none; }
  .particle { position: absolute; top: -30px; animation: fall linear infinite; }
  .particle > * { display: block; animation: sway ease-in-out infinite alternate; }
  @keyframes fall { to { transform: translateY(calc(100vh + 60px)); } }
  @keyframes sway { from { transform: translateX(-18px) rotate(-35deg); } to { transform: translateX(18px) rotate(45deg); } }
  /* 눈송이: 하얀 눈밭 위에서도 보이도록 아주 옅은 푸른 테두리 */
  .snow { border-radius: 50%; background: #fff; opacity: .95;
    box-shadow: 0 0 0 .6px rgba(140, 160, 185, .55), 0 0 4px rgba(255, 255, 255, .9); }
  /* 설정 창의 계절 고르기 */
  .seasonPick { display: flex; gap: 4px; flex-wrap: nowrap; justify-content: center; margin: 6px 0 4px; }
  .seasonPick button {
    height: 30px; padding: 0 7px; border-radius: 15px; font-size: 12px; cursor: pointer; white-space: nowrap; flex: none;
    background: rgba(255, 250, 240, .85); color: var(--ink); border: 1px solid var(--line);
  }
  .seasonPick button.on { background: #f6dd92; color: var(--ink); }
  .hello {
    position: absolute; top: 14px; left: 12px; z-index: 4; white-space: nowrap;
    padding: 6px 14px; border-radius: 16px; font-size: 13px; background: rgba(255, 250, 240, .85); border: 1px solid var(--line);
  }
  .hello:empty, .weather:empty { display: none; }
  .weather {
    position: absolute; top: 52px; left: 12px; z-index: 4; white-space: nowrap;
    padding: 4px 12px; border-radius: 14px; font-size: 12px; color: var(--muted);
    background: rgba(255, 250, 240, .75); border: 1px solid var(--line);
  }
  .hearts {
    position: absolute; top: 14px; right: 62px; z-index: 4; display: flex; align-items: center; gap: 5px; white-space: nowrap;
    height: 32px; padding: 0 11px 0 8px; border-radius: 16px; font-size: 13px;
    background: rgba(255, 250, 240, .9); border: 1px solid var(--line);
  }
  .hearts small { color: var(--muted); font-size: 11px; }
  /* 날씨: 비 */
  .rain { width: 1.2px; height: 16px; background: linear-gradient(rgba(170, 190, 210, 0), rgba(150, 175, 200, .85)); }
  .particle.rainy { animation-timing-function: linear; }
  .particle.rainy > * { animation: none; transform: rotate(12deg); }
  /* 시간대에 따라 들판을 살짝 물들이는 막 (밤엔 푸르스름, 노을엔 주황빛) */
  .tint { position: absolute; inset: 0; z-index: 1; pointer-events: none; transition: background 2s; }
  /* 단계 지도는 지평선 아래 들판에서만 보여요 */
  #menu > #mapScroll {
    position: absolute; left: 0; right: 0; top: 26%; bottom: 0; overflow-y: auto; scrollbar-width: none; z-index: 2;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 60px);
    mask-image: linear-gradient(to bottom, transparent 0, #000 60px);
  }
  .nickInput {
    width: 100%; padding: 12px 14px; margin-top: 4px; border-radius: 12px; font: inherit; font-size: 16px; text-align: center;
    background: #fffdf7; color: var(--ink); border: 1px solid var(--line); outline: none;
  }
  .nickInput:focus { border-color: #e2bf5c; }
  #mapScroll::-webkit-scrollbar { display: none; }
  #mapInner { position: relative; width: 100%; }
  #mapRoad { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  /* 단계 원: 얇은 갈색 테두리, 차분한 색 */
  .node {
    position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    border: 1px solid var(--line); color: #fffaf1; font-size: 22px; line-height: 1; cursor: pointer;
    box-shadow: 0 3px 6px rgba(70, 50, 30, .18);
  }
  .node small { display: block; font-size: 9px; letter-spacing: 1px; margin-top: 3px; color: rgba(255, 250, 241, .9); }
  .node.done { background: #c3dd96; color: var(--ink); }   /* 깬 단계: 노란 버튼과 어울리는 연두 */
  .node.done small { color: #6f8f45; }
  .node.current { background: #f6dd92; color: var(--ink); animation: breathe 2.4s ease-in-out infinite; }
  .node.locked { background: #d8ccb9; cursor: pointer; box-shadow: 0 2px 4px rgba(70, 50, 30, .1); }
  .node.locked svg { display: block; margin: 0 auto; }
  .node .busIcon {
    position: absolute; left: 50%; top: -34px; width: 40px; transform: translateX(-50%);
    animation: bob 1.6s ease-in-out infinite; pointer-events: none;
  }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes bob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -4px); } }
  #menu > #settingsBtn { position: absolute; top: 10px; right: 12px; z-index: 4; }

  /* ---------------- 게임 화면 ---------------- */
  #game { background: linear-gradient(#cfe0dc, #f2e7d0 40%, #eee0c4); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 4px; }
  .hbtns { display: flex; gap: 8px; }
  .round {
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
    background: var(--cream); color: var(--ink); font-size: 20px;
    border: 1px solid var(--line); box-shadow: 0 2px 5px rgba(70, 50, 30, .15);
  }
  .round:active { transform: translateY(1px); box-shadow: none; }
  #title { text-align: center; }
  #levelLabel { font-size: 22px; }
  #leftLabel { font-size: 13px; color: var(--muted); }
  #stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  footer { display: flex; gap: 12px; justify-content: center; padding: 8px 14px 16px; }
  .booster {
    position: relative; flex: 1; max-width: 160px; height: 52px; border-radius: 14px; cursor: pointer;
    background: var(--cream); color: var(--ink); font-size: 16px;
    border: 1px solid var(--line); box-shadow: 0 2px 5px rgba(70, 50, 30, .15);
  }
  .booster:active { transform: translateY(1px); box-shadow: none; }
  .booster:disabled { opacity: .45; cursor: default; }
  .booster.active { background: #f3dc9c; }
  .booster .cnt {
    position: absolute; top: -9px; right: -7px; min-width: 22px; height: 22px; padding: 0 5px;
    border-radius: 11px; background: #8fae78; color: #fffaf1; font-size: 12px; line-height: 19px;
    border: 1px solid var(--line);
  }

  /* 설정 / 단계 팝업 */
  .setRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 4px; font-size: 14px; }
  .setRow input[type=range] { flex: 1; accent-color: #b98a64; }
  .switch { position: relative; width: 46px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span {
    position: absolute; inset: 0; border-radius: 13px; background: #d8ccb9; border: 1px solid var(--line);
    transition: background .2s; cursor: pointer;
  }
  .switch span::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%;
    background: var(--cream); border: 1px solid var(--line); transition: transform .2s;
  }
  .switch input:checked + span { background: #8fae78; }
  .switch input:checked + span::after { transform: translateX(19px); }
  .stars { font-size: 21px; letter-spacing: 2px; color: #e9bf4f; margin: 2px 0 6px; }
  .stars .off { color: #dccfbc; }

  #toast {
    position: absolute; left: 50%; top: 68px; transform: translateX(-50%);
    background: rgba(74, 59, 44, .92); color: #fffaf1; padding: 10px 16px; border-radius: 12px;
    font-size: 16px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 6;
  }
  #toast.show { opacity: 1; }

  #overlay {
    position: absolute; inset: 0; background: rgba(40, 34, 25, .5); z-index: 5;
    display: none; align-items: center; justify-content: center;
  }
  #overlay.show { display: flex; }
  .card {
    position: relative;
    background: var(--cream); border-radius: 20px; padding: 18px 18px 16px; text-align: center; width: min(82%, 310px);
    border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(60, 40, 20, .25);
  }
  /* 팝업 상자 위에 걸터앉은 고양이·강아지 그림판 */
  .card canvas.perch {
    position: absolute; inset: auto; left: 50%; top: -112px; transform: translateX(-50%);
    width: 300px; height: 125px; pointer-events: none;
  }
  .card small { font-size: 11px; color: var(--muted); }
  .heartNow { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink); margin-top: 4px; }
  .heartNow svg { width: 15px; height: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .card h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  #levelLabel, .btn, .node { font-weight: 700; }
  .card p { margin-bottom: 8px; color: var(--muted); line-height: 1.45; font-size: 13px; }
  .btn {
    display: block; width: 100%; padding: 10px; margin-top: 8px; border-radius: 12px; cursor: pointer;
    font-size: 15px; background: #f6dd92; color: var(--ink);
    border: 1px solid var(--line); box-shadow: 0 2px 5px rgba(70, 50, 30, .15);
  }
  .btn:active { transform: translateY(1px); box-shadow: none; }
  .btn.alt { background: #f1e5cf; color: var(--ink); }
</style>
</head>
<body>
<div id="app">

  <!-- ================= 메인 화면 ================= -->
  <section class="screen" id="menu">
    <!-- 계절 풍경 (자바스크립트가 그려요) -->
    <svg class="scene" id="skyLayer" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <img class="scene" id="land" alt="" draggable="false">
    <svg class="scene" id="busLive" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="pointer-events:none"></svg>
    <div class="sky" id="sky"></div>
    <div class="tint" id="tint"></div>
    <div id="mapScroll"><div id="mapInner"><img id="mapRoad" alt="" draggable="false"></div></div>
    <div class="fx" id="fx"></div>

    <div class="hello" id="hello"></div>
    <div class="weather" id="weather"></div>
    <div class="hearts" id="hearts"></div>
    <button class="round settingsBtn" id="settingsBtn" title="설정"></button>
  </section>

  <!-- ================= 게임 화면 ================= -->
  <section class="screen hidden" id="game">
    <header>
      <button class="round" id="homeBtn" title="지도로">⌂</button>
      <div id="title">
        <div id="levelLabel">1단계</div>
        <div id="leftLabel">남은 승객 0명</div>
      </div>
      <div class="hbtns">
        <button class="round settingsBtn" id="settingsBtn2" title="설정"></button>
      </div>
    </header>
    <div id="stage"><canvas id="cv"></canvas></div>
    <footer>
      <button class="booster" id="slotBtn">+ 자리 추가<span class="cnt" id="slotCnt">1</span></button>
      <button class="booster" id="liftBtn">크레인<span class="cnt" id="liftCnt">1</span></button>
    </footer>
  </section>

  <div id="toast"></div>
  <div id="overlay"><div class="card" id="card"></div></div>
  <canvas id="confetti" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7"></canvas>
</div>

<script>
// =====================================================================
//  기본 설정
// =====================================================================
// 따뜻한 파스텔 팔레트 (c = 밝은 색, d = 그림자 색)
const COLORS = [
  { c: '#ec8c7e', d: '#c2675b' }, // 토마토 (빨강)
  { c: '#8dbbe0', d: '#6290b8' }, // 여름 하늘 (파랑)
  { c: '#a3cf8c', d: '#73a25f' }, // 새싹 (초록)
  { c: '#f4d27c', d: '#cba54e' }, // 버터 (노랑)
  { c: '#bda6dc', d: '#8f78b2' }, // 라벤더 (보라)
  { c: '#f5ae74', d: '#cc844c' }, // 살구 (주황)
  { c: '#f3a9c1', d: '#c97e98' }, // 복숭아 (분홍)
  { c: '#92d3c6', d: '#5fa699' }, // 박하 (민트)
  { c: '#c19674', d: '#8f6a4d' }, // 코코아 (갈색)
];
const HIDDEN_COLOR = { c: '#776b7d', d: '#524857' };
const LINE = 'rgba(96,90,84,.85)';     // 인게임 그림 테두리: 1px, 조금 진한 회색
const MAX_SLOTS = 7;    // 대기 칸 최대
const BASE_SLOTS = 4;   // 처음 열린 대기 칸
const BODY_W = 0.74;    // 버스 폭 (칸 단위)
const GAP = 0.03;       // 버스 사이 최소 간격의 절반

const canvas = document.getElementById('cv');
let ctx = canvas.getContext('2d');      // (작은 그림 이미지를 만들 때 잠깐 다른 그림판으로 바꿔 써요)
let LW_SCALE = 1;                         // 테두리 굵기 배율 (크게 그린 뒤 줄여 쓸 때 보정)
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);

// 얇은 갈색 선으로 그린 아이콘들
const GEAR_SVG = `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="#4a3b2c" stroke-width="1.6" stroke-linecap="round">
  <circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="6.8"/>
  <path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.4 5.4l1.8 1.8M16.8 16.8l1.8 1.8M5.4 18.6l1.8-1.8M16.8 7.2l1.8-1.8"/></g></svg>`;
const LOCK_SVG = `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g stroke="#4a3b2c" stroke-width="1.5" stroke-linejoin="round">
  <path d="M8 11V8.2a4 4 0 0 1 8 0V11" fill="none"/><rect x="5.5" y="11" width="13" height="9" rx="2" fill="#f1e5cf"/>
  <circle cx="12" cy="15.3" r="1.2" fill="#4a3b2c" stroke="none"/></g></svg>`;
// 현재 단계 위에 떠 있는 버스: 메인 화면 길가의 시내버스와 같은 그림체 (회색 1px 선)
const BUS_SVG = `<svg class="busIcon" viewBox="0 0 42 28" aria-hidden="true"><g stroke="#a8a097" stroke-width="1" stroke-linejoin="round">
  <path d="M3 8 Q3 3 9 3 H34 Q39 3 39 8 V21 H3 Z" fill="#f6f5f1"/>
  <path d="M3.5 7 Q4 3.5 9 3.5 H22 L17 8 H3.5Z" fill="#8cbfdd" stroke="none" opacity=".85"/>
  <path d="M12 18 L39 16.5 L39 19 L11 20Z" fill="#8cbfdd" stroke="none" opacity=".7"/>
  <path d="M3.5 9 H8 V17 L3.5 17.5Z" fill="#6f7c86"/>
  <rect x="11" y="8.5" width="6" height="6" rx=".8" fill="#5f6b74"/><rect x="18.5" y="8.5" width="6" height="6" rx=".8" fill="#5f6b74"/>
  <rect x="26" y="8.5" width="6" height="6" rx=".8" fill="#5f6b74"/><rect x="33.5" y="8.5" width="4.5" height="6" rx=".8" fill="#5f6b74"/>
  <circle cx="11" cy="22" r="3.4" fill="#4b4642"/><circle cx="32" cy="22" r="3.4" fill="#4b4642"/>
  <circle cx="11" cy="22" r="1.4" fill="#cfcbc4" stroke="none"/><circle cx="32" cy="22" r="1.4" fill="#cfcbc4" stroke="none"/></g></svg>`;

// 저장 (브라우저에 진행 상황 기억)
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let unlocked = Math.max(store.get('busGame.unlocked', 1), store.get('busGameLevel', 1));
// 소리 설정 (설정 창에서 바꿈)
const settings = Object.assign({ bgmOn: true, bgmVol: 0.6, sfxOn: true, sfxVol: 0.8 }, store.get('busGame.settings', {}));
const saveSettings = () => store.set('busGame.settings', settings);

let S = null;  // 게임 상태 (메인 화면에서는 null)
const L = {};  // 게임 화면 배치 정보

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const normAng = a => { while (a > Math.PI) a -= Math.PI * 2; while (a <= -Math.PI) a += Math.PI * 2; return a; };

// =====================================================================
//  도형 계산 (버스 = 회전된 직사각형)
//  ang = 버스가 바라보는 방향. 0 = 위, 90도 = 오른쪽, 45도 = 오른쪽 위 ...
// =====================================================================
function axes(ang) {
  return { ux: Math.sin(ang), uy: -Math.cos(ang), vx: Math.cos(ang), vy: Math.sin(ang) };
}
function makeBox(cx, cy, ang, hl, hw) { return { cx, cy, hl, hw, ...axes(ang) }; }
function bodyBox(v, inflate = 0) { return makeBox(v.cx, v.cy, v.ang, v.l / 2 + inflate, v.w / 2 + inflate); }
// 버스가 앞으로 쭉 나갈 때 쓸고 지나가는 영역
function sweepBox(v) {
  const F = 40, a = axes(v.ang);
  return makeBox(v.cx + a.ux * F / 2, v.cy + a.uy * F / 2, v.ang, v.l / 2 + F / 2, v.w / 2 - 0.02);
}
function proj(b, ax, ay) {
  const c = b.cx * ax + b.cy * ay;
  const r = b.hl * Math.abs(b.ux * ax + b.uy * ay) + b.hw * Math.abs(b.vx * ax + b.vy * ay);
  return [c - r, c + r];
}
// 두 직사각형이 겹치는지 (분리축 정리)
function overlap(A, B) {
  const dx = A.cx - B.cx, dy = A.cy - B.cy;
  const rs = Math.hypot(A.hl, A.hw) + Math.hypot(B.hl, B.hw);
  if (dx * dx + dy * dy > rs * rs) return false;
  for (const [ax, ay] of [[A.ux, A.uy], [A.vx, A.vy], [B.ux, B.uy], [B.vx, B.vy]]) {
    const pa = proj(A, ax, ay), pb = proj(B, ax, ay);
    if (pa[1] <= pb[0] + 1e-6 || pb[1] <= pa[0] + 1e-6) return false;
  }
  return true;
}
function insideBoard(v, cols, rows) {
  const b = bodyBox(v);
  for (const s of [1, -1]) for (const t of [1, -1]) {
    const x = b.cx + b.ux * b.hl * s + b.vx * b.hw * t;
    const y = b.cy + b.uy * b.hl * s + b.vy * b.hw * t;
    if (x < 0.04 || y < 0.04 || x > cols - 0.04 || y > rows - 0.04) return false;
  }
  return true;
}

// =====================================================================
//  단계(레벨) 만들기
//  1) 주차장을 버스로 빽빽하게 채웁니다 (가로/세로/대각선).
//  2) "지금 앞이 뚫린 버스"를 하나씩 골라 방향을 정하고 빼냅니다.
//     → 이 순서대로 빼면 반드시 풀리므로, 모든 단계는 풀 수 있습니다.
// =====================================================================
// 난이도 주기: 10단계마다 [쉬움 → 어려움 → 매우 어려움]이 반복되고, 10번째 단계가 가장 어려워요.
//   1:쉬움 2:어려움 3:매우 어려움 4:쉬움 5:어려움 6:매우 어려움 7:쉬움 8:어려움 9:매우 어려움 10:최고 난이도
// 10단계 묶음이 넘어갈 때마다 전체 난이도가 조금씩 올라갑니다.
const TIERS = {
  1: { stars: 1, name: '쉬움' },
  3: { stars: 3, name: '어려움' },
  4: { stars: 4, name: '매우 어려움' },
  5: { stars: 5, name: '최고 난이도' },
};
function levelTier(n) {
  const pos = (n - 1) % 10 + 1;
  if (pos === 10) return 5;
  return [1, 3, 4][(pos - 1) % 3];
}
// 실제로 버스 수, 색 수 등을 정할 때 쓰는 "체감 난이도" 값
function effectiveLevel(n) {
  const block = Math.floor((n - 1) / 10);
  return (levelTier(n) - 1) * 4 + 1 + block * 5;
}

function levelParams(n) {
  const e = effectiveLevel(n);
  return {
    cols: Math.min(6 + Math.floor((e - 1) / 4), 9),
    rows: Math.min(8 + Math.floor((e - 1) / 3), 11),
    colorCount: Math.min(3 + Math.floor((e - 1) / 2), COLORS.length),
    diagChance: Math.min(0.1 + e * 0.025, 0.35),
    hiddenChance: e >= 4 ? Math.min(0.08 + e * 0.02, 0.3) : 0,
    mix: Math.min(30 + e * 9, 200),  // 승객 순서가 섞이는 정도 (좌석이 많아진 만큼 크게)
    target: e,
  };
}

function genLevel(n) {
  const rng = mulberry32(n * 7919 + 13);
  const P = levelParams(n);
  const { cols, rows } = P;
  const target = Math.min(17 + 3 * (P.target - 1), Math.floor(cols * rows / 2));

  // 1) 빽빽하게 배치
  const placed = [];
  for (let tries = 0; tries < 25000 && placed.length < target; tries++) {
    // 버스 4종류: 2칸(8석) / 3칸(16석) / 4칸(24석) / 5칸(32석)
    const rl = rng();
    let len = rl < 0.4 ? 2 : rl < 0.74 ? 3 : rl < 0.92 ? 4 : 5;
    if (len > Math.min(cols, rows) - 1) len = 3;
    let base, cx, cy;
    if (rng() < P.diagChance && len <= 3) {
      base = rng() < 0.5 ? Math.PI / 4 : Math.PI * 3 / 4;
      cx = Math.round(rng() * cols * 2) / 2;
      cy = Math.round(rng() * rows * 2) / 2;
    } else if (rng() < 0.5) {
      base = 0;
      cx = Math.floor(rng() * cols) + 0.5;
      cy = Math.floor(rng() * (rows - len + 1)) + len / 2;
    } else {
      base = Math.PI / 2;
      cx = Math.floor(rng() * (cols - len + 1)) + len / 2;
      cy = Math.floor(rng() * rows) + 0.5;
    }
    const v = { cx, cy, ang: base, len, l: len - 0.14, w: BODY_W };
    if (!insideBoard(v, cols, rows)) continue;
    v.pack = bodyBox(v, GAP);
    if (placed.some(o => overlap(v.pack, o.pack))) continue;
    v.body = bodyBox(v);
    placed.push(v);
  }

  // 2) 빼낼 수 있는 순서와 방향 정하기
  let remaining = placed.slice();
  const order = [];
  while (remaining.length) {
    const cands = [];
    for (const v of remaining) {
      for (const flip of [0, Math.PI]) {
        const sw = sweepBox({ ...v, ang: v.ang + flip });
        if (!remaining.some(o => o !== v && overlap(sw, o.body))) cands.push([v, v.ang + flip]);
      }
    }
    if (!cands.length) {  // 꽉 막혀 아무도 못 나가면 버스 하나를 없앱니다
      remaining.splice(Math.floor(rng() * remaining.length), 1);
      continue;
    }
    const [v, ang] = cands[Math.floor(rng() * cands.length)];
    v.ang = normAng(ang);
    order.push(v);
    remaining = remaining.filter(o => o !== v);
  }

  // 색 / 정원 / 미스터리
  const idx = COLORS.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  const palette = idx.slice(0, P.colorCount);
  order.forEach((v, i) => {
    v.color = palette[i < P.colorCount ? i : Math.floor(rng() * P.colorCount)];
    v.cap = (v.len - 1) * 8;          // 8 / 16 / 24 / 32석
    v.hidden = rng() < P.hiddenChance;
  });

  // 승객 줄: 빼낼 순서대로 만든 뒤 단계가 오를수록 더 섞기
  const q = [];
  let k = 0;
  for (const v of order) for (let j = 0; j < v.cap; j++) q.push({ color: v.color, key: k++ });
  q.forEach(p => p.key += rng() * P.mix);
  q.sort((a, b) => a.key - b.key);

  return {
    cols, rows, vehicles: order,
    queue: q.map((p, i) => ({
      id: i, color: p.color, kind: rng() < 0.5 ? 'cat' : 'dog', bag: rng() < 0.16,
      ribbon: rng() < 0.15 ? ['#e8768e', '#7fb4d6', '#f2c35a', '#b9a2d8'][Math.floor(rng() * 4)] : null,
    })),
  };
}

// =====================================================================
//  게임 시작
// =====================================================================
function startLevel(n) {
  const g = genLevel(n);
  // 이 단계 도전 횟수 세기 (클리어하면 "N번의 시도로 성공!")
  const allTries = store.get('busGame.tries', {});
  allTries[n] = (allTries[n] || 0) + 1;
  store.set('busGame.tries', allTries);
  S = {
    level: n, cols: g.cols, rows: g.rows, vehicles: [],
    waiting: g.queue,   // 원 밖에서 줄 서서 기다리는 승객
    ring: [],           // 원 위의 자리들 (승객 또는 빈자리 null)
    ringOff: 0,         // 원이 돌아간 거리
    slots: new Array(MAX_SLOTS).fill(null), slotCount: BASE_SLOTS,
    flying: [], boardTimer: 0.6, boost: { slot: 1, lift: 1 }, liftMode: false, over: false, time: 0,
    tries: allTries[n], rush: 0, treeShake: 0,
  };
  g.vehicles.forEach((v, i) => {
    S.vehicles.push({
      id: i, cx: v.cx, cy: v.cy, ang: v.ang, len: v.len, l: v.l, w: v.w, body: bodyBox(v),
      color: v.color, cap: v.cap, hidden: v.hidden,
      state: 'parked', off: 0, bump: null, shake: 0, filled: 0, incoming: 0, pop: 1, t: 0,
    });
  });
  showScreen('game');
  revealCheck(true);
  layout();
  for (let k = 0; k < S.ring.length; k++) if (S.waiting.length) S.ring[k] = S.waiting.shift();
  hideOverlay();
  updateUI();
}

const parkedBlockers = v => {
  const sw = sweepBox(v);
  return S.vehicles.filter(o => o !== v && o.state === 'parked' && overlap(sw, o.body));
};

function revealCheck(instant) {
  for (const v of S.vehicles) {
    if (v.state === 'parked' && v.hidden && parkedBlockers(v).length === 0) {
      v.hidden = false;
      v.pop = instant ? 1 : 0;
    }
  }
}

function freeSlot() {
  for (let i = 0; i < S.slotCount; i++) if (!S.slots[i]) return i;
  return -1;
}

// =====================================================================
//  게임 화면 배치
// =====================================================================
function layout() {
  const W = stage.clientWidth, H = stage.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  L.W = W; L.H = H;
  const pad = 10;

  // 승객 구역: 빙글빙글 도는 원형 길 + 원에 들어가려고 기다리는 줄
  L.pr = clamp(W / 46, 6, 10);
  L.laneW = L.pr * 2.9;
  L.sp = L.pr * 2.15;
  L.qTop = 2; L.qH = clamp(H * 0.27, 130, 250);
  L.headRoom = L.pr * 2.3;
  L.ry = Math.max(20, (L.qH - L.laneW - L.headRoom - 12) / 2);
  L.rx = Math.min((W - 28) * 0.34, L.ry * 1.2);      // 하트가 옆으로 늘어나지 않게
  L.rcx = 16 + L.laneW / 2 + L.rx + 4;
  L.rcy = L.qTop + L.headRoom + 6 + L.laneW / 2 + L.ry;
  buildRing();
  buildWaitPath();
  L.tufts = [];
  const tr = mulberry32(7);
  for (let i = 0; i < 26; i++) L.tufts.push([14 + tr() * (W - 28), L.qTop + 8 + tr() * (L.qH - 16), tr()]);

  // 하트 왼쪽 아래(출구)에서 정류장으로 내려가는 길은 buildRing()에서 정해요

  // 정류장: 위쪽 보도(걸어가는 길) + 대기 칸 + 아래쪽 찻길(버스가 떠나는 길)
  L.sTop = L.qTop + L.qH + 8;
  L.swH = L.pr * 2.2;                                         // 보도 높이
  L.walkY = L.sTop + L.swH * 0.55;
  L.sH = clamp(H * 0.11, 56, 100);
  L.roadH = L.pr * 2.8;
  L.sw = Math.min((W - 2 * pad) / MAX_SLOTS, L.sH * 0.62);
  L.sx0 = (W - L.sw * MAX_SLOTS) / 2;
  L.roadY = L.sTop + L.swH + L.sH + L.roadH / 2;

  // 주차장
  const bTop = L.sTop + L.swH + L.sH + L.roadH + 12, bH = H - bTop - pad;
  L.bTop = bTop; L.bH = bH;    // 주차장 바탕은 위 패널들과 같은 가로 폭 (8 ~ W-8)
  L.cs = Math.floor(Math.min((W - 2 * pad - 16) / (S.cols + 0.4), (bH - 16) / (S.rows + 0.4)));
  L.bx = (W - L.cs * S.cols) / 2;
  L.by = bTop + (bH - L.cs * S.rows) / 2;

  syncRing();
}

// 점들을 이어 만든 길 (길이를 따라 위치를 구할 수 있게)
function makePath(pts, closed) {
  if (closed) pts = pts.concat([pts[0]]);
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, total: cum[cum.length - 1] };
}
function pathPoint(path, s) {
  const { cum, pts, total } = path;
  if (s <= 0) return { x: pts[0][0], y: pts[0][1] };
  if (s >= total) { const p = pts[pts.length - 1]; return { x: p[0], y: p[1] }; }
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
  const t = (s - cum[lo]) / (cum[hi] - cum[lo] || 1);
  return { x: lerp(pts[lo][0], pts[hi][0], t), y: lerp(pts[lo][1], pts[hi][1], t) };
}

// 하트 모양 길 (가장 오른쪽 점 = 입구에서 시작해 시계 방향으로 돕니다)
function buildRing() {
  const raw = [];
  for (let i = 0; i < 200; i++) {
    const t = i / 200 * Math.PI * 2;
    raw.push([16 * Math.sin(t) ** 3, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]);
  }
  const ys = raw.map(p => p[1]), y0 = Math.min(...ys), y1 = Math.max(...ys);
  let pts = raw.map(([x, y]) => [L.rcx + x / 16 * L.rx, L.rcy + ((y - y0) / (y1 - y0) * 2 - 1) * L.ry]);
  let k = 0;
  pts.forEach((p, i) => { if (p[0] > pts[k][0]) k = i; });
  pts = pts.slice(k).concat(pts.slice(0, k));            // 입구(가장 오른쪽)부터 시작
  L.ring = makePath(pts, true);
  L.ringPts = pts;
  L.ringN = Math.max(8, Math.floor(L.ring.total / (L.sp * 1.05)));
  L.ringSp = L.ring.total / L.ringN;
  // 출구: 하트의 왼쪽 아래 비탈
  let best = -Infinity;
  pts.forEach(([x, y], i) => {
    const sc = -(x - L.rcx) / L.rx + (y - L.rcy) / L.ry;
    if (sc > best) { best = sc; L.exitIdx = i; }
  });
  [L.exitX, L.exitY] = pts[L.exitIdx];
  // 가운데 잔디 섬 (하트를 안쪽으로 줄인 모양)
  const kk = 1 - (L.laneW / 2 + 4) / L.ry, cy = L.rcy + L.ry * 0.05;
  L.islandPts = pts.map(([x, y]) => [L.rcx + (x - L.rcx) * kk, cy + (y - cy) * kk]);
}

// 원 입구(오른쪽)에서 시작해 위아래로 구불구불한 대기 줄
function buildWaitPath() {
  const g = L.laneW + 7, [ex, ey] = L.ring.pts[0];
  const xa = ex + L.laneW / 2 + 6, xb = L.W - 16;
  const C = Math.max(1, Math.floor((xb - xa) / g));
  const yT = L.qTop + L.headRoom + 6 + L.laneW / 2 + g / 2;
  const yB = L.qTop + L.qH - 6 - L.laneW / 2 - g / 2;
  const pts = [[ex, ey]];
  for (let c = 0; c < C; c++) {
    // 마지막 줄이 위로 올라가서, 줄의 시작(집)이 오른쪽 위에 오도록
    const x = xa + g / 2 + c * g, down = (C - 1 - c) % 2 === 1;
    const ys = c === 0 ? ey : (down ? yT : yB), ye = down ? yB : yT;
    const steps = Math.max(2, Math.ceil(Math.abs(ye - ys) / 6));
    for (let i = 0; i <= steps; i++) pts.push([x, lerp(ys, ye, i / steps)]);
    if (c < C - 1) {
      for (let i = 1; i < 14; i++) {
        const a = down ? Math.PI - (i / 14) * Math.PI : Math.PI + (i / 14) * Math.PI;
        pts.push([x + g / 2 + Math.cos(a) * g / 2, ye + Math.sin(a) * g / 2]);
      }
    }
  }
  // 마지막 줄은 패널 위쪽 경계선까지 쭉 이어서, 줄이 밖에서부터 계속 이어지는 것처럼
  const [lx, ly] = pts[pts.length - 1];
  if (ly < L.qTop + L.qH / 2) {
    for (let y = ly - 6; y > L.qTop - 4; y -= 6) pts.push([lx, y]);
    pts.push([lx, L.qTop - 4]);
  }
  L.wait = makePath(pts, false);
  L.waitMax = Math.max(0, Math.floor(L.wait.total / L.sp) - 1);
}

// 화면 크기가 바뀌어 원 위 자리 수가 달라지면 승객을 다시 배치
function syncRing() {
  if (S.ring.length === L.ringN) return;
  const ppl = S.ring.filter(Boolean);
  S.ring = new Array(L.ringN).fill(null);
  ppl.forEach((p, i) => { if (i < L.ringN) S.ring[i] = p; else S.waiting.unshift(p); });
}
const ringS = k => (k * L.ringSp + S.ringOff) % L.ring.total;
const remainingCount = () => S.waiting.length + S.ring.filter(Boolean).length + S.flying.length;

function bestVehicleFor(color) {
  let best = null;
  for (let i = 0; i < S.slotCount; i++) {
    const v = S.slots[i];
    if (v && v.state === 'slot' && v.color === color && v.filled + v.incoming < v.cap) {
      if (!best || v.filled + v.incoming > best.filled + best.incoming) best = v;
    }
  }
  return best;
}

const slotPos = i => ({ x: L.sx0 + L.sw * (i + 0.5), y: L.sTop + L.swH + L.sH / 2 });

// 원 위의 자리 → 원 출구 → 정류장 보도 → 내 버스 문 앞까지 걸어가는 길
//   (잔디 섬을 가로지르지 않고 원형 길을 따라 출구까지 가요)
function walkRoute(p, v, s0) {
  const sp = slotPos(v.slot), top = sp.y - slotSize(v).l / 2;
  const qb = L.qTop + L.qH, T = L.ring.total;
  const sExit = L.ring.cum[L.exitIdx];
  let d = ((sExit - s0) % T + T) % T;            // 앞으로 돌아가는 거리
  const dir = d <= T / 2 ? 1 : -1;               // 더 가까운 쪽으로
  if (dir < 0) d = T - d;
  const pts = [[p.x, p.y]];
  for (let u = 8; u < d; u += 8) { const q = pathPoint(L.ring, ((s0 + dir * u) % T + T) % T); pts.push([q.x, q.y]); }
  pts.push([L.exitX, L.exitY], [L.exitX, qb - 4], [L.exitX, L.walkY], [sp.x, L.walkY], [sp.x, top + 2]);
  return makePath(pts, false);
}
const slotSize = v => { const w = L.sw * 0.72; return { w, l: Math.min(L.sH * 0.9, w * (1.3 + v.len * 0.32)) }; };

// =====================================================================
//  입력
// =====================================================================
canvas.addEventListener('pointerdown', e => {
  if (!S || S.over) return;
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;

  // 가운데 나무를 누르면 빨리감기!
  const iry = L.ry - L.laneW / 2 - 4;
  if (Math.hypot((px - L.rcx) / (iry * 0.9), (py - (L.rcy - iry * 0.1)) / (iry * 0.9)) < 1) {
    S.rush = 3; S.treeShake = 0.6; sfx('click'); return;
  }

  if (py > L.sTop + L.swH && py < L.sTop + L.swH + L.sH) {
    const i = Math.floor((px - L.sx0) / L.sw);
    if (i >= S.slotCount && i < MAX_SLOTS) { useSlotBooster(); return; }
  }

  const gx = (px - L.bx) / L.cs, gy = (py - L.by) / L.cs;
  let hit = null;
  for (const v of S.vehicles) {
    if (v.state !== 'parked') continue;
    const a = axes(v.ang), dx = gx - v.cx, dy = gy - v.cy;
    if (Math.abs(dx * a.ux + dy * a.uy) <= v.l / 2 + 0.08 && Math.abs(dx * a.vx + dy * a.vy) <= v.w / 2 + 0.14) hit = v;
  }
  if (hit) tapVehicle(hit);
});

function tapVehicle(v) {
  if (S.liftMode) {
    const si = freeSlot();
    if (si < 0) { toast('빈 자리가 없어요!'); return; }
    S.liftMode = false;
    S.boost.lift--;
    launch(v, si, true);
    updateUI();
    return;
  }

  const blockers = parkedBlockers(v);
  if (blockers.length) {
    // 막힌 버스: 부딪히는 곳까지 갔다가 돌아오기
    const a = axes(v.ang), front = v.cx * a.ux + v.cy * a.uy + v.l / 2;
    let d = Infinity;
    for (const o of blockers) d = Math.min(d, proj(o.body, a.ux, a.uy)[0] - front);
    d = Math.max(0, d);
    v.bump = { d, t: 0, T: 0.22 + d * 0.05 };
    sfx('block');
    return;
  }

  const si = freeSlot();
  if (si < 0) { v.shake = 0.35; toast('대기 칸이 꽉 찼어요!'); sfx('block'); return; }
  launch(v, si, false);
}

function launch(v, si, lifted) {
  S.slots[si] = v;
  v.slot = si;
  v.bump = null;
  if (lifted) {
    v.hidden = false;
    v.lifted = true;
    v.state = 'toSlot';
    v.t = 0;
    v.from = { x: L.bx + v.cx * L.cs, y: L.by + v.cy * L.cs, a: v.ang, w: v.w * L.cs, l: v.l * L.cs };
  } else {
    v.state = 'exiting';
    v.off = 0;
    // 버스 꼬리가 주차장 밖으로 나갈 때까지의 거리
    const a = axes(v.ang);
    const rx = v.cx - a.ux * v.l / 2, ry = v.cy - a.uy * v.l / 2;
    let t = Infinity;
    if (a.ux > 1e-6) t = Math.min(t, (S.cols - rx) / a.ux);
    if (a.ux < -1e-6) t = Math.min(t, -rx / a.ux);
    if (a.uy > 1e-6) t = Math.min(t, (S.rows - ry) / a.uy);
    if (a.uy < -1e-6) t = Math.min(t, -ry / a.uy);
    v.exitDist = t + v.w * 0.5 + 0.1;
  }
  revealCheck(false);
  sfx('go');
}

function useSlotBooster() {
  if (S.boost.slot <= 0 || S.slotCount >= MAX_SLOTS) {
    toast(S.slotCount >= MAX_SLOTS ? '더 이상 늘릴 수 없어요' : '자리 추가를 이미 썼어요');
    return false;
  }
  S.boost.slot--;
  S.slotCount++;
  sfx('depart');
  updateUI();
  return true;
}

$('slotBtn').onclick = () => { if (S && !S.over) useSlotBooster(); };
$('liftBtn').onclick = () => {
  if (!S || S.over || S.boost.lift <= 0) return;
  S.liftMode = !S.liftMode;
  if (S.liftMode) toast('꺼낼 버스를 아무거나 눌러 주세요', 2000);
  updateUI();
};
$('homeBtn').onclick = () => showMenu();
$('settingsBtn').onclick = $('settingsBtn2').onclick = () => showSettings();
document.querySelectorAll('.settingsBtn').forEach(b => b.innerHTML = GEAR_SVG);
// 꾹 누르기(길게 터치) 메뉴, 페이지 전체가 선택되는 현상, 두 번 탭 확대 막기
document.addEventListener('contextmenu', e => { if (!e.target.closest('input')) e.preventDefault(); });
document.addEventListener('selectstart', e => { if (!e.target.closest || !e.target.closest('input')) e.preventDefault(); });

document.addEventListener('touchend', e => {
