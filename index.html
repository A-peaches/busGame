<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멍냥이의 버스여행</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6dd92; }
  #box { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    font: 16px sans-serif; color: #4a3b2c; text-align: center; padding: 24px; box-sizing: border-box; }
  #box a { padding: 12px 22px; border-radius: 14px; background: #fbf3e2; border: 1px solid #c9b99c; color: #4a3b2c; text-decoration: none; font-weight: 700; }
  #box small { color: #8a7a68; }
</style>
<script>
// ===== 예전 주소 (a-peaches.github.io/busGame) → 새 주소로 이사 =====
// 이 기기에 예전 주소로 저장된 게임 기록을 들고 새 주소로 넘어가요.
//   기록은 주소의 # 뒤에 담아 보내요 (# 뒤는 서버로 전송되지 않고 폰 안에서만 읽혀요).
//   새 주소는 받은 기록을 넣고(이미 기록이 있으면 덮어쓰지 않아요) 주소에서 바로 지워요.
(function () {
  var NEW_HOME = 'https://meowbus.bbhtodo.workers.dev/';
  var data = {};
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('busGame') === 0) data[k] = localStorage.getItem(k);
    }
  } catch (e) { /* 저장소를 못 읽으면 기록 없이 넘어가요 (백업 코드로 불러올 수 있어요) */ }
  // 예전 주소의 게임 알림 연결만 끊어요 (같은 주소의 투두 앱 것은 건드리지 않아요)
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { if (r.scope.indexOf('/busGame/') >= 0) r.unregister(); });
      }).catch(function () {});
    }
  } catch (e2) { /* 무시 */ }
  var url = NEW_HOME;
  try {
    if (Object.keys(data).length) url += '#move=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data)))));
  } catch (e3) { /* 기록 없이 */ }
  setTimeout(function () { location.replace(url); }, 150);
  // 그래도 안 넘어가면 (카카오톡 같은 앱 속 브라우저) 누를 수 있는 버튼
  setTimeout(function () {
    var b = document.getElementById('box'), a = document.getElementById('go');
    if (a) a.href = url;
    if (b) b.style.display = 'flex';
  }, 1200);
})();
</script>
</head>
<body>
<div id="box">
  <div>멍냥이의 버스여행이 새 주소로 이사했어요 🚌</div>
  <a id="go" href="https://meowbus.bbhtodo.workers.dev/">새 주소로 가기</a>
  <small>meowbus.bbhtodo.workers.dev</small>
</div>
</body>
</html>
