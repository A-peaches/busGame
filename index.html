<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>멍냥이의 버스여행</title>
<script>
// ===== 주소 이사 =====
// 게임은 이제 https://meowbus.bbhtodo.workers.dev 에 있어요 (투두 앱과 주소를 나눠서 알림이 섞이지 않게).
// 예전 주소(a-peaches.github.io/busGame)로 오면: 이 기기의 기록을 들고 새 주소로 옮겨 가요.
(function () {
  var NEW_HOME = 'https://meowbus.bbhtodo.workers.dev/';
  try {
    if (location.hostname === 'a-peaches.github.io') {
      var data = {};
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('busGame') === 0) data[k] = localStorage.getItem(k);
      }
      var moved = false;
      var go = function () {
        if (moved) return; moved = true;
        location.replace(NEW_HOME + '#move=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data))))));
      };
      // 예전 주소의 게임 알림 연결만 끊어요 (투두 앱 것은 건드리지 않아요). 기다리지 않고 바로 넘어가요
      //   (카카오톡 같은 앱 속 브라우저는 이걸 기다리다 멈출 수 있어서)
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) { if (r.scope.indexOf('/busGame/') >= 0) r.unregister(); });
          }).catch(function () {});
        }
      } catch (e2) { /* 무시 */ }
      setTimeout(go, 150);
      document.documentElement.style.background = '#f6dd92';
      window.stop();                      // 예전 주소에서는 게임을 불러오지 않아요
      // 그래도 안 넘어가면 누를 수 있는 버튼을 보여 줘요
      setTimeout(function () {
        try {
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font:16px sans-serif;color:#4a3b2c;text-align:center;padding:24px';
          d.innerHTML = '<div>멍냥이의 버스여행이 새 주소로 이사했어요 🚌</div>' +
            '<a href="' + NEW_HOME + '" style="padding:12px 22px;border-radius:14px;background:#fbf3e2;border:1px solid #c9b99c;color:#4a3b2c;text-decoration:none;font-weight:700">새 주소로 가기</a>' +
            '<small style="color:#8a7a68">' + NEW_HOME.replace('https://', '') + '</small>';
          (document.body || document.documentElement).appendChild(d);
        } catch (e3) { /* 무시 */ }
      }, 1200);
      return;
    }
    // 새 주소: 옮겨 온 기록 받기 (이 기기의 새 주소에 아직 기록이 없을 때만)
    if (location.hash.indexOf('#move=') === 0) {
      var d = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(6))))));
      if (!localStorage.getItem('busGame.acct') && !localStorage.getItem('busGame.nickname')) {
        for (var key in d) if (key.indexOf('busGame') === 0) localStorage.setItem(key, d[key]);
      }
      localStorage.removeItem('busGame.push');   // 알림은 새 주소에서 다시 연결해요
      sessionStorage.setItem('meowMoved', '1');   // 예전 주소에서 넘어왔다는 표시 (설정 창 확인용)
      history.replaceState(null, '', location.pathname);
    }
  } catch (e) { /* 이사에 실패해도 게임은 열려요 (백업 코드로 불러올 수 있어요) */ }
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6dd92">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=127">
</head>
<body>
<div id="app">

  <!-- ================= 메인 화면 ================= -->
  <section class="screen" id="menu">
    <!-- 계절 풍경 (자바스크립트가 그려요) -->
    <svg class="scene" id="skyLayer" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <img class="scene" id="land" alt="" draggable="false">
    <canvas class="scene" id="busLive" aria-hidden="true" style="pointer-events:none"></canvas>
    <div class="sky" id="sky"></div>
    <div class="tint" id="tint"></div>
    <div id="mapScroll"><div id="mapInner"><img id="mapRoad" alt="" draggable="false"></div></div>
    <div class="fx" id="fx"></div>

    <div class="hello" id="hello"></div>
    <div class="weather" id="weather"></div>
    <div class="hearts" id="hearts"></div>
    <button class="round settingsBtn" id="settingsBtn" title="설정"></button>
    <button class="round" id="helpBtn" title="설명서"></button>
    <button class="round" id="friendsBtn" title="친구"></button>
    <button class="round" id="mailBtn" title="우편함"></button>
    <button class="round" id="noticeBtn" title="공지사항"></button>
    <button class="round" id="chatBtn" title="전체 채팅"></button>
    <button class="round" id="dailyBtn" title="오늘의 경쟁"></button>
  </section>

  <!-- ================= 게임 화면 ================= -->
  <section class="screen hidden" id="game">
    <header>
      <div class="hbtns left">
        <button class="round" id="homeBtn" title="지도로 이동"></button>
        <button class="round" id="pauseBtn" title="잠깐 쉬기"></button>
      </div>
      <div id="title">
        <div id="tierLabel"></div>
        <div id="levelLabel">1단계</div>
        <div id="leftLabel">남은 승객 0명</div>
      </div>
      <div class="hbtns">
        <button class="round ffBtn" id="ffBtn" title="빨리감기 (4배)"></button>
        <button class="round settingsBtn" id="settingsBtn2" title="설정"></button>
      </div>
    </header>
    <div id="stage"><canvas id="cv"></canvas></div>
    <footer>
      <button class="booster" id="slotBtn" title="자리 추가" aria-label="자리 추가"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><g stroke="#4a3b2c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3" fill="#fbf3e2" stroke-dasharray="2.6 2"/><path d="M12 8.5 V15.5 M8.5 12 H15.5" fill="none" stroke="#8fae78" stroke-width="2"/></g></svg><span class="cnt" id="slotCnt">1</span></button>
      <button class="booster" id="liftBtn" title="크레인" aria-label="크레인"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><g stroke="#4a3b2c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5 V8" fill="none"/><rect x="8.6" y="8" width="6.8" height="3.6" rx="1.2" fill="#f6dd92"/><path d="M9.6 11.6 L6.2 15.6 L8.4 19.6" fill="none" stroke-width="1.8"/><path d="M14.4 11.6 L17.8 15.6 L15.6 19.6" fill="none" stroke-width="1.8"/><path d="M12 11.6 V15" fill="none"/></g></svg><span class="cnt" id="liftCnt">1</span></button>
      <button class="booster" id="mixBtn" title="색 섞기" aria-label="색 섞기" hidden><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><g stroke="#4a3b2c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.5 C6.8 3.5 3.5 7.3 3.5 11.6 C3.5 16 6.8 20.5 11.2 20.5 C13 20.5 13.4 19.2 12.6 18 C11.8 16.8 12.6 15.6 14 15.6 H16.4 C18.8 15.6 20.5 14 20.5 11.4 C20.5 7 16.8 3.5 12 3.5Z" fill="#fbf3e2"/><circle cx="8" cy="11" r="1.6" fill="#e8768e" stroke="none"/><circle cx="10.6" cy="7.4" r="1.6" fill="#f6d76b" stroke="none"/><circle cx="14.8" cy="7.6" r="1.6" fill="#8fc3a4" stroke="none"/><circle cx="17" cy="11.4" r="1.6" fill="#8dbbe0" stroke="none"/></g></svg><span class="cnt" id="mixCnt">1</span></button>
    </footer>
  </section>

  <div id="pauseCover" aria-hidden="true">
    <div class="sleepers">
      <svg class="cushion" viewBox="0 0 240 110" aria-hidden="true">
        <defs>
          <radialGradient id="cushG" cx="50%" cy="30%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f4f0e9"/><stop offset="1" stop-color="#d8d0c3"/></radialGradient>
          <radialGradient id="cushIn" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#fbf9f5"/><stop offset="1" stop-color="#e6dfd3"/></radialGradient>
        </defs>
        <ellipse cx="120" cy="100" rx="104" ry="8" fill="rgba(0,0,0,.35)"/>
        <!-- 도톰한 바깥 테두리 (동그란 방석) -->
        <ellipse cx="120" cy="58" rx="112" ry="46" fill="url(#cushG)" stroke="rgba(150,140,128,.75)" stroke-width="1.2"/>
        <!-- 폭 들어간 가운데 -->
        <ellipse cx="120" cy="54" rx="80" ry="27" fill="url(#cushIn)" stroke="rgba(170,160,146,.55)" stroke-width="1"/>
        <path d="M44 46 Q120 20 196 46" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="3" stroke-linecap="round"/>
        <path d="M30 70 Q120 104 210 70" fill="none" stroke="rgba(190,180,166,.45)" stroke-width="1.2"/>
      </svg>
      <div class="sleeper dog"><img id="sleepDog" alt=""><span class="zz">z</span><span class="zz">z</span><span class="zz">Z</span></div>
      <div class="sleeper cat"><img id="sleepCat" alt=""><span class="zz">z</span><span class="zz">z</span><span class="zz">Z</span></div>
    </div>
    <div class="dozeText">잠깐 조는 중<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
    <div class="dozeHint">화면을 누르면 다시 깨어나요</div>
  </div>
  <div id="rotateNotice" aria-hidden="true">
    <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><g fill="none" stroke="#fbf1de" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="22" y="8" width="20" height="36" rx="4"/><path d="M29 39 H35"/>
      <path d="M12 46 Q14 56 26 56 M26 56 L22 52 M26 56 L22 60"/></g></svg>
    <p>세로로 돌려 주세요</p><small>멍냥이 버스여행은 세로 화면에서 할 수 있어요</small>
  </div>
  <div id="toast"></div>
  <div id="overlay"><div class="card" id="card"></div></div>
  <canvas id="confetti" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7"></canvas>
</div>
