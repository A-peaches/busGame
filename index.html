// 배경 그림 전체 (하늘 → 먼 산 → 숲 → 들판과 풀)
// SVG 글자를 이미지로 바꿔 <img>에 넣어요 (브라우저가 한 번만 그리고 재사용)
function setSvgImage(img, svg) {
  if (img._url) URL.revokeObjectURL(img._url);
  img._url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  img.src = img._url;
}

function renderScene() {
  const P = SEASONS[season], R = mulberry32(2024);
  // 하늘(시간에 따라 바뀌는 부분)은 살아 있는 SVG로, 땅 풍경은 한 번만 그린 이미지로
  $('skyLayer').innerHTML = `<defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop id="sk0" offset="0" stop-color="${P.sky[0]}"/><stop id="sk1" offset=".25" stop-color="${P.sky[1]}"/><stop id="sk2" offset=".4" stop-color="${P.sky[2]}"/></linearGradient>
    <radialGradient id="glowG"><stop offset="0" stop-color="#fff6dc" stop-opacity=".9"/><stop offset=".35" stop-color="#fff0c8" stop-opacity=".35"/><stop offset="1" stop-color="#fff0c8" stop-opacity="0"/></radialGradient>
  </defs><rect width="400" height="800" fill="url(#skyG)"/><g id="celestial"></g>`;
  let s = `<defs>
    <linearGradient id="mtG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.mt[0]}"/><stop offset="1" stop-color="${P.mt[1]}"/></linearGradient>
    <linearGradient id="mdG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.meadow[0]}"/><stop offset=".45" stop-color="${P.meadow[1]}"/><stop offset="1" stop-color="${P.meadow[2]}"/></linearGradient>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .07 0"/></filter>
    <filter id="haze"><feGaussianBlur stdDeviation=".6"/></filter>
    <filter id="wash" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>`;
  // (먼 산은 없애고, 들판 숲 위로 바로 하늘이 보여요)
  const ridge = x => 202 + Math.sin(x / 37) * 6 + Math.sin(x / 13) * 3;   // 지평선 (땅을 위로 넓힘)
  // 숲 아래와 들판 사이 빈틈을 덤불로 꽉 채우기: 물감 번짐 띠 + 자잘한 잎
  let bushTop = `M-6 ${f1(ridge(-6) + 4)}`;
  for (let x = 4; x <= 410; x += 10) bushTop += ` L${x} ${f1(ridge(x) + 4 + Math.sin(x / 7) * 2)}`;
  s += `<path d="${bushTop} L410 244 L-6 244Z" fill="${P.forest[2]}" opacity=".95" filter="url(#wash)"/>`;
  s += `<path d="${bushTop} L410 244 L-6 244Z" fill="${P.forest[0]}" opacity=".55"/>`;
  for (let i = 0; i < 420; i++) {
    const x = R() * 412 - 6, y = ridge(x) + 2 + R() * 30, L = 2.2 + R() * 2.2;
    s += `<path d="M0 0 Q${f1(L / 2)} ${f1(-L * 0.45)} ${f1(L)} 0 Q${f1(L / 2)} ${f1(L * 0.45)} 0 0Z" fill="${pick(R, P.forest)}" opacity=".85" transform="translate(${f1(x)} ${f1(y)}) rotate(${Math.round(R() * 360)})"/>`;
    if (season === 'winter' && R() < 0.3) s += `<ellipse cx="${f1(x)}" cy="${f1(y - 1)}" rx="1.6" ry=".7" fill="#fbfcfd"/>`;
  }
  // 지평선 숲: 앞쪽 나무와 똑같은 수채화 나무를 작게 촘촘히 (먼 줄은 흐릿하게)
  for (const [row, hmin, hmax, step, dy, op] of [[0, 22, 30, 7, 16, 0.65], [1, 28, 40, 9, 28, 0.95]]) {
    let g = `<g opacity="${op}">`;
    for (let x = -12; x < 414; x += step * (0.7 + R() * 0.6)) {
      const th = hmin + R() * (hmax - hmin), y = ridge(x) + dy + R() * 4;
      g += `<g transform="translate(${f1(x)} ${f1(y)})">${makeTree(500 + row * 100 + Math.round(x), th, season, 0.5)}</g>`;
    }
    s += g + '</g>';
  }
  // 들판
  s += `<path d="M0 222 C 80 210 160 230 240 218 C 300 210 360 222 400 216 L400 800 L0 800Z" fill="url(#mdG)"/>`;
  // 숲과 들판의 경계: 들판 위로 잎사귀·덤불을 한 겹 더 덮어 경계선이 안 보이게 자연스럽게 이어요
  const bz = (a, b, c, d, t) => (1 - t) ** 3 * a + 3 * (1 - t) ** 2 * t * b + 3 * (1 - t) * t * t * c + t ** 3 * d;
  const edge = [];
  for (let i = 0; i <= 40; i++) { const t = i / 40; edge.push([bz(0, 80, 160, 240, t), bz(222, 210, 230, 218, t)]); }
  for (let i = 1; i <= 30; i++) { const t = i / 30; edge.push([bz(240, 300, 360, 400, t), bz(218, 210, 222, 216, t)]); }
  const edgeY = x => { for (let i = 1; i < edge.length; i++) if (edge[i][0] >= x) { const [x0, y0] = edge[i - 1], [x1, y1] = edge[i]; return y0 + (y1 - y0) * (x - x0) / (x1 - x0 || 1); } return 216; };
  let fringe = `M-6 ${f1(edgeY(0) - 7)}`;
  for (let x = 4; x <= 410; x += 8) fringe += ` L${x} ${f1(edgeY(Math.min(x, 400)) - 7 + Math.sin(x / 5) * 2.5)}`;
  for (let x = 410; x >= -6; x -= 8) fringe += ` L${x} ${f1(edgeY(clamp(x, 0, 400)) + 7 + Math.sin(x / 6) * 3)}`;
  s += `<path d="${fringe}Z" fill="${P.forest[2]}" opacity=".85" filter="url(#wash)"/>`;
  for (let i = 0; i < 520; i++) {
    const x = R() * 412 - 6, ey = edgeY(clamp(x, 0, 400)), dy = (R() - 0.45) * 18;
    const below = dy > 3;   // 경계 아래쪽은 들판 풀색 잎으로 섞어서 땅으로 스며들게
    const L = 2.2 + R() * 2.4;
    s += `<path d="M0 0 Q${f1(L / 2)} ${f1(-L * 0.45)} ${f1(L)} 0 Q${f1(L / 2)} ${f1(L * 0.45)} 0 0Z" fill="${below ? pick(R, P.grass) : pick(R, P.forest)}" opacity="${below ? '.7' : '.9'}" transform="translate(${f1(x)} ${f1(ey + dy)}) rotate(${Math.round(R() * 360)})"/>`;
    if (season === 'winter' && R() < 0.25) s += `<ellipse cx="${f1(x)}" cy="${f1(ey + dy - 1)}" rx="1.6" ry=".7" fill="#fbfcfd"/>`;
  }
  // 들판 끝자락의 작은 나무들과 양옆의 큰 나무 (모두 땅 위에)
  for (const [x, y, h, sd] of [[34, 244, 46, 1], [372, 240, 52, 2], [120, 234, 30, 3], [262, 232, 28, 4], [200, 300, 40, 5], [330, 320, 36, 6], [372, 560, 62, 7], [70, 700, 58, 8]])
    s += `<g transform="translate(${x} ${y})">${makeTree(sd, h)}</g>`;
  // 풀잎: 멀수록 작고 옅게, 가까울수록 크고 진하게
  let grass = '';
  for (let i = 0; i < 600; i++) {
    const y = 230 + Math.pow(R(), 0.8) * 570, x = R() * 400, k = (y - 220) / 580;
    const hgt = 3 + k * 13 + R() * 4, bend = (R() - 0.5) * hgt * 0.8;
    grass += `<path d="M${f1(x)} ${f1(y)} q${f1(bend * 0.3)} ${f1(-hgt * 0.6)} ${f1(bend)} ${f1(-hgt)}" stroke="${pick(R, P.grass)}" stroke-width="${f1(0.6 + k * 1.1)}" opacity="${f1(0.45 + k * 0.5)}" fill="none" stroke-linecap="round"/>`;
  }
  s += grass;
  for (let i = 0; i < 46 && P.flowers.length; i++) {
    const y = 240 + R() * 550, k = (y - 220) / 580;
    s += `<circle cx="${f1(R() * 400)}" cy="${f1(y)}" r="${f1(0.8 + k * 2)}" fill="${pick(R, P.flowers)}"/>`;
  }
  s += makeBusStopScene();
  if (season === 'winter') s += makeSnowman();
  s += `<rect width="400" height="800" filter="url(#paper)"/>`;
  setSvgImage($('land'), `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">${s}</svg>`);

  // 구름 (흐리거나 비/눈이 오면 더 많고 잿빛)
  const sky = $('sky');
  sky.innerHTML = '';
  const gloomy = ['cloudy', 'rain', 'snow'].includes(weather.kind);
  const CP = gloomy ? { cloudShade: '#bfc5cd' } : P;
  const cl = [[2, 230, 80, -20], [9, 160, 110, -70], [14, 220, 140, -15], [5, 130, 95, -40]];
  if (gloomy) cl.push([0, 300, 90, -55], [11, 260, 120, -95], [6, 240, 100, -5]);
  cl.forEach(([top, w, dur, delay], i) => {
    const c = document.createElement('div');
    c.className = 'cloud';
    c.style.cssText = `top:${top}%;width:${w}px;animation-duration:${dur}s;animation-delay:${delay}s;opacity:${i === 3 ? 0.75 : 0.95}`;
    const img = document.createElement('img');
    img.alt = ''; img.draggable = false; img.style.width = '100%'; img.style.display = 'block';
    setSvgImage(img, makeCloud('cf' + i, 11 + i * 7, CP)
      .replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ').replace('width="100%"', 'width="260" height="120"'));
    c.appendChild(img);
    sky.appendChild(c);
  });

  makeParticles();
  updateSky();
  islandTree.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -110 120 120" width="240" height="240">
      <defs><filter id="wash" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter></defs>
      ${makeTree(77, 100).replace(/<g filter="url\(#wash\)">[\s\S]*?<\/g>/, '')}</svg>`);   // 뿌연 물감 번짐은 빼서 잎·가지만 길을 가려요
}
const islandTree = new Image();

// =====================================================================
//  실시간 하늘: 일출 / 낮 / 일몰 / 밤 (해와 달이 실제 시각에 맞춰 움직여요)
// =====================================================================
const hhmm = d => d.getHours() + d.getMinutes() / 60;
function nowHours() {
  const h = parseFloat(params.get('hour'));       // 테스트용: ?hour=19.5
  return isNaN(h) ? hhmm(new Date()) : h;
}
// 날씨 API에서 일출/일몰 시각을 못 받았을 때 쓰는 서울 기준 근사값
function fallbackSun() {
  const d = new Date(), doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
  const c = Math.cos(2 * Math.PI * (doy + 10) / 365);
  return { rise: 6.45 + 1.27 * c, set: 18.62 - 1.33 * c };
}
// 달의 위상 (0 = 그믐/삭, 0.5 = 보름)
function moonPhase() {
  const days = (Date.now() - Date.UTC(2000, 0, 6, 18, 14)) / 864e5;
  return ((days % 29.530588) + 29.530588) % 29.530588 / 29.530588;
}
function updateSky() {
  const sun = weather.sun || fallbackSun();
  const t = nowHours(), P = SEASONS[season];
  const dawn = Math.abs(t - sun.rise) < 0.6, dusk = Math.abs(t - sun.set) < 0.6;
  const day = t > sun.rise && t < sun.set;
  let skyCols, tint = 'transparent', cel = '';
  // 해/달이 지나가는 큰 호: 왼쪽 지평선에서 떠서 오른쪽 지평선으로 져요
  const arc = f => ({ x: 30 + f * 340, y: 192 - Math.sin(Math.PI * f) * 160 });
  if (day || dawn || dusk) {
    const f = clamp((t - sun.rise) / (sun.set - sun.rise), -0.03, 1.03), p = arc(f);
    skyCols = dawn ? ['#8a97bf', '#f0b9a0', '#fbe2c2'] : dusk ? ['#7684b2', '#ee9f86', '#f8cfa2'] : P.sky;
    if (dawn || dusk) tint = 'rgba(240,140,90,.13)';
    const sc = dawn || dusk ? '#ffcf9a' : '#fff4d6';
    cel = `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="70" fill="url(#glowG)"/>
      <circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="15" fill="${sc}" stroke="rgba(112,104,96,.35)" stroke-width="1"/>`;
  } else {
    // 밤: 별 + 위상에 맞는 달
    const nightLen = 24 - (sun.set - sun.rise);
    const f = ((t - sun.set + 24) % 24) / nightLen, p = arc(clamp(f, 0, 1));
    skyCols = ['#1f2b4a', '#36446d', '#58648e'];
    tint = 'rgba(25,35,80,.42)';
    const R = mulberry32(99);
    for (let i = 0; i < 70; i++) cel += `<circle cx="${f1(R() * 400)}" cy="${f1(R() * 185)}" r="${f1(0.4 + R() * 1.1)}" fill="#fffbe8" opacity="${f1(0.4 + R() * 0.6)}"/>`;
    const ph = moonPhase(), r = 13;
    const dx = ph <= 0.5 ? 4 * r * ph : -4 * r * (1 - ph);
    cel += `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="50" fill="url(#glowG)" opacity=".5"/>
      <circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="${r}" fill="#f6f1dc"/>
      <circle cx="${f1(p.x + dx)}" cy="${f1(p.y)}" r="${r + 0.5}" fill="#2a3758" opacity=".92"/>`;
  }
  ['sk0', 'sk1', 'sk2'].forEach((id, i) => { const el = document.getElementById(id); if (el) el.setAttribute('stop-color', skyCols[i]); });
  const ce = document.getElementById('celestial'); if (ce) ce.innerHTML = cel;
  if (weather.kind === 'rain' || weather.kind === 'cloudy') tint = tint === 'transparent' ? 'rgba(90,100,115,.16)' : tint;
  $('tint').style.background = tint;
}
setInterval(() => { if (!S) updateSky(); }, 60000);

// =====================================================================
//  실제 날씨 (Open-Meteo, API 키 없음). 위치 동의를 안 하면 서울 기준.
// =====================================================================
const SEOUL = { lat: 37.57, lon: 126.98, name: '서울' };
const weather = { kind: 'clear', label: '', temp: null, sun: null, place: '서울' };
const WMO = c => c >= 71 && c <= 77 || c === 85 || c === 86 ? ['snow', '눈']
  : c >= 51 && c <= 67 || c >= 80 && c <= 82 || c >= 95 ? ['rain', '비']
  : c === 45 || c === 48 ? ['cloudy', '안개'] : c === 3 ? ['cloudy', '흐림'] : c === 2 ? ['clear', '구름 조금'] : ['clear', '맑음'];
async function loadWeather(loc) {
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat.toFixed(2)}&longitude=${loc.lon.toFixed(2)}` +
      `&current=temperature_2m,weather_code&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
    const j = await (await fetch(u)).json();
    const [kind, label] = WMO(j.current.weather_code);
    Object.assign(weather, { kind, label, temp: Math.round(j.current.temperature_2m), place: loc.name });
    const sr = new Date(j.daily.sunrise[0]), ss = new Date(j.daily.sunset[0]);
    if (!isNaN(sr) && !isNaN(ss)) weather.sun = { rise: hhmm(sr), set: hhmm(ss) };
  } catch (e) { /* 인터넷이 안 되면 맑은 날 + 서울 근사 일출·일몰로 */ }
  const forced = params.get('weather');            // 테스트용: ?weather=snow / rain / cloudy / clear
  if (['snow', 'rain', 'cloudy', 'clear'].includes(forced)) Object.assign(weather, { kind: forced, label: { snow: '눈', rain: '비', cloudy: '흐림', clear: '맑음' }[forced] });
  $('weather').textContent = weather.label ? `${weather.place} · ${weather.label}${weather.temp !== null ? ' ' + weather.temp + '°' : ''}` : '';
  renderScene();
}
function startWeather() {
  const consent = store.get('busGame.geo', null);
  if (consent === 'yes' && navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      p => loadWeather({ lat: p.coords.latitude, lon: p.coords.longitude, name: '내 위치' }),
      () => loadWeather(SEOUL), { timeout: 8000, maximumAge: 30 * 60000 });
  } else loadWeather(SEOUL);
}
function askLocation() {
  const card = $('card');
  card.innerHTML = `<h2>날씨를 함께 볼까요?</h2>
    <p>지금 계신 곳의 실제 날씨와 해·달을 메인 화면에 보여 드려요.<br>위치는 날씨를 불러올 때만 쓰고 저장하지 않아요.</p>
    <button class="btn" id="geoYes">위치 사용하기</button>
    <button class="btn alt" id="geoNo">서울 날씨로 볼게요</button>`;
  card.querySelector('#geoYes').onclick = () => { store.set('busGame.geo', 'yes'); hideOverlay(); startWeather(); };
  card.querySelector('#geoNo').onclick = () => { store.set('busGame.geo', 'no'); hideOverlay(); startWeather(); };
  $('overlay').classList.add('show');
}

// =====================================================================
//  하트: 최대 5개, 10분마다 1개씩 충전. 실패한 단계를 다시 하거나 그만둘 때 1개 사용.
// =====================================================================
const HEART_MAX = 5, HEART_MS = 10 * 60 * 1000;
const hearts = Object.assign({ n: HEART_MAX, t: Date.now() }, store.get('busGame.hearts', {}));
function refreshHearts() {
  if (hearts.n >= HEART_MAX) { hearts.t = Date.now(); return; }
  const k = Math.floor((Date.now() - hearts.t) / HEART_MS);
  if (k > 0) {
    hearts.n = Math.min(HEART_MAX, hearts.n + k);
    hearts.t = hearts.n >= HEART_MAX ? Date.now() : hearts.t + k * HEART_MS;
    store.set('busGame.hearts', hearts);
  }
}
const heartLeft = () => {
  const ms = Math.max(0, HEART_MS - (Date.now() - hearts.t));
  return `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}`;
};
function useHeart() {
  refreshHearts();
  if (hearts.n <= 0) return false;
  if (hearts.n >= HEART_MAX) hearts.t = Date.now();
  hearts.n--;
  store.set('busGame.hearts', hearts);
  renderHearts();
  return true;
}
const HEART_SVG = `<svg width="18" height="16" viewBox="0 0 20 18" aria-hidden="true"><path d="M10 17 C4 12.5 1 9.5 1 5.8 C1 3 3.2 1 5.7 1 C7.5 1 9 2 10 3.6 C11 2 12.5 1 14.3 1 C16.8 1 19 3 19 5.8 C19 9.5 16 12.5 10 17Z" fill="#e9899b" stroke="#a8a097" stroke-width="1"/></svg>`;
function renderHearts() {
  refreshHearts();
  $('hearts').innerHTML = `${HEART_SVG}${hearts.n}/${HEART_MAX}<small>${hearts.n < HEART_MAX ? heartLeft() : '가득'}</small>`;
}
setInterval(renderHearts, 1000);
// 하트가 있어야 단계를 시작할 수 있어요
function tryStart(n) {
  refreshHearts();
  if (hearts.n <= 0) { toast(`하트가 없어요 · ${heartLeft()} 뒤에 1개 충전`, 2200); return; }
  startLevel(n);
}

// 날리는 것: 비 오는 날엔 비, 겨울이거나 실제로 눈 오는 날엔 눈, 그 밖엔 계절 (벚꽃잎·나뭇잎·단풍).
function makeParticles() {
  const fx = $('fx');
  fx.innerHTML = '';
  const R = Math.random;
  // 겨울엔 항상 눈이 내리고, 실제로 눈이 오는 날엔 더 펑펑 내려요. 비 오는 날엔 비.
  const realSnow = weather.kind === 'snow';
  const kind = weather.kind === 'rain' ? 'rain' : (realSnow || season === 'winter') ? 'snow' : season;
  const n = kind === 'snow' ? (realSnow ? 70 : 40) : kind === 'rain' ? 70 : 20;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'particle' + (kind === 'rain' ? ' rainy' : '');
    p.style.left = (R() * 104 - 2) + '%';
    p.style.animationDuration = (kind === 'rain' ? 0.7 + R() * 0.5 : kind === 'snow' ? 9 + R() * 8 : 11 + R() * 9) + 's';
    p.style.animationDelay = (-R() * 20) + 's';
    let inner;
    if (kind === 'snow') {
      const sz = 2 + R() * 4;
      inner = `<span class="snow" style="width:${sz}px;height:${sz}px"></span>`;
    } else if (kind === 'rain') {
      inner = `<span class="rain"></span>`;
    } else if (kind === 'spring') {
      inner = `<svg width="11" height="10" viewBox="0 0 10 9"><path d="M5 9 C1 6 0 2 3 .5 C4 0 4.6 .8 5 1.6 C5.4 .8 6 0 7 .5 C10 2 9 6 5 9Z" fill="${pick(R, ['#f6c4d2', '#f9d6e0', '#f2b6c7'])}" stroke="#dba2b2" stroke-width=".4"/></svg>`;
    } else if (kind === 'summer') {
      inner = `<svg width="14" height="8" viewBox="0 0 12 7"><path d="M0 3.5 Q6 -2 12 3.5 Q6 9 0 3.5Z" fill="${pick(R, ['#8cc463', '#a6d17a', '#72ab50'])}"/><path d="M.5 3.5 L11 3.5" stroke="#4f7f3a" stroke-width=".5"/></svg>`;
    } else {
      inner = R() < 0.5
        ? `<svg width="16" height="16" viewBox="0 0 20 20"><path d="M10 1 L12 6 L17 4 L15 9 L19 11 L14 12 L15 17 L10 14 L5 17 L6 12 L1 11 L5 9 L3 4 L8 6Z" fill="${pick(R, ['#d9653f', '#e8913f', '#c9472f'])}" stroke="rgba(112,80,60,.5)" stroke-width=".5"/><path d="M10 14 L10 19" stroke="#8a5a3a" stroke-width=".8"/></svg>`
        : `<svg width="14" height="14" viewBox="0 0 20 20"><path d="M10 18 L3 6 Q10 0 17 6Z" fill="${pick(R, GINKGO)}" stroke="rgba(150,110,40,.5)" stroke-width=".5"/><path d="M10 18 L10 20" stroke="#8a6a3a"/></svg>`;
    }
    p.innerHTML = inner;
    if (kind !== 'rain') p.firstElementChild.style.animationDuration = (2 + R() * 2.5) + 's';
    fx.appendChild(p);
  }
}

function setSeason(pref) {
  seasonPref = pref;
  store.set('busGame.seasonPref', pref);
  season = SEASONS[pref] ? pref : seasonByDate();
  renderScene();
  renderMap();
}

// =====================================================================

  const ok = () => {
    const v = inp.value.trim();
    if (!v) { toast('닉네임을 적어 주세요'); inp.focus(); return; }
    nickname = v;
    store.set('busGame.nickname', v);
    updateHello();
    hideOverlay();
    if (first && store.get('busGame.geo', null) === null) askLocation();   // 다음으로 위치 동의 묻기
  };
  card.querySelector('#nickOk').onclick = ok;
  inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
  if (!first) card.querySelector('#ovClose').onclick = () => hideOverlay();
  $('overlay').classList.add('show');
  setTimeout(() => inp.focus(), 50);
}

// 설정 창
function showSettings() {
  if (S && S.over) return;
  const card = $('card');
  card.innerHTML = `<h2>설정</h2>
    <div class="setRow"><span>배경음악</span><label class="switch"><input type="checkbox" id="bgmOn"><span></span></label></div>
    <div class="setRow"><input type="range" id="bgmVol" min="0" max="100" aria-label="배경음악 크기"></div>
    <div class="setRow"><span>효과음</span><label class="switch"><input type="checkbox" id="sfxOn"><span></span></label></div>
    <div class="setRow"><input type="range" id="sfxVol" min="0" max="100" aria-label="효과음 크기"></div>
    <div class="setRow"><span>계절 테마</span></div>
    <div class="seasonPick" id="seasonPick">
      <button data-s="auto">지금 계절</button><button data-s="spring">봄</button><button data-s="summer">여름</button><button data-s="autumn">가을</button><button data-s="winter">겨울</button>
    </div>
    <div class="setRow"><span>닉네임 · ${nickname || '없음'}</span>
      <button class="btn alt" id="nickBtn" style="width:auto;margin:0;padding:6px 14px;font-size:14px">변경</button></div>
    <button class="btn alt" id="ovClose">닫기</button>`;
  card.querySelector('#nickBtn').onclick = () => showNickname(false);
  const markSeason = () => card.querySelectorAll('#seasonPick button').forEach(b => b.classList.toggle('on', b.dataset.s === seasonPref));
  card.querySelectorAll('#seasonPick button').forEach(b => b.onclick = () => { setSeason(b.dataset.s); markSeason(); });
  markSeason();
  const q = s => card.querySelector(s);
  q('#bgmOn').checked = settings.bgmOn;
  q('#sfxOn').checked = settings.sfxOn;
  q('#bgmVol').value = Math.round(settings.bgmVol * 100);
  q('#sfxVol').value = Math.round(settings.sfxVol * 100);
  q('#bgmOn').onchange = e => { settings.bgmOn = e.target.checked; saveSettings(); settings.bgmOn ? startBgm() : stopBgm(); };
  q('#sfxOn').onchange = e => { settings.sfxOn = e.target.checked; saveSettings(); audio(); applyVolumes(); };
  q('#bgmVol').oninput = e => { settings.bgmVol = e.target.value / 100; saveSettings(); audio(); applyVolumes(); };
  q('#sfxVol').oninput = e => { settings.sfxVol = e.target.value / 100; saveSettings(); audio(); applyVolumes(); };
  q('#sfxVol').onchange = () => sfx('go');   // 크기 미리 듣기
  q('#ovClose').onclick = () => hideOverlay();
  $('overlay').classList.add('show');
}

// 단계 원을 눌렀을 때 뜨는 팝업
function showLevelPopup(n) {
  const tier = TIERS[levelTier(n)];
  const card = $('card');
  card.innerHTML = `<h2>${n}단계</h2>
    <div class="stars">${'★'.repeat(tier.stars)}<span class="off">${'★'.repeat(5 - tier.stars)}</span></div>
    <p>난이도 · ${tier.name}${n < unlocked ? '<br>이미 깬 단계예요' : ''}</p>
    <button class="btn" id="ovStart">시작하기</button>
    <button class="btn alt" id="ovClose">닫기</button>`;
  card.querySelector('#ovStart').onclick = () => tryStart(n);
  card.querySelector('#ovClose').onclick = () => hideOverlay();
  $('overlay').classList.add('show');
}

// =====================================================================
//  소리: 피아노 음색을 브라우저에서 직접 합성합니다 (음악 파일 없음)
// =====================================================================
let AC = null, sfxBus = null, bgmBus = null;
function audio() {
  if (AC) return AC;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  // 잔향: 작은 나무 방에서 치는 피아노 느낌
  const len = Math.floor(AC.sampleRate * 2.4);
  const ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
  }
  const verb = AC.createConvolver(); verb.buffer = ir;
  const wet = AC.createGain(); wet.gain.value = 0.3;
  verb.connect(wet).connect(AC.destination);
  sfxBus = AC.createGain(); bgmBus = AC.createGain();
  sfxBus.gain.value = 0; bgmBus.gain.value = 0;
  for (const b of [sfxBus, bgmBus]) { b.connect(AC.destination); b.connect(verb); }
  applyVolumes();
  return AC;
}
function applyVolumes() {
  if (!AC) return;
  const t = AC.currentTime;
  sfxBus.gain.setTargetAtTime(settings.sfxOn ? settings.sfxVol * 0.9 : 0, t, 0.03);
  bgmBus.gain.setTargetAtTime(settings.bgmOn ? settings.bgmVol * 0.55 : 0, t, 0.15);
}
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend(); else AC.resume();
});

// 피아노 한 음: 배음 몇 개 + 빠른 타건 + 천천히 사라지는 울림
function piano(m, t, dur, vel, bus) {
  const f = 440 * Math.pow(2, (m - 69) / 12);
  const out = AC.createGain();
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(Math.min(9000, f * 8), t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(500, f * 2.2), t + 0.9);
  out.connect(lp).connect(bus);
  const end = t + Math.max(0.45, Math.min(dur + 0.6, clamp(3.4 - (m - 48) * 0.045, 0.8, 3.6)));
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(vel, t + 0.008);
  out.gain.exponentialRampToValueAtTime(vel * 0.35, t + 0.35);
  out.gain.exponentialRampToValueAtTime(0.0001, end);
  for (const [h, amp, det] of [[1, 1, 0], [2, 0.45, 2], [3, 0.2, -3], [4, 0.08, 4]]) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = f * h; o.detune.value = det; g.gain.value = amp;
    o.connect(g).connect(out);
    o.start(t); o.stop(end + 0.05);
  }
}

// 버튼 소리 "뿅": 날카로운 배음 없이 둥근 사인파가 살짝 올라가며 작게 사라져요
function blip(t, f0 = 520, f1v = 880, vol = 0.07, len = 0.13, cut = 2200) {
  const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
  o.type = 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1v, t + 0.07);
  lp.type = 'lowpass'; lp.frequency.value = cut;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(lp).connect(g).connect(sfxBus);
  o.start(t); o.stop(t + len + 0.02);
}

// 효과음: "뿅뿅" 느낌을 피아노로
const PENTA = [72, 74, 76, 79, 81, 84, 86, 88];   // 탈 때마다 한 음씩 올라가요
function sfx(kind, arg = 0) {
  if (!settings.sfxOn || !audio()) return;
  if (AC.state === 'suspended') AC.resume();
  const t = AC.currentTime + 0.01, B = sfxBus;
  switch (kind) {
    case 'click':  blip(t); break;                                                            // 뿅 (작고 동그랗게)
    case 'go':     blip(t, 440, 660, 0.05, 0.1, 1300); blip(t + 0.085, 600, 520, 0.045, 0.2, 1100); break;   // 뾰롱 (낮고 부드럽게)
    case 'block':  piano(50, t, 0.2, 0.17, B); piano(49, t + 0.06, 0.25, 0.1, B); break;     // 쿵
    case 'board':  piano(PENTA[arg % PENTA.length], t, 0.12, 0.07, B); break;                 // 폴짝
    case 'depart': [72, 76, 79, 84].forEach((m, i) => piano(m, t + i * 0.07, 0.35, 0.1, B)); break;
    case 'win':    [65, 69, 72, 77, 81, 84].forEach((m, i) => piano(m, t + i * 0.11, 0.9, 0.11, B)); break;
    case 'lose':   [69, 65, 62, 57].forEach((m, i) => piano(m, t + i * 0.18, 0.9, 0.09, B)); break;
  }
}

// 배경음악: 시골의 푸근한 오후 같은 잔잔한 피아노 (F장조, 16마디 반복)
//   마디마다 [왼손 아르페지오 음 5개(낮은→높은), 오른손 멜로디 [시작 박, 길이(박), 음]]
const BPM = 66, BEAT = 60 / BPM;
const SONG = [
  [[41, 48, 53, 57, 60], [[0, 1.5, 69], [1.5, 0.5, 72], [2, 2, 77]]],              // F
  [[40, 48, 52, 55, 60], [[0, 1.5, 76], [1.5, 0.5, 74], [2, 2, 72]]],              // C/E
  [[38, 45, 50, 53, 57], [[0, 1, 74], [1, 1, 77], [2, 1.5, 81], [3.5, 0.5, 79]]],  // Dm
  [[45, 52, 57, 60, 64], [[0, 3, 76]]],                                            // Am
  [[46, 53, 58, 62, 65], [[0, 1.5, 74], [1.5, 0.5, 72], [2, 1, 70], [3, 1, 74]]],  // Bb
  [[45, 48, 53, 57, 60], [[0, 1.5, 72], [1.5, 0.5, 69], [2, 2, 65]]],              // F/A
  [[43, 50, 53, 58, 62], [[0, 1, 67], [1, 1, 70], [2, 1, 74], [3, 1, 77]]],        // Gm7
  [[36, 43, 48, 52, 55], [[0, 2, 76], [2, 2, 72]]],                                // C
  [[41, 48, 53, 57, 60], [[0, 1.5, 77], [1.5, 0.5, 76], [2, 1, 72], [3, 1, 69]]],  // F
  [[45, 52, 57, 60, 64], [[0, 1.5, 72], [1.5, 0.5, 76], [2, 2, 81]]],              // Am
  [[46, 53, 58, 62, 65], [[0, 1, 79], [1, 1, 77], [2, 2, 74]]],                    // Bb
  [[41, 48, 53, 57, 60], [[0, 1, 72], [1, 1, 69], [2, 2, 72]]],                    // F
  [[43, 50, 55, 58, 62], [[0, 1, 70], [1, 1, 74], [2, 1.5, 79], [3.5, 0.5, 77]]],  // Gm
  [[45, 52, 57, 60, 64], [[0, 1.5, 76], [1.5, 0.5, 72], [2, 2, 69]]],              // Am
  [[46, 53, 58, 62, 65], [[0, 1, 74], [1, 1, 72], [2, 1, 70], [3, 1, 67]]],        // Bb
  [[36, 43, 48, 53, 55], [[0, 2, 72], [2, 2, 67]]],                                // Csus4
];
let bgmTimer = null, bgmNext = 0, bgmBar = 0;
const hum = () => (Math.random() - 0.5) * 0.014;     // 사람이 치는 듯한 미세한 흔들림
const vary = () => 0.85 + Math.random() * 0.3;
function scheduleBgm() {
  if (bgmNext < AC.currentTime) bgmNext = AC.currentTime + 0.1;
  while (bgmNext < AC.currentTime + 1.2) {
    const [arp, mel] = SONG[bgmBar % SONG.length], t0 = bgmNext;
    const high = Math.floor(bgmBar / SONG.length) % 2 === 1;   // 두 번째 반복은 한 옥타브 위 오르골 느낌
    [0, 1, 2, 3, 4, 3, 2, 1].forEach((k, i) =>
      piano(arp[k], t0 + i * BEAT / 2 + hum(), BEAT * 0.9, (i === 0 ? 0.06 : 0.032) * vary(), bgmBus));
    mel.forEach(([s, d, m]) =>
      piano(m + (high ? 12 : 0), t0 + s * BEAT + hum(), d * BEAT, (high ? 0.05 : 0.075) * vary(), bgmBus));
    bgmNext += 4 * BEAT;
    bgmBar++;
  }
}
function startBgm() {
  if (!settings.bgmOn || bgmTimer || !audio()) return;
  if (AC.state === 'suspended') AC.resume();
  bgmNext = AC.currentTime + 0.3;
  applyVolumes();
  scheduleBgm();
  bgmTimer = setInterval(scheduleBgm, 300);
}
function stopBgm() {
  clearInterval(bgmTimer);
  bgmTimer = null;
  applyVolumes();
}

// =====================================================================
//  시작!
// =====================================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// 테스트용 주소: ?level=10 (그 단계로 바로), ?season=winter (계절 미리 보기), ?test (닉네임 묻지 않기)
const params = new URLSearchParams(location.search);
if (SEASONS[params.get('season')]) season = params.get('season');
renderScene();
const urlLevel = parseInt(params.get('level'), 10);
renderHearts();
startWeather();
if (urlLevel > 0) startLevel(urlLevel);
else {
  showMenu();
  if (!params.has('test')) {
    if (!nickname) showNickname(true);                                  // 처음 온 사람에게 닉네임 받기
    else if (store.get('busGame.geo', null) === null) askLocation();    // 그다음 위치 동의
  }
}
requestAnimationFrame(loop);
</script>
